<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="themes.css">
<link rel="stylesheet" href="themes/blueprint.css">
<link rel="stylesheet" href="themes/phosphore.css">
<link rel="stylesheet" href="themes/moderne.css">
<link rel="stylesheet" href="themes/dark.css">
<link rel="stylesheet" href="themes/neon.css">
<link rel="stylesheet" href="themes/holograme.css">
<link rel="stylesheet" href="themes/ion.css">
<link rel="stylesheet" href="themes/bento.css">
<link rel="stylesheet" href="themes/widget.css">
<link rel="stylesheet" href="themes/synthwave.css">
<link rel="stylesheet" href="themes/circuit.css">
<script src="i18n.js"></script>
<style>
  /* Style « Affûté » : une échelle typographique sur grille de 4 pt (titre 11 px en capitales,
     valeur héros 44 px fine, libellés 9,5–11 px, valeurs tabulaires 11,5 px), une couleur par sens
     (accent du widget = charge, ambre = alerte, rouge = critique). Aucun hexadécimal : tout vient
     des jetons du thème (--blue, --muted, --hair, --amber, --danger, --font…), d'où un rendu
     correct dans chaque thème. Les classes sont préfixées « w- » pour ne jamais être captées par
     les règles génériques des thèmes (.row, .badge, .stat…).
     Hauteur libre, pas 100 % : c'est le contenu qui décide, et sa mesure est poussée au natif qui
     redimensionne le popover (voir syncPanelHeight). `overflow-y:auto` ne sert que de filet pour
     un panneau plus haut que l'écran — le natif borne déjà la hauteur demandée. */
  *{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;overflow-x:hidden;overflow-y:auto;background:var(--bg);color:var(--text);font:11.5px/20px var(--font);font-variant-numeric:tabular-nums}
  html[data-theme="neon"] body{background:var(--bg-image),var(--bg)}
  /* Regroupé : c'est la fenêtre (html) qui défile, pas le body — un body à overflow non visible devient
     son propre conteneur de défilement et l'en-tête « sticky » ne collerait plus à rien. */
  html[data-mode="grouped"] body{overflow:visible}
  .panel{padding:12px 14px 14px;width:100%}
  .w-hd{display:flex;align-items:center;gap:8px;height:24px}
  .w-gl{width:24px;height:24px;border-radius:min(var(--radius),8px);display:grid;place-items:center;color:var(--k);flex:none;
    background:color-mix(in srgb,var(--k) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--k) 38%,transparent)}
  .w-hd h1{margin:0;font:600 11px/24px var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* Sélecteur du niveau de détail : trois segments égaux, le segment actif prend la teinte du widget. */
  .w-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin:8px 0 0;padding:2px;background:var(--soft);border:1px solid var(--hair);border-radius:min(var(--radius),8px)}
  .w-seg button{appearance:none;border:0;margin:0;padding:0 4px;height:20px;font:500 10px/20px var(--font);letter-spacing:.02em;color:var(--muted);background:transparent;
    border-radius:min(var(--radius),6px);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .w-seg button:hover{color:var(--text)}
  .w-seg button.on{color:var(--text);background:color-mix(in srgb,var(--k) 20%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--k) 42%,transparent)}
  .w-seg button:focus-visible{outline:1px solid var(--k);outline-offset:1px}
  .w-hero{display:flex;justify-content:space-between;align-items:flex-end;margin:12px 0 8px;min-height:44px}
  .w-hv{font:300 44px/44px var(--font);letter-spacing:-.02em;color:var(--text);white-space:nowrap}
  html[data-theme="neon"] .w-hv{text-shadow:0 0 18px color-mix(in srgb,var(--k) 28%,transparent)}
  .w-hv small{font:400 16px/16px var(--font);color:var(--muted);letter-spacing:0;margin-left:2px}
  .w-b[data-state=warn] .w-hv{color:var(--amber)}.w-b[data-state=crit] .w-hv{color:var(--danger)}
  .w-facts{display:grid;grid-template-columns:8px auto auto;gap:0 8px;align-items:center;justify-items:start;font-size:11px;line-height:20px;color:var(--muted);padding-bottom:2px}
  .w-facts b{justify-self:end;color:var(--text);font-weight:500;font-size:11.5px;margin-left:4px}
  .w-dot{display:inline-block;width:8px;height:8px;border-radius:min(var(--radius),3px);flex:none}
  .w-dot.rd{border-radius:50%}.w-dot.free{background:transparent;box-shadow:inset 0 0 0 1px var(--hair-strong)}
  .w-f1{display:flex;flex-direction:column;align-items:flex-end;line-height:16px;font-size:11px;color:var(--muted);padding-bottom:4px;min-width:0;text-align:right}
  .w-f1 b{font:500 15px/20px var(--font);color:var(--text);white-space:nowrap}
  svg.w-chart{display:block;width:100%;height:auto;overflow:visible}
  .w-chart .w-g{stroke:var(--hair-strong);stroke-width:1;stroke-dasharray:1 3;stroke-linecap:round;opacity:.7}
  .w-chart .w-gb{stroke:var(--hair-strong);stroke-width:1}
  .w-chart .w-line{fill:none;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
  .w-ticks{display:flex;justify-content:space-between;font-size:9.5px;line-height:16px;color:var(--muted);margin-top:2px}
  .w-sec{border-top:1px solid var(--hair);margin-top:12px;padding-top:12px}
  .w-sl{font:600 9.5px/16px var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .w-list{display:flex;flex-direction:column}
  .w-br{display:grid;grid-template-columns:minmax(0,1fr) 56px minmax(36px,max-content);gap:8px;align-items:center;height:20px}
  .w-br.w3{grid-template-columns:minmax(0,1fr) 36px minmax(34px,max-content) minmax(34px,max-content);gap:6px}
  .w-bn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
  .w-bt{height:4px;border-radius:2px;background:var(--hair);overflow:hidden}
  .w-bt i{display:block;height:100%;border-radius:2px;background:var(--k)}
  .w-bv{text-align:right;color:var(--text);font-weight:500;white-space:nowrap}
  .w-bv2{text-align:right;color:var(--muted);white-space:nowrap;font-size:10.5px}
  .w-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .w-tile{background:var(--soft);border:1px solid var(--hair);border-radius:min(var(--radius),10px);padding:8px 10px;min-width:0;display:flex;flex-direction:column}
  .w-tile.span2{grid-column:1/-1}
  .w-tile.warn .w-tv{color:var(--amber)}.w-tile.crit .w-tv{color:var(--danger)}
  .w-tl{font:600 9.5px/16px var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .w-tv{font:500 15px/20px var(--font);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .w-trip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .w-trip span{display:flex;flex-direction:column;min-width:0}
  .w-trip b{font:500 15px/20px var(--font);color:var(--text)}
  .w-trip span:not(:first-child) b{color:var(--muted)}
  .w-trip em{font:400 10px/14px var(--font);font-style:normal;color:var(--muted)}
  .w-cores{display:flex;gap:12px;align-items:flex-start}
  .w-grp{min-width:0}
  .w-gt{font:400 10px/16px var(--font);color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:4px;margin-bottom:4px}
  .w-sq{width:8px;height:8px;border-radius:min(var(--radius),3px);background:var(--k);display:inline-block}.w-sq.e{background:color-mix(in srgb,var(--k) 50%,transparent)}
  .w-cg{display:grid;gap:4px}
  .w-core{display:flex;flex-direction:column;align-items:center;gap:4px}
  .w-core .w-ct{display:flex;align-items:flex-end;width:100%;border-radius:min(var(--radius),5px);background:var(--hair);overflow:hidden}
  .w-core .w-ct i{display:block;width:100%;border-radius:min(var(--radius),5px);background:var(--k);min-height:4px}
  .w-core.e .w-ct i{background:color-mix(in srgb,var(--k) 52%,transparent)}
  .w-core.warn .w-ct i{background:var(--amber)}.w-core.crit .w-ct i{background:var(--danger)}
  .w-core em{font:400 9.5px/12px var(--font);font-style:normal;color:var(--muted)}
  .w-split{display:flex;gap:2px;height:10px}
  .w-split i{display:block;height:100%;border-radius:min(var(--radius),3px);min-width:3px}
  .w-split::after{content:"";flex:1;border-radius:min(var(--radius),3px);background:var(--hair)}
  .w-lr{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:8px;align-items:center;height:20px}
  .w-lr.p{grid-template-columns:8px minmax(0,1fr) auto 32px}
  .w-lr span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.w-lr b{font-weight:500;color:var(--text);white-space:nowrap}
  .w-lr em{font-style:normal;color:var(--muted);text-align:right;font-size:10.5px}
  .w-card{background:var(--soft);border:1px solid var(--hair);border-radius:min(var(--radius),10px);padding:4px 12px 8px}
  .w-kv{display:flex;justify-content:space-between;align-items:center;gap:10px;height:20px}
  .w-kv .k{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;display:flex;align-items:center;gap:8px}
  .w-kv .v{font-weight:500;color:var(--text);white-space:nowrap;flex:none;text-align:right}
  .w-kv.sw{border-top:1px solid var(--hair);margin-top:8px;padding-top:8px;height:28px}
  .w-ok{display:inline-flex;align-items:center;gap:8px;font:500 11.5px/20px var(--font);white-space:nowrap;flex:none}
  .w-ok.warn{color:var(--amber)}.w-ok.crit{color:var(--danger)}
  .w-pg{display:flex;gap:4px;margin-top:4px}
  .w-pg i{flex:1;height:4px;border-radius:2px;background:var(--hair)}
  .w-dual{display:grid;grid-template-columns:1fr 1fr;margin:12px 0 8px}
  .w-dc{padding-right:8px;min-width:0}.w-dc+.w-dc{padding:0 0 0 12px;border-left:1px solid var(--hair)}
  .w-dcl{display:flex;align-items:center;gap:8px;font-size:11px;line-height:20px;color:var(--muted)}
  .w-ab{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--c);flex:none;
    background:color-mix(in srgb,var(--c) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent)}
  .w-dv{font:300 28px/36px var(--font);letter-spacing:-.01em;white-space:nowrap;color:var(--text)}
  .w-dv small{font:400 11px/16px var(--font);color:var(--muted);margin-left:2px;letter-spacing:0}
  .w-if{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;height:20px}
  .w-if .n{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .w-if .d,.w-if .u{text-align:right;white-space:nowrap;font-weight:500}
  .w-if .d{color:var(--chart-a)}.w-if .u{color:var(--chart-b)}
  .w-vol+.w-vol{margin-top:8px}
  .w-vol .vh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .w-vol .vn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .w-vol .vf{color:var(--muted);white-space:nowrap;flex:none;font-size:10.5px}
  .w-vol .w-bt{height:6px;border-radius:3px;margin-top:2px}.w-vol .w-bt i{border-radius:3px}
  .w-vol .cap{font-size:10px;line-height:16px;color:var(--muted);margin-top:2px}
  .w-track{height:6px;border-radius:3px;background:var(--hair);overflow:hidden;margin:4px 0 8px}.w-track i{display:block;height:100%;border-radius:3px;background:var(--k)}
  /* Fenêtre de la courbe : min / moy. / max, une ligne par série. */
  .w-mam{display:grid;grid-template-columns:max-content repeat(3,1fr);gap:0 8px;align-items:center}
  .w-mam .h{font:600 9.5px/16px var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right}
  .w-mam .l{display:flex;align-items:center;gap:6px;color:var(--muted);line-height:20px}
  .w-mam b{font-weight:500;color:var(--text);text-align:right;white-space:nowrap;line-height:20px;font-size:11px}
  .w-empty{color:var(--muted);padding:14px 0;text-align:center}
  /* Popup « Regroupé » : tous les widgets activés dans un seul panneau de 300 px. L'en-tête (titre +
     sélecteur global) reste collé en haut pendant que le corps défile ; chaque widget est une carte
     compacte au niveau Résumé, une section empilée aux niveaux Détaillé et Hyper détaillé. */
  .panel.grouped #w-top{position:sticky;top:0;z-index:2;margin:-12px -14px 0;padding:12px 14px 10px;background:var(--bg);border-bottom:1px solid var(--hair)}
  html[data-theme="neon"] .panel.grouped #w-top{background:var(--bg-image),var(--bg);background-attachment:fixed}
  .panel.grouped #w-top .w-seg{margin-top:8px}
  .w-gcs{display:flex;flex-direction:column;gap:6px;padding-top:10px}
  .w-gc{display:grid;grid-template-columns:24px minmax(0,1fr) 96px;grid-template-rows:34px 16px;column-gap:10px;align-items:center;
    background:var(--soft);border:1px solid var(--hair);border-radius:min(var(--radius),10px);padding:6px 10px 6px;min-height:64px}
  .w-gc .w-gl{align-self:center}
  .w-gm{min-width:0;display:flex;flex-direction:column;justify-content:center}
  .w-gn{font:600 9.5px/12px var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .w-gv{font:300 22px/24px var(--font);letter-spacing:-.01em;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .w-gv small{font:400 11px/14px var(--font);color:var(--muted);margin-left:2px;letter-spacing:0}
  .w-gc[data-state=warn] .w-gv{color:var(--amber)}.w-gc[data-state=crit] .w-gv{color:var(--danger)}
  .w-gcv{min-width:0;align-self:stretch;display:flex;align-items:center}
  .w-gk{grid-column:2/-1;font-size:10.5px;line-height:16px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .w-gs+.w-gs{border-top:1px solid var(--hair-strong);margin-top:16px;padding-top:16px}
  .w-gs:first-child{padding-top:10px}
  .w-gs .w-hero{margin-top:10px}
</style>
</head>
<body>
<div class="panel" id="panel"><div class="w-empty">…</div></div>
<script>
const send=(action,extra={})=>window.webkit?.messageHandlers?.native?.postMessage({action,...extra});
// widgetId = identité du panneau : un id de widget, ou « grouped » pour le popup regroupé. Dans ce
// dernier, secId désigne le widget en cours de rendu : les renderers lisent ses interrupteurs de section
// (on) et sa couleur via cur(), alors que le niveau de détail reste celui du panneau (« grouped »).
let widgetId=null,metrics=null,secId=null;
const GROUPED='grouped';
const isGrouped=()=>widgetId===GROUPED;
const cur=()=>secId||widgetId;
const famGet=id=>metrics?.families?.find(f=>f.id===id);
const sysNow=()=>famGet('system')?.now||{};
const procs=()=>metrics?.processes||[];
// Sections activables par panneau (prefs.panels[widgetId][section]). Absent = affiché (défaut on).
const on=section=>(metrics?.prefs?.panels?.[cur()]||{})[section]!==false;
// Niveau de détail du panneau : 0 résumé, 1 détaillé (défaut — le contenu historique), 2 hyper
// détaillé. Mémorisé par widget côté natif (prefs.detail[widgetId]) ; « grouped » porte le niveau global
// du popup regroupé (défaut : Résumé).
const level=()=>{const v=metrics?.prefs?.detail?.[widgetId];return v===0||v===1||v===2?v:isGrouped()?0:1};
// Une section s'affiche si le niveau atteint son minimum ET qu'aucun interrupteur explicite des
// Réglages ne la coupe : « off » l'emporte toujours, quel que soit le niveau.
const vis=(key,min)=>level()>=min&&(!key||on(key));
const I=StatusI18n;
// Unités et nombres suivent la langue : « Ko » / « KB », « 12,5 » / « 12.5 », « j » / « d ».
const pctN=v=>v==null?'—':Math.round(v);
const pct=v=>v==null?'—':I.pct(Math.round(v));
const sizeUnits=()=>['b','kb','mb','gb','tb'].map(k=>t('unit.'+k));
const scale=(v,max)=>{let i=0;while(v>=1024&&i<max){v/=1024;i++}return [v,i]};
const fmtRate=v=>{if(v==null||isNaN(v))return '—';const [x,i]=scale(v,3);return I.num(i&&x<10?x:Math.round(x),i&&x<10?1:0)+' '+sizeUnits()[i]+'/s'};
const fmtSize=v=>{if(v==null||isNaN(v))return '—';const [x,i]=scale(v,4);return I.num(i&&x<10?x:Math.round(x),i&&x<10?1:0)+' '+sizeUnits()[i]};
const fmtGo=v=>{if(v==null||isNaN(v))return '—';return I.num(v/1073741824,1)+' '+t('unit.gb')};
const fmtMin=m=>{if(m==null)return '—';const h=Math.floor(m/60),mm=Math.round(m%60);return h?`${h} ${t('unit.hour')} ${String(mm).padStart(2,'0')}`:`${mm} ${t('unit.min')}`};
const fmtDur=s=>{if(s==null)return '—';const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
  if(d)return `${d} ${t('unit.day')} ${h} ${t('unit.hour')}`;if(h)return `${h} ${t('unit.hour')} ${String(m).padStart(2,'0')}`;return `${m} ${t('unit.min')}`};
const fmtDeg=v=>v==null||isNaN(v)?'—':Math.round(v)+'°';
const fin=v=>typeof v==='number'&&isFinite(v);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
// Gravité d'une valeur en pourcentage : ambre dès `warn`, rouge dès `crit`. Même langage que
// l'icône de la barre des menus : le popup et l'icône disent la même chose.
const sev=(v,warn=80,crit=95)=>!fin(v)?'ok':v>=crit?'crit':v>=warn?'warn':'ok';

// ── Habillage commun ───────────────────────────────────────────────────────────
// Une couleur d'accent et un glyphe par widget (--k alimente pastille, valeur, barres, segment actif).
const KEYC={cpu:'var(--blue)',gpu:'var(--purple)',memory:'var(--green)',network:'var(--chart-a)',temperature:'var(--amber)',battery:'var(--green)',disk:'var(--chart-b)'};
const GL=body=>`<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
const GLYPH={
  cpu:GL('<rect x="4" y="4" width="8" height="8" rx="1.6"/><rect x="6.6" y="6.6" width="2.8" height="2.8" rx=".6"/><path d="M6 1.5v2.5M10 1.5v2.5M6 12v2.5M10 12v2.5M1.5 6h2.5M1.5 10h2.5M12 6h2.5M12 10h2.5"/>'),
  gpu:GL('<rect x="1.5" y="3.5" width="13" height="8" rx="1.6"/><circle cx="8" cy="7.5" r="2.4"/><path d="M4 13.8h8"/>'),
  memory:GL('<rect x="1.5" y="4.5" width="13" height="6" rx="1.2"/><path d="M4.5 10.5v3M8 10.5v3M11.5 10.5v3M4.5 7.5h2M9.5 7.5h2"/>'),
  network:GL('<path d="M5 13V3M2.6 5.4 5 3l2.4 2.4M11 3v10M8.6 10.6 11 13l2.4-2.4"/>'),
  temperature:GL('<path d="M6.5 9.2V3.6a1.5 1.5 0 0 1 3 0v5.6a3 3 0 1 1-3 0z"/><path d="M8 6.2v4.4"/>'),
  battery:GL('<rect x="1.5" y="4.5" width="11.5" height="7" rx="1.6"/><path d="M14.5 7v2M7.4 5.9 5.8 8.2h2.4L6.6 10.5"/>'),
  disk:GL('<circle cx="8" cy="8" r="5.8"/><circle cx="8" cy="8" r="1.7"/>')};
const ARROW={dn:'<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v10M4 9l4 4 4-4"/></svg>',
  up:'<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V3M4 7l4-4 4 4"/></svg>'};
// Les trois niveaux : libellé court dans le segment, libellé complet en infobulle.
const LV_SHORT=[()=>t('w.detail.l0'),()=>t('w.detail.l1'),()=>t('w.detail.l2')];
const LV_LONG=[()=>t('w.detail.t0'),()=>t('w.detail.t1'),()=>t('w.detail.t2')];
function levelSel(){
  const cur=level();
  return `<div class="w-seg" role="group" aria-label="${t('w.detail.label')}">${[0,1,2].map(i=>
    `<button type="button" class="${i===cur?'on':''}" aria-pressed="${i===cur}" title="${LV_LONG[i]()}" onmousedown="setDetail(${i})" onclick="setDetail(${i})">${LV_SHORT[i]()}</button>`).join('')}</div>`;
}
// Le niveau choisi part au natif (mémorisé par widget) et s'applique tout de suite côté page ; la
// mesure de hauteur repart de zéro pour que le popover se redimensionne au nouveau contenu.
function setDetail(l){
  if(!widgetId||l===level())return;
  if(!metrics)metrics={};
  metrics.prefs={...(metrics.prefs||{}),detail:{...(metrics.prefs?.detail||{}),[widgetId]:l}};
  send('setWidgetDetail',{id:widgetId,level:l});
  pushedHeight=0;
  render();
}
// Un panneau = en-tête fixe (pastille, titre, sélecteur) + corps vivant. render() ne remplace que
// le corps à chaque tick : le sélecteur survit, son infobulle et le clic ne se perdent pas.
const MARK='<!--w-body-->';
// En mode regroupé, le sélecteur de niveau est celui de l'en-tête global : la section d'un widget n'a que sa pastille et son nom.
const topHTML=title=>`<div class="w-hd" style="--k:${KEYC[cur()]||'var(--blue)'}"><span class="w-gl">${GLYPH[cur()]||''}</span><h1>${title}</h1></div>${isGrouped()?'':levelSel()}`;
const popup=(title,state,body)=>`${topHTML(title)}${MARK}<div class="w-b" data-state="${state||'ok'}" data-lv="${level()}" style="--k:${KEYC[cur()]||'var(--blue)'}">${body}</div>`;
const hero=(val,unit,side)=>`<div class="w-hero"><div class="w-hv">${val}${unit?`<small>${unit}</small>`:''}</div>${side||''}</div>`;
// Deux lignes « pastille · libellé · valeur » à droite de la valeur héros.
const facts=list=>`<div class="w-facts">${list.map(([c,l,v])=>`<i class="w-dot" style="background:${c}"></i><span>${l}</span><b>${v}</b>`).join('')}</div>`;
const f1=inner=>`<div class="w-f1">${inner}</div>`;
const sec=(label,inner)=>inner?`<div class="w-sec">${label?`<div class="w-sl">${label}</div>`:''}${inner}</div>`:'';
const kv=(k,v)=>`<div class="w-kv"><span class="k">${k}</span><span class="v">${v}</span></div>`;
const tile=(l,v,cls)=>`<div class="w-tile${cls?' '+cls:''}"><span class="w-tl">${l}</span><b class="w-tv">${v}</b></div>`;
const dotted=(color,label)=>`<i class="w-dot" style="background:${color}"></i>${label}`;
const barRow=(name,w,val,color)=>`<div class="w-br"><span class="w-bn">${name}</span><span class="w-bt"><i style="width:${Math.max(0,Math.min(100,w)).toFixed(1)}%${color?`;background:${color}`:''}"></i></span><span class="w-bv">${val}</span></div>`;
const heightFor=()=>[44,56,64][level()];

// Courbe en aire à dégradé discret, repères pointillés à 25/50/75 %, point terminal cerclé.
// Une ou deux séries ; échelle % fixe (percent) ou auto (débits, températures). L'aire est toujours
// remplie : elle donne le niveau d'un coup d'œil et occupe le cadre. Sans elle, une série plate
// (batterie pleine, CPU au repos) laissait un grand rectangle vide qui se lisait comme une zone morte.
let chartUid=0;
// Largeur utile d'un graphique : celle du contenu du panneau (264 − 2×14, ou 300 − 2×14 en regroupé).
// `mini` : version de carte (pas de repères ni de halo), pour la ligne de résumé du popup regroupé.
const chartWidth=()=>isGrouped()?272:236;
function chart(list,{percent=true,h=heightFor(),w=chartWidth(),mini=false}={}){
  const drawn=list.map(s=>({...s,values:(s.values||[]).filter(fin)})).filter(s=>s.values.length>1);
  if(!drawn.length)return '';
  const pw=w-6,y0=5,bot=h-2,span=bot-y0,len=Math.max(...drawn.map(s=>s.values.length)),uid=++chartUid;
  // Échelle auto : 12 % d'air au-dessus de la crête. Calée pile sur le maximum, la courbe collait
  // au bord haut du cadre et se lisait comme saturée en permanence.
  const max=percent?100:Math.max(1,...drawn.flatMap(s=>s.values))*1.12;
  const X=(off,j)=>(off+j)/(len-1)*pw,Y=v=>bot-Math.min(Math.max(v,0),max)/max*span;
  let defs='',shapes='',dots='';
  drawn.forEach((s,i)=>{const off=len-s.values.length,c=s.color||'var(--chart-a)',last=s.values.length-1;
    const d='M'+s.values.map((v,j)=>`${X(off,j).toFixed(1)},${Y(v).toFixed(1)}`).join(' L');
    defs+=`<linearGradient id="wg${uid}_${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${c};stop-opacity:.34"/><stop offset="1" style="stop-color:${c};stop-opacity:.02"/></linearGradient>`;
    shapes+=`<path d="${d} L${X(off,last).toFixed(1)},${bot} L${X(off,0).toFixed(1)},${bot} Z" style="fill:url(#wg${uid}_${i})"/><path class="w-line" d="${d}" style="stroke:${c}"/>`;
    const cx=X(off,last).toFixed(1),cy=Y(s.values[last]).toFixed(1);
    dots+=(mini?'':`<circle cx="${cx}" cy="${cy}" r="4.5" style="fill:none;stroke:${c};stroke-opacity:.35"/>`)+`<circle cx="${cx}" cy="${cy}" r="${mini?2:2.4}" style="fill:${c}"/>`;
  });
  const grid=mini?'':[.25,.5,.75].map(f=>`<line class="w-g" x1="0" x2="${w}" y1="${(bot-f*span).toFixed(1)}" y2="${(bot-f*span).toFixed(1)}"/>`).join('');
  return `<svg class="w-chart" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-hidden="true"><defs>${defs}</defs>${grid}${mini?'':`<line class="w-gb" x1="0" x2="${w}" y1="${bot+.5}" y2="${bot+.5}"/>`}${shapes}${dots}</svg>`;
}
const series=(fam,key,color)=>({values:(fam?.series?.[key])||[],color});
// Graduations temporelles sous la courbe (niveau hyper détaillé) : la fenêtre = nombre de points ×
// cadence d'échantillonnage envoyée par le natif.
function fmtAgo(sec){return sec>=90?`−${I.numMax(sec/60,1)} ${t('unit.min')}`:`−${Math.round(sec)} ${t('unit.sec')}`}
function ticks(list){
  const len=Math.max(0,...list.map(s=>(s.values||[]).filter(fin).length));
  const sec=(len-1)*(metrics?.intervalSeconds>0?metrics.intervalSeconds:1);
  if(len<2||!(sec>=2))return '';
  return `<div class="w-ticks"><span>${fmtAgo(sec)}</span><span>${fmtAgo(sec/2)}</span><span>${t('w.detail.now')}</span></div>`;
}
// Min / moy. / max de la fenêtre affichée, une ligne par série. rows=[{label,color,values}].
function winTable(rows,fmt){
  const usable=rows.map(r=>({...r,v:(r.values||[]).filter(fin)})).filter(r=>r.v.length>1);
  if(!usable.length)return '';
  return `<div class="w-mam"><span></span><span class="h">${t('w.detail.min')}</span><span class="h">${t('w.detail.avg')}</span><span class="h">${t('w.detail.max')}</span>`
    +usable.map(r=>{const mn=Math.min(...r.v),mx=Math.max(...r.v),av=r.v.reduce((a,b)=>a+b,0)/r.v.length;
      return `<span class="l">${r.color&&r.label?`<i class="w-dot" style="background:${r.color}"></i>`:''}${r.label||''}</span><b>${fmt(mn)}</b><b>${fmt(av)}</b><b>${fmt(mx)}</b>`}).join('')+`</div>`;
}
// Courbe + (niveau 2) graduations et statistiques de la fenêtre.
const plot=(list,fmt,{percent=true,labels=[]}={})=>{
  const c=chart(list,{percent});
  if(!c)return '';
  return c+(level()>=2?ticks(list)+`<div style="margin-top:8px">${winTable(list.map((s,i)=>({...s,label:labels[i]||'',color:labels[i]?s.color:null})),fmt)}</div>`:'');
};

// Barre empilée (segments de la mémoire) + lignes de légende. segs=[{label,value,color,fmt}].
function splitBar(segs,total,{free=null,freeLabel='',shares=false}={}){
  if(!total)return '';
  const bar=segs.map(s=>`<i style="width:${(100*s.value/total).toFixed(2)}%;background:${s.color}"></i>`).join('');
  const share=v=>shares?`<em>${I.pct(Math.round(100*v/total))}</em>`:'';
  const row=(dot,label,v,fmt)=>`<div class="w-lr${shares?' p':''}">${dot}<span>${label}</span><b>${fmt(v)}</b>${share(v)}</div>`;
  const legend=segs.map(s=>row(`<i class="w-dot" style="background:${s.color}"></i>`,s.label,s.value,s.fmt)).join('')
    +(free!=null?row('<i class="w-dot free"></i>',freeLabel,free,fmtGo):'');
  return `<div class="w-split">${bar}</div><div class="w-list" style="margin-top:12px">${legend}</div>`;
}
// Liste de processus : top `n` triés par `key`, valeur formatée par `fmt`, barre normalisée au
// max. `second` ({key,fmt}) ajoute une colonne (niveau hyper détaillé).
function procList(key,fmt,n=5,second=null){
  const list=procs().filter(p=>fin(p[key])).sort((a,b)=>b[key]-a[key]).slice(0,n);
  if(!list.length)return `<div class="w-empty">${t('w.measuring')}</div>`;
  const max=Math.max(1,...list.map(p=>p[key]));
  return `<div class="w-list">${list.map(p=>`<div class="w-br${second?' w3':''}"><span class="w-bn">${esc(p.name||'—')}</span><span class="w-bt"><i style="width:${(100*p[key]/max).toFixed(1)}%"></i></span><span class="w-bv">${fmt(p[key])}</span>${second?`<span class="w-bv2">${fin(p[second.key])?second.fmt(p[second.key]):'—'}</span>`:''}</div>`).join('')}</div>`;
}
const procCount=()=>level()>=2?10:5;

function coresBlock(n){
  const L=level(),idx=Object.keys(n).filter(k=>/^core\d+$/.test(k)).map(k=>+k.slice(4)).sort((a,b)=>a-b);
  if(!idx.length)return '';
  const types=typeof n.coreTypes==='string'?n.coreTypes:null;
  const cell=(i,e)=>{const v=n['core'+i];
    return `<span class="w-core${e?' e':''}${sev(v)==='ok'?'':' '+sev(v)}"><span class="w-ct" style="height:${L>=2?44:34}px"><i style="height:${Math.max(4,Math.min(100,fin(v)?v:0))}%"></i></span>${L>=2?`<em>${fin(v)?Math.round(v):'—'}</em>`:''}</span>`};
  if(!types)return `<div class="w-cg" style="grid-template-columns:repeat(${Math.min(idx.length,12)},1fr)">${idx.map(i=>cell(i,false)).join('')}</div>`;
  const P=idx.filter(i=>types[i]!=='E'),E=idx.filter(i=>types[i]==='E');
  // Côte à côte jusqu'à 16 cœurs (une grille de colonnes égales) ; au-delà, un groupe par rangée.
  const side=idx.length<=16;
  const grp=(label,list,e)=>list.length?`<div class="w-grp" style="${side?`flex:${list.length} 1 0`:''}"><div class="w-gt"><i class="w-sq${e?' e':''}"></i>${label} · ${list.length}</div><div class="w-cg" style="grid-template-columns:repeat(${side?list.length:12},1fr)">${list.map(i=>cell(i,e)).join('')}</div></div>`:'';
  return `<div class="w-cores" style="${side?'':'flex-direction:column;align-items:stretch;gap:12px'}">${grp(t('w.cores.performance'),P,false)}${grp(t('w.cores.efficiency'),E,true)}</div>`;
}

// Libellés partagés entre les panneaux détaillés et les cartes du résumé regroupé.
const pressureLabel=lv=>({1:t('w.mem.pressure.normal'),2:t('w.mem.pressure.high'),4:t('w.mem.pressure.critical')}[lv]||'');
const thermalLabel=th=>[[t('w.temp.normal'),''],[t('w.temp.high'),'warn'],[t('w.temp.serious'),'warn'],[t('w.temp.throttled'),'crit']][th]||[t('w.temp.normal'),''];
const batteryState=n=>n.charging?t('w.bat.charging'):n.externalConnected?(n.fullyCharged?t('w.bat.pluggedFull'):t('w.bat.plugged')):t('w.bat.onBattery');
const batteryRemain=n=>n.minutesRemaining!=null?`${fmtMin(n.minutesRemaining)} · ${n.charging?t('w.bat.untilFull'):t('w.bat.runtime')}`:'';
const batteryLow=n=>n.percent!=null&&!n.charging&&!n.externalConnected?(n.percent<=10?'crit':n.percent<=20?'warn':'ok'):'ok';
const tempState=(th,c)=>['ok','warn','crit'][Math.max(th>=3?2:th>=1?1:0,fin(c)?(c>=95?2:c>=85?1:0):0)];
const memState=lv=>lv===4?'crit':lv===2?'warn':'ok';

function renderCPU(){
  const f=famGet('cpu');if(!f)return empty(t('w.cpu'));const n=f.now,s=sysNow(),L=level();
  // Découpe utilisateur/système à droite de la valeur héros (au lieu d'une barre séparée : la courbe
  // montre déjà la charge, les deux lignes disent d'où elle vient).
  const side=on('split')&&n.userPercent!=null?facts([['var(--chart-a)',t('w.cpu.user'),I.pct(Math.round(n.userPercent))],['var(--amber)',t('w.cpu.system'),I.pct(Math.round(n.systemPercent||0))]]):'';
  const sysSeries=on('split')&&(f.series?.systemPercent||[]).length>1?[series(f,'systemPercent','var(--amber)')]:[];
  const list=[series(f,'total','var(--chart-a)'),...sysSeries];
  const loads=s.load1!=null?`<div class="w-tile span2"><span class="w-tl">${t('w.cpu.load')}</span><span class="w-trip"><span><b>${I.numMax(s.load1,2)}</b><em>1 ${t('unit.min')}</em></span><span><b>${I.numMax(s.load5,2)}</b><em>5 ${t('unit.min')}</em></span><span><b>${I.numMax(s.load15,2)}</b><em>15 ${t('unit.min')}</em></span></span></div>`:'';
  const tiles=loads+(s.processCount!=null?tile(t('w.cpu.processes'),s.processCount):'')+(s.uptimeSec!=null?tile(t('w.cpu.uptime'),fmtDur(s.uptimeSec)):'');
  return popup(t('w.cpu'),sev(n.total),
    hero(pctN(n.total),'%',side)
    +plot(list,pct,{labels:L>=2?[t('w.cpu'),t('w.cpu.system')]:[]})
    +(vis('cores',1)?sec('',coresBlock(n)):'')
    +(vis('load',1)&&tiles?sec('',`<div class="w-tiles">${tiles}</div>`):'')
    +(vis('processes',1)?sec(t('w.cpu.processSection'),procList('cpuPercent',v=>I.pct(Math.round(v)),procCount(),L>=2?{key:'rssBytes',fmt:fmtSize}:null)):''));
}
function renderMemory(){
  const f=famGet('ram');if(!f)return empty(t('w.memory'));const n=f.now,L=level();
  const lv=n.pressureLevel,pcol=lv===4?'var(--danger)':lv===2?'var(--amber)':'var(--green)',pcls=lv===4?'crit':lv===2?'warn':'';
  const P=pressureLabel(lv);
  // Pression : l'indicateur qui compte sur macOS (un pourcentage utilisé élevé est normal, le cache
  // se remplit). Trois crans : vert, ambre, rouge.
  const swapLine=L>=2&&n.swapUsedBytes!=null?`<div class="w-kv sw"><span class="k">${t('w.mem.swap')}</span><span class="v">${n.swapTotalBytes!=null?`${fmtSize(n.swapUsedBytes)} / ${fmtSize(n.swapTotalBytes)}`:fmtSize(n.swapUsedBytes)}</span></div>`:'';
  const pressure=P?`<div class="w-card"><div class="w-kv"><span class="k">${t('w.mem.pressure')}</span><span class="w-ok ${pcls}" style="${pcls?'':'color:var(--green)'}"><i class="w-dot rd" style="background:${pcol}"></i>${P}</span></div><span class="w-pg" style="color:${pcol}">${[0,1,2].map(i=>`<i style="${i<(lv===4?3:lv===2?2:1)?`background:${pcol}`:''}"></i>`).join('')}</span>${swapLine}</div>`:'';
  let breakdown='';
  if(n.totalBytes){
    // Au niveau détaillé, libellés abrégés (historique) ; en hyper détaillé, libellés complets et part de chaque segment.
    const full=L>=2;
    const segs=[
      {label:full?t('w.detail.mem.app'):t('w.mem.app'),value:n.appBytes||0,color:'var(--blue)',fmt:fmtGo},
      {label:full?t('w.detail.mem.wired'):t('w.mem.wired'),value:n.wiredBytes||0,color:'var(--purple)',fmt:fmtGo},
      {label:full?t('w.detail.mem.compressed'):t('w.mem.compressed'),value:n.compressedBytes||0,color:'var(--amber)',fmt:fmtGo},
      {label:full?t('w.detail.mem.cache'):t('w.mem.cache'),value:n.cachedBytes||0,color:'var(--muted)',fmt:fmtGo},
    ];
    breakdown=splitBar(segs,n.totalBytes,{free:n.freeBytes,freeLabel:full?t('w.detail.mem.free'):t('w.mem.free'),shares:full});
  }
  const stats=[];
  if(n.usedBytes!=null)stats.push(tile(t('w.mem.used'),fmtGo(n.usedBytes)));
  if(n.freeBytes!=null)stats.push(tile(t('w.mem.freeLower'),fmtGo(n.freeBytes)));
  if(n.cachedBytes!=null)stats.push(tile(t('w.mem.cacheLower'),fmtGo(n.cachedBytes)));
  if(n.swapUsedBytes!=null)stats.push(tile(t('w.mem.swap'),fmtSize(n.swapUsedBytes),n.swapUsedBytes>2147483648?'warn':''));
  return popup(t('w.memory'),memState(lv),
    hero(pctN(n.usedPercent),'%',n.totalBytes?f1(`<b>${fmtGo(n.totalBytes)}</b><span>${t('w.total',{v:''}).trim()}</span>`):'')
    +plot([series(f,'usedPercent','var(--chart-a)')],pct)
    +sec('',pressure)
    +(vis('breakdown',1)?sec('',breakdown):'')
    +(vis('stats',1)&&stats.length?sec('',`<div class="w-tiles">${stats.join('')}</div>`):'')
    +(vis('processes',1)?sec(t('w.mem.processSection'),procList('rssBytes',fmtSize,procCount(),L>=2?{key:'cpuPercent',fmt:v=>I.pct(Math.round(v))}:null)):''));
}
function renderGPU(){
  const f=famGet('gpu');if(!f)return empty(t('w.gpu'));const n=f.now,L=level();
  // Pas de liste de processus ici : aucune API n'expose la charge GPU par processus sur Apple
  // Silicon. On s'en tient à ce qui est mesurable — charge globale, étages, mémoire.
  const stages=[];
  if(n.renderer!=null)stages.push(barRow(t('w.gpu.renderer'),n.renderer,pct(n.renderer),'var(--k)'));
  if(n.tiler!=null)stages.push(barRow(t('w.gpu.tiler'),n.tiler,pct(n.tiler),'var(--k)'));
  const rows=L>=2?[series(f,'usage','var(--chart-a)'),series(f,'renderer','var(--purple)'),series(f,'tiler','var(--amber)')]:[];
  const stats=L>=2?winTable([{label:t('w.gpu'),color:'var(--chart-a)',values:rows[0].values},{label:t('w.gpu.renderer'),color:'var(--purple)',values:rows[1].values},{label:t('w.gpu.tiler'),color:'var(--amber)',values:rows[2].values}],pct):'';
  return popup(t('w.gpu'),sev(n.usage),
    hero(pctN(n.usage),'%',n.memInUse!=null?f1(`<span>${t('w.gpu.memory')}</span><b>${fmtSize(n.memInUse)}</b>`):'')
    +chart([series(f,'usage','var(--chart-a)')])+(L>=2?ticks([series(f,'usage')]):'')
    +(vis('stages',1)&&stages.length?sec('',`<div class="w-list">${stages.join('')}</div>`):'')
    +(stats?sec('',stats):''));
}
function renderNetwork(){
  const f=famGet('network');if(!f)return empty(t('w.network'));const n=f.now,L=level();
  // Seules les interfaces qui transmettent réellement. Sans ce filtre, six tunnels VPN (utun*) à
  // 0 o/s noyaient la seule interface active — la liste ne disait plus rien.
  const all=[...new Set(Object.keys(n).filter(k=>k.startsWith('rx:')).map(k=>k.slice(3)))];
  const ifaces=all.filter(nm=>(n['rx:'+nm]||0)+(n['tx:'+nm]||0)>0)
    .sort((a,b)=>((n['rx:'+b]||0)+(n['tx:'+b]||0))-((n['rx:'+a]||0)+(n['tx:'+a]||0))).slice(0,L>=2?all.length:4);
  const hidden=all.length-ifaces.length;
  const split=v=>{const s=fmtRate(v),i=s.lastIndexOf(' ');return i<0?[s,'']:[s.slice(0,i),s.slice(i+1)]};
  const col=(dir,c,label,v)=>{const [x,u]=split(v);return `<div class="w-dc"><div class="w-dcl"><span class="w-ab" style="--c:${c}">${ARROW[dir]}</span>${label}</div><div class="w-dv">${x}<small>${u}</small></div></div>`};
  // Deux débits de même importance : deux colonnes de même poids, chacune avec sa flèche.
  const dual=`<div class="w-dual">${col('dn','var(--chart-a)',t('w.net.received'),n.rxBytesPerSec)}${col('up','var(--chart-b)',t('w.net.sent'),n.txBytesPerSec)}</div>`;
  const list=[series(f,'rxBytesPerSec','var(--chart-a)'),series(f,'txBytesPerSec','var(--chart-b)')];
  const ifRows=ifaces.map(nm=>`<div class="w-if"><span class="n">${esc(nm)}</span><span class="d">↓ ${fmtRate(n['rx:'+nm])}</span><span class="u">↑ ${fmtRate(n['tx:'+nm])}</span></div>`).join('')
    ||`<div class="w-kv"><span class="k">${t('w.net.noTraffic')}</span></div>`;
  const inactive=hidden>0&&ifaces.length?`<div class="w-kv"><span class="k">${t('w.net.inactive',{n:hidden})}</span></div>`:'';
  return popup(t('w.network'),'ok',
    dual
    +chart(list,{percent:false})+(L>=2?ticks(list):'')
    +(L>=2?sec('',winTable([{label:'↓',color:'var(--chart-a)',values:list[0].values},{label:'↑',color:'var(--chart-b)',values:list[1].values}],fmtRate)):'')
    +(vis('interfaces',1)?sec('',`<div class="w-list">${ifRows}${inactive}</div>`):'')
    +(vis('session',1)&&n.rxSessionBytes!=null?sec(t('w.net.session'),`<div class="w-tiles">${tile(t('w.net.received'),fmtSize(n.rxSessionBytes))}${tile(t('w.net.sent'),fmtSize(n.txSessionBytes))}</div>`):''));
}
function renderTemperature(){
  const f=famGet('sensors');if(!f)return empty(t('w.sensors'));const n=f.now,L=level();
  const th=n.thermalState,T=thermalLabel(th);
  const fans=Object.keys(n).filter(k=>/^fan\d+$/.test(k)).sort();
  // Détail par famille. Les noms de capteurs Apple Silicon sont opaques (« PMU tdie3 ») : on ne
  // peut pas honnêtement étiqueter « CPU » ou « GPU », d'où « SoC » / « périphériques ».
  const det=[];
  if(n.dieMaxC!=null)det.push(kv(t('w.temp.soc'),t('w.temp.maxAvg',{max:Math.round(n.dieMaxC),avg:Math.round(n.dieAvgC)})));
  if(n.deviceMaxC!=null)det.push(kv(t('w.temp.devices'),t('w.temp.maxAvg',{max:Math.round(n.deviceMaxC),avg:Math.round(n.deviceAvgC)})));
  const batt=famGet('battery')?.now;
  if(batt?.temperatureC!=null)det.push(kv(t('w.battery').toLowerCase(),Math.round(batt.temperatureC)+' °C'));
  if(L>=2){
    if(n.dieCount!=null)det.push(kv(t('w.detail.temp.dieCount'),n.dieCount));
    if(n.deviceCount!=null)det.push(kv(t('w.detail.temp.deviceCount'),n.deviceCount));
  }
  const fanRows=fans.length?fans.map((k,i)=>kv(fans.length>1?t('w.temp.fanN',{n:i+1}):t('w.temp.fan'),I.num(Math.round(n[k]),0)+' '+t('unit.rpm'))).join(''):kv(t('w.temp.fans'),t('w.temp.noFans'));
  const list=[series(f,'tempC','var(--amber)')];
  return popup(t('w.sensors'),tempState(th,n.tempC),
    hero(n.tempC==null?'—':Math.round(n.tempC),'°C',n.dieMaxC!=null?f1(`<span>${t('w.temp.hotspot')}</span>`):'')
    +(vis('chart',0)?chart(list,{percent:false})+(L>=2?ticks(list)+`<div style="margin-top:8px">${winTable(list,fmtDeg)}</div>`:''):'')
    +sec('',kv(t('w.temp.state'),`<span class="w-ok ${T[1]}"><i class="w-dot rd" style="background:${T[1]==='crit'?'var(--danger)':T[1]==='warn'?'var(--amber)':'var(--green)'}"></i>${T[0]}</span>`))
    +(vis('detail',1)&&det.length?sec('',det.join('')):'')
    +(vis('fans',1)?sec('',fanRows):''));
}
function renderBattery(){
  const f=famGet('battery');if(!f)return empty(t('w.battery'));const n=f.now,L=level();
  const state=batteryState(n);
  const stats=[];
  if(n.healthPercent!=null)stats.push(tile(t('w.bat.health'),I.pct(Math.round(n.healthPercent)),n.healthPercent<80?'warn':''));
  if(n.cycleCount!=null)stats.push(tile(t('w.bat.cycles'),n.cycleCount));
  if(n.powerWatts!=null&&n.powerWatts!==0)stats.push(tile(n.powerWatts<0?t('w.bat.discharge'):t('w.bat.charge'),`${n.powerWatts<0?'↓':'↑'} ${I.numMax(Math.abs(n.powerWatts),1)} W`));
  if(n.minutesRemaining!=null)stats.push(tile(n.charging?t('w.bat.untilFull'):t('w.bat.runtime'),fmtMin(n.minutesRemaining)));
  const rows=[];
  if(n.temperatureC!=null)rows.push(kv(t('w.bat.temperature'),Math.round(n.temperatureC)+' °C'));
  if(n.voltageV!=null)rows.push(kv(t('w.bat.voltage'),I.num(n.voltageV,2)+' V'));
  if(n.fullCapacity!=null&&n.designCapacity!=null)rows.push(kv(t('w.bat.capacity'),`${I.num(n.fullCapacity,0)} / ${I.num(n.designCapacity,0)} mAh`));
  if(n.adapterWatts!=null&&n.adapterWatts>0)rows.push(kv(t('w.bat.charger'),n.adapterWatts+' W'));
  if(n.conditionOK!=null)rows.push(kv(t('w.bat.condition'),`<span class="w-ok ${n.conditionOK?'':'warn'}">${n.conditionOK?t('w.bat.conditionOK'):t('w.bat.conditionCheck')}</span>`));
  // Hyper détaillé : l'état brut de la batterie, tel que le système le rapporte.
  const yn=v=>v?t('w.detail.yes'):t('w.detail.no');
  const raw=[];
  if(n.charging!=null)raw.push(kv(t('w.detail.bat.charging'),yn(n.charging)));
  if(n.externalConnected!=null)raw.push(kv(t('w.detail.bat.plugged'),yn(n.externalConnected)));
  if(n.fullyCharged!=null)raw.push(kv(t('w.detail.bat.full'),yn(n.fullyCharged)));
  const low=batteryLow(n);
  const remain=n.minutesRemaining!=null?`<span>${batteryRemain(n)}</span>`:'';
  // Pas de barre de niveau ici : le grand pourcentage la double déjà, et la courbe en donne
  // l'historique. (Sans courbe — réglage « historique » coupé — la barre reprend ce rôle.)
  const list=[series(f,'percent','var(--green)')];
  return popup(t('w.battery'),low,
    hero(n.percent==null?'—':Math.round(n.percent),'%',f1(`<b>${state}</b>${remain}`))
    +(vis('chart',0)?chart(list)+(L>=2?ticks(list)+`<div style="margin-top:8px">${winTable(list,pct)}</div>`:''):`<div class="w-track"><i style="width:${n.percent??0}%"></i></div>`)
    +(vis('stats',1)&&stats.length?sec('',`<div class="w-tiles">${stats.join('')}</div>`):'')
    +(vis('details',1)&&rows.length?sec('',rows.join('')):'')
    +(L>=2&&n.healthPercent!=null?sec(t('w.bat.health'),`<div class="w-track"><i style="width:${Math.max(0,Math.min(100,n.healthPercent))}%"></i></div>`):'')
    +(L>=2&&raw.length?sec('',raw.join('')):''));
}
function renderDisk(){
  const f=famGet('disk');if(!f)return empty(t('w.disk'));const n=f.now,L=level();
  const vols=Object.keys(n).filter(k=>k.startsWith('vol:')).sort();
  const volHTML=vols.map(k=>{const mnt=k.slice(4);const p=Math.round(n[k]);
    const tot=n['volTotal:'+mnt],free=n['volFree:'+mnt];
    const label=mnt==='/'?t('w.disk.systemVolume'):mnt.replace('/Volumes/','');
    // Forme courte « 88 / 926 Go » : en toutes lettres, le pied poussait le nom du volume à
    // l'ellipse (« Macintosh… »). L'unité de l'espace libre n'est omise que si elle est identique
    // à celle du total — sinon « 800 / 1,2 To » ferait lire 800 To au lieu de 800 Mo.
    const [freeNum,freeUnit]=fmtSize(free).split(' '),totalUnit=fmtSize(tot).split(' ')[1];
    const foot=tot!=null?`${freeUnit===totalUnit?freeNum:fmtSize(free)} / ${fmtSize(tot)}`:I.pct(p);
    const color=sev(p,80,90)==='crit'?'var(--danger)':sev(p,80,90)==='warn'?'var(--amber)':'var(--k)';
    const cap=L>=2&&tot!=null&&free!=null?`<div class="cap">${t('w.detail.disk.used')} ${fmtSize(tot-free)} · ${t('w.mem.freeLower')} ${fmtSize(free)} · ${I.pct(p)}</div>`:'';
    return `<div class="w-vol"><div class="vh"><span class="vn">${esc(label)}</span><span class="vf">${foot}</span></div><div class="w-bt"><i style="width:${Math.max(0,Math.min(100,p))}%;background:${color}"></i></div>${cap}</div>`;
  }).join('');
  const list=[series(f,'readBytesPerSec','var(--chart-a)'),series(f,'writeBytesPerSec','var(--chart-b)')];
  return popup(t('w.disk'),sev(n.usedPercent,80,90),
    hero(pctN(n.usedPercent),'%',n.totalBytes?f1(`<b>${fmtSize(n.totalBytes)}</b><span>${t('w.total',{v:''}).trim()}</span>`):'')
    +(vis('chart',0)?chart(list,{percent:false})+(L>=2?ticks(list):'')
      +sec('',kv(dotted('var(--chart-a)',t('w.disk.read')),fmtRate(n.readBytesPerSec))+kv(dotted('var(--chart-b)',t('w.disk.write')),fmtRate(n.writeBytesPerSec)))
      +(L>=2?sec('',winTable([{label:t('w.disk.read'),color:'var(--chart-a)',values:list[0].values},{label:t('w.disk.write'),color:'var(--chart-b)',values:list[1].values}],fmtRate)):''):'')
    +(vis('volumes',1)&&volHTML?sec(t('w.disk.volumes'),volHTML):''));
}
function empty(title){return popup(title,'ok',`<div class="w-empty">${t('w.measuring')}</div>`)}
const RENDERERS={cpu:renderCPU,memory:renderMemory,gpu:renderGPU,network:renderNetwork,temperature:renderTemperature,battery:renderBattery,disk:renderDisk};

// ── Popup regroupé ─────────────────────────────────────────────────────────────
// Un seul panneau pour tous les widgets activés dans la barre des menus (prefs.widgets : ids système,
// dans leur ordre d'affichage, fournis par le natif). Le niveau est global (prefs.detail.grouped) :
//   · Résumé (0)            une carte compacte par widget : nom, valeur, mini-courbe, une ligne clé ;
//   · Détaillé / Hyper (1,2) les renderers existants, empilés — mêmes sections, mêmes interrupteurs.
// Rien n'est calculé ici : tout vient du snapshot moniteur déjà fourni.
const groupedIds=()=>(Array.isArray(metrics?.prefs?.widgets)?metrics.prefs.widgets:[]).filter((id,i,a)=>RENDERERS[id]&&a.indexOf(id)===i);
const GL_ALL=GL('<rect x="2" y="2" width="5" height="5" rx="1.2"/><rect x="9" y="2" width="5" height="5" rx="1.2"/><rect x="2" y="9" width="5" height="5" rx="1.2"/><rect x="9" y="9" width="5" height="5" rx="1.2"/>');
const splitUnit=str=>{const i=str.lastIndexOf(' ');return i<0?[str,'']:[str.slice(0,i),str.slice(i+1)]};
// Données d'une carte de résumé, par widget : {title, state, val, unit, list, percent, line}. Les
// interrupteurs de section restent respectés (split du CPU, courbe de la température/batterie/disque).
const SUMMARY={
  cpu(){const f=famGet('cpu');if(!f)return {title:t('w.cpu')};const n=f.now;
    const sysSeries=on('split')&&(f.series?.systemPercent||[]).length>1?[series(f,'systemPercent','var(--amber)')]:[];
    return {title:t('w.cpu'),state:sev(n.total),val:pctN(n.total),unit:'%',list:[series(f,'total','var(--chart-a)'),...sysSeries],
      line:on('split')&&n.userPercent!=null?`${t('w.cpu.user')} ${I.pct(Math.round(n.userPercent))} · ${t('w.cpu.system')} ${I.pct(Math.round(n.systemPercent||0))}`:''}},
  memory(){const f=famGet('ram');if(!f)return {title:t('w.memory')};const n=f.now,P=pressureLabel(n.pressureLevel);
    const used=n.usedBytes!=null&&n.totalBytes?`${fmtGo(n.usedBytes)} / ${fmtGo(n.totalBytes)}`:'';
    return {title:t('w.memory'),state:memState(n.pressureLevel),val:pctN(n.usedPercent),unit:'%',list:[series(f,'usedPercent','var(--chart-a)')],
      line:[used,P?`${t('w.mem.pressure')} ${P}`:''].filter(Boolean).join(' · ')}},
  gpu(){const f=famGet('gpu');if(!f)return {title:t('w.gpu')};const n=f.now;
    return {title:t('w.gpu'),state:sev(n.usage),val:pctN(n.usage),unit:'%',list:[series(f,'usage','var(--chart-a)')],
      line:n.memInUse!=null?`${t('w.gpu.memory')} ${fmtSize(n.memInUse)}`:''}},
  network(){const f=famGet('network');if(!f)return {title:t('w.network')};const n=f.now,[x,u]=splitUnit(fmtRate(n.rxBytesPerSec));
    return {title:t('w.network'),val:fin(n.rxBytesPerSec)?`↓ ${x}`:null,unit:u,percent:false,list:[series(f,'rxBytesPerSec','var(--chart-a)'),series(f,'txBytesPerSec','var(--chart-b)')],
      line:n.txBytesPerSec!=null?`↑ ${fmtRate(n.txBytesPerSec)}`+(n.rxSessionBytes!=null?` · ${t('w.net.session')} ↓ ${fmtSize(n.rxSessionBytes)} ↑ ${fmtSize(n.txSessionBytes)}`:''):''}},
  temperature(){const f=famGet('sensors');if(!f)return {title:t('w.sensors')};const n=f.now,fans=Object.keys(n).filter(k=>/^fan\d+$/.test(k)).sort();
    const rpm=fans.length?`${I.num(Math.round(n[fans[0]]),0)} ${t('unit.rpm')}`:'';
    return {title:t('w.sensors'),state:tempState(n.thermalState,n.tempC),val:n.tempC==null?'—':Math.round(n.tempC),unit:'°C',percent:false,
      list:on('chart')?[series(f,'tempC','var(--amber)')]:[],line:[thermalLabel(n.thermalState)[0],rpm].filter(Boolean).join(' · ')}},
  battery(){const f=famGet('battery');if(!f)return {title:t('w.battery')};const n=f.now;
    return {title:t('w.battery'),state:batteryLow(n),val:n.percent==null?'—':Math.round(n.percent),unit:'%',list:on('chart')?[series(f,'percent','var(--green)')]:[],
      line:[batteryState(n),batteryRemain(n)].filter(Boolean).join(' · ')}},
  disk(){const f=famGet('disk');if(!f)return {title:t('w.disk')};const n=f.now;
    return {title:t('w.disk'),state:sev(n.usedPercent,80,90),val:pctN(n.usedPercent),unit:'%',percent:false,
      list:on('chart')?[series(f,'readBytesPerSec','var(--chart-a)'),series(f,'writeBytesPerSec','var(--chart-b)')]:[],
      line:n.freeBytes!=null&&n.totalBytes?`${fmtSize(n.freeBytes)} ${t('w.mem.freeLower')} / ${fmtSize(n.totalBytes)}`:''}}
};
function summaryCard(id){
  secId=id;
  try{
    const c=SUMMARY[id]();
    // Sans aucune donnée mesurée : tiret et « mesure en cours », jamais de valeur inventée.
    const waiting=c.val==null;
    return `<div class="w-gc" id="g-${id}" data-state="${c.state||'ok'}" style="--k:${KEYC[id]||'var(--blue)'}"><span class="w-gl">${GLYPH[id]||''}</span>`
      +`<div class="w-gm"><span class="w-gn">${c.title}</span><span class="w-gv">${waiting?'—':c.val}${!waiting&&c.unit?`<small>${c.unit}</small>`:''}</span></div>`
      +`<div class="w-gcv">${chart(c.list||[],{percent:c.percent!==false,h:34,w:96,mini:true})}</div>`
      +`<div class="w-gk">${waiting?t('w.measuring'):c.line||''}</div></div>`;
  }finally{secId=null}
}
function groupedSection(id){
  secId=id;
  try{const [top,body]=RENDERERS[id]().split(MARK);return `<section class="w-gs" id="g-${id}">${top}${body||''}</section>`}
  finally{secId=null}
}
// En-tête fixe : titre + sélecteur global. Le corps suit le niveau : cartes ou sections empilées.
function renderGrouped(){
  const ids=groupedIds(),L=level();
  const top=`<div class="w-hd" style="--k:var(--blue)"><span class="w-gl">${GL_ALL}</span><h1>${t('w.group.all')}</h1></div>${levelSel()}`;
  const body=!ids.length?`<div class="w-empty">${t('w.group.empty')}</div>`
    :L===0?`<div class="w-gcs">${ids.map(summaryCard).join('')}</div>`:ids.map(groupedSection).join('');
  return `${top}${MARK}${body}`;
}
// Le panneau se dimensionne sur son contenu : niveau de détail, sections activables, nombre
// d'interfaces réseau ou de volumes, liste de processus… d'un widget à l'autre la hauteur va du
// simple au triple. Une taille figée côté natif coupait net les panneaux longs. On mesure donc après
// chaque rendu et on pousse la hauteur ; le natif borne et ne redimensionne que sur changement réel.
let pushedHeight=0,renderedKey=null,renderedTop=null;
function syncPanelHeight(){
  const el=document.querySelector('#panel');
  if(!el)return;
  const h=Math.ceil(el.getBoundingClientRect().height);
  if(!h||Math.abs(h-pushedHeight)<1)return;
  pushedHeight=h;
  send('resizeWidgetPanel',{id:widgetId,height:h});
}
function render(){
  if(metrics?.prefs?.theme)document.documentElement.dataset.theme=metrics.prefs.theme;
  const r=isGrouped()?renderGrouped:RENDERERS[widgetId];
  const panel=document.querySelector('#panel');
  panel.className=isGrouped()?'panel grouped':'panel';
  document.documentElement.dataset.mode=isGrouped()?'grouped':'separate';
  // Changement de niveau (clic ici ou réglage poussé par le natif) ou de liste de widgets
  // (regroupé) : l'ancienne mesure ne vaut plus.
  const key=widgetId+':'+level()+(isGrouped()?':'+groupedIds().join(','):'');
  if(key!==renderedKey){pushedHeight=0;renderedKey=key}
  const [top,body]=(r?r():`<div class="w-empty">—</div>`).split(MARK);
  if(body===undefined){panel.innerHTML=top;renderedTop=null}
  else{
    if(top!==renderedTop){panel.innerHTML=`<div id="w-top">${top}</div><div id="w-body"></div>`;renderedTop=top}
    document.querySelector('#w-body').innerHTML=body;
  }
  // Après le calcul de mise en page, sinon on mesure la hauteur d'avant.
  const after=()=>{syncPanelHeight();applyFocus()};
  if(typeof requestAnimationFrame==='function')requestAnimationFrame(after);else after();
}
// Popup regroupé : le clic sur l'icône d'un widget amène sa section sous l'en-tête fixe. Le focus est
// consommé une fois (un tick ou un changement de niveau ne fait pas re-défiler) ; il reste armé un
// instant pour résister au redimensionnement du popover qui suit la première mesure.
let focusId=null,focusUntil=0;
function applyFocus(){
  if(focusId&&Date.now()>focusUntil)focusId=null;
  if(!focusId||!isGrouped())return;
  const el=document.querySelector('#g-'+focusId),head=document.querySelector('#w-top');
  if(!el||typeof window.scrollTo!=='function')return;
  const top=el.getBoundingClientRect().top+(window.scrollY||0)-(head?.offsetHeight||0)-10;
  window.scrollTo(0,Math.max(0,Math.round(top)));
}
function setFocus(id){focusId=id&&RENDERERS[id]?id:null;focusUntil=Date.now()+700}
// Tick incrémental : même mécanique que dashboard.html — le natif n'envoie les séries qu'à
// l'ouverture, ensuite `now` seul et la série glisse ici (plafond 300, comme l'anneau natif).
const METRICS_RING=300;
function mergeMetricsDelta(state,payload){
  if(!payload?.delta)return payload;
  if(!state)return null;
  const families=(payload.families||[]).map(d=>{
    const prev=(state.families||[]).find(f=>f.id===d.id);
    const series={...(prev?.series||{})};
    for(const[k,v]of Object.entries(d.now||{})){
      if(typeof v!=='number')continue;
      const grown=(series[k]||[]).concat(v);
      series[k]=grown.length>METRICS_RING?grown.slice(grown.length-METRICS_RING):grown;
    }
    return{...d,series};
  });
  const merged={...state,...payload,families};
  delete merged.delta;
  return merged;
}
StatusI18n.onChange(()=>{pushedHeight=0;renderedTop=null;if(metrics)render()});
window.addEventListener?.('resize',applyFocus);
window.StatusWidget={
  // Changement de widget : la hauteur précédente n'a plus de sens, on force une remesure.
  // `focus` (popup regroupé seulement) : id du widget dont l'icône vient d'être cliquée.
  show(id,data,focus){if(id!==widgetId){pushedHeight=0;renderedTop=null;if(id!==GROUPED)focusId=null}widgetId=id;if(focus)setFocus(focus);metrics=mergeMetricsDelta(metrics,data)||metrics;render()},
  updateMetrics(data){const m=mergeMetricsDelta(metrics,data);if(m){metrics=m;render()}}
};
</script>
</body>

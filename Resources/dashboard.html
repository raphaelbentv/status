<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="themes.css">
<style>
  /* Le thème actif vient de themes.css ([data-theme] sur <html>, poussé par render()).
     --chart-a/--chart-b restent les marques de graphique du Moniteur, définies par thème. */
  *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.45 var(--font)}button,select{font:inherit;color:inherit}
  .shell{height:100%;display:grid;grid-template-columns:210px 1fr;padding-top:28px;background:var(--bg);
    background-image:var(--bg-image,linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px));
    background-size:var(--bg-size,22px 22px,22px 22px)}
  .sidebar{display:flex;flex-direction:column;background:var(--sidebar);border-right:1px solid var(--hair-strong);padding:20px 14px 16px}
  .product{font-size:14px;font-weight:700;letter-spacing:.06em;margin:6px 12px 24px;color:var(--blue);text-transform:uppercase}
  .nav button,.sidebar-bottom button{position:relative;width:100%;border:1px solid transparent;background:transparent;border-radius:var(--radius);padding:9px 12px 9px 32px;text-align:left;color:var(--muted);cursor:pointer;margin-bottom:3px}
  .nav button:hover,.sidebar-bottom button:hover{background:var(--soft);border-color:var(--hair);color:var(--text)}
  .nav button::before{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.6;font-size:11px;line-height:1}
  .nav button[data-view="overview"]::before{content:"01"}.nav button[data-view="connections"]::before{content:"02"}.nav button[data-view="monitor"]::before{content:"03"}.nav button[data-view="settings"]::before{content:"04"}
  .nav button.active{background:var(--soft-hover);border-color:var(--hair-strong);color:var(--blue);font-weight:700}
  .nav button.active::before{opacity:1;color:var(--blue)}
  .sidebar-spacer{flex:1}.sidebar-bottom{border-top:1px solid var(--hair);padding-top:10px}
  .connection-state{display:flex;align-items:center;gap:8px;padding:7px 12px;color:var(--muted);font-size:10.5px}
  .connection-state i{width:6px;height:6px;background:#3A424D}.connection-state i.live{background:var(--green)}.connection-state i.warn{background:var(--amber)}
  main{overflow:auto;padding:0 34px 40px}.view{display:none;animation:enter .15s ease-out}.view.active{display:block}@keyframes enter{from{opacity:0}to{opacity:1}}
  .toolbar{height:78px;border-bottom:1px solid var(--hair-strong);display:flex;align-items:center;gap:12px}
  .toolbar h1{font-size:13px;letter-spacing:.1em;margin:0;font-weight:700;text-transform:uppercase;color:var(--blue)}
  .toolbar-meta{margin-left:auto;color:var(--muted);font-size:10px}
  .button{border:1px solid var(--hair-strong);border-radius:var(--radius);background:var(--soft);padding:7px 10px;cursor:pointer;color:var(--blue)}
  .button:hover{background:var(--soft-hover)}.button[disabled]{opacity:.52;cursor:default}
  /* Cartouche de plan : le chiffre clé encadré, comme une cote sur un dessin technique. */
  .hero{position:relative;padding:24px 20px;border-bottom:1px solid var(--hair-strong);border-left:1px solid var(--hair);border-right:1px solid var(--hair);margin-top:-1px;background:linear-gradient(90deg,color-mix(in srgb,var(--hero,var(--blue)) 7%,transparent),transparent 60%);clip-path:var(--clip,none);box-shadow:var(--edge-glow,none)}
  .hero:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:repeating-linear-gradient(0deg,var(--hero,var(--blue)) 0 4px,transparent 4px 8px)}
  .hero-line{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
  .hero-value .unit{font-size:.4em;margin-left:.08em;opacity:.65;font-weight:400}
  .hero-value{font-size:52px;font-weight:700;line-height:.94;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--hero,var(--blue));text-shadow:var(--value-glow,none)}
  .hero-label{font-size:13px;color:var(--muted)}
  .hero-detail{font-size:11.5px;color:var(--muted);margin:16px 0 0}.hero-detail strong{color:var(--hero,var(--blue));font-weight:700}
  /* align-items:start — OpenAI n'a qu'une fenêtre contre trois à Claude ; sans cela son bloc
     s'étirerait à vide sur toute la hauteur de la rangée. */
  .provider-blocks{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px;align-items:start}
  .provider-block{border:1px solid var(--hair);border-radius:var(--radius);background:var(--panel-bg);padding:20px;position:relative;clip-path:var(--clip,none)}
  .provider-block:before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:2px;background:var(--provider)}
  .provider-block-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .provider{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;color:var(--provider);text-transform:lowercase;letter-spacing:.04em}
  .provider-dot{width:6px;height:6px;background:var(--provider)}
  .status-label{font-size:10px;color:var(--muted);white-space:nowrap}
  .status-label i{display:inline-block;width:5px;height:5px;background:var(--provider);margin-right:7px}
  .freshness{font-size:10px;color:var(--muted);margin:-8px 0 12px}.freshness.stale{color:var(--amber)}
  .section-head{display:flex;align-items:flex-start;gap:20px;margin:26px 0 20px}
  .section-head h2{font-size:12px;letter-spacing:.1em;margin:0 0 5px;font-weight:700;text-transform:uppercase;color:var(--text)}
  .section-head p{margin:0;color:var(--muted);font-size:11.5px}
  .connections{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .connection-panel{border:1px solid var(--hair);border-radius:var(--radius);background:var(--panel-bg);padding:22px;min-height:300px;position:relative;clip-path:var(--clip,none)}
  .connection-panel:before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:2px;background:var(--blue)}
  .connection-panel:nth-child(2):before{background:var(--purple)}
  .connection-panel h3{font-size:12px;margin:0 0 4px;font-weight:700;color:var(--blue);text-transform:lowercase;letter-spacing:.04em}
  .connection-panel:nth-child(2) h3{color:var(--purple)}
  .connection-panel>p{color:var(--muted);margin:0 0 20px;font-size:11.5px}
  .quota-block{border-top:1px solid var(--hair);padding-top:18px}
  .account-row{display:flex;gap:10px;align-items:center;margin-bottom:15px}
  .account-copy{min-width:0;flex:1}.account-copy strong,.account-copy small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .account-copy small{color:var(--muted);font-size:9.5px;margin-top:3px}
  .account-actions{display:flex;gap:6px}
  .account-action{border:1px solid var(--hair-strong);border-radius:var(--radius);background:var(--soft);padding:6px 9px;cursor:pointer;font-size:10px;color:var(--text)}
  .account-action:hover{background:var(--soft-hover)}
  .account-action.primary{background:var(--provider);border-color:var(--provider);color:#0B0F14;font-weight:700}
  .account-action[disabled]{opacity:.5}
  .quota-grid{display:grid;gap:9px}
  .quota-card{padding:11px 12px;border:1px solid var(--hair);border-radius:var(--radius);background:var(--soft)}
  .quota-top{display:flex;justify-content:space-between;gap:12px}
  .quota-top span{font-weight:700;font-size:11px;color:var(--text)}
  .quota-top strong{font-variant-numeric:tabular-nums;color:var(--provider);text-shadow:var(--value-glow,none)}
  /* Trame par défaut : la mesure dit « mesure », pas « barre de progression » — hachure par
     défaut (blueprint/phosphore), qu'un thème peut remplacer par un aplat ou un dégradé
     (voir themes.css). --provider est réellement hérité ici, contrairement à un alias
     --rail-fill qui figerait var(--provider) invalide à son propre niveau de déclaration. */
  .quota-track{height:14px;background:rgba(255,255,255,.03);border:1px solid var(--hair);margin:8px 0 6px;overflow:hidden}
  .quota-track i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--provider) 0 2px,color-mix(in srgb,var(--provider) 45%,transparent) 2px 4px);box-shadow:var(--edge-glow,none);transition:width .3s ease}
  .quota-card small,.quota-empty{color:var(--muted);font-size:10px;line-height:1.45}
  .quota-empty{padding:13px;border:1px dashed var(--hair-strong);border-radius:var(--radius)}
  .quota-error,.quota-stale{font-size:10px;margin-top:10px}.quota-error{color:var(--danger)}.quota-stale{color:var(--amber)}
  .quota-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:2px}.quota-foot small{flex:1;min-width:0}
  .spark{width:132px;height:26px;flex:none;overflow:visible}.spark .area{fill:color-mix(in srgb,var(--c) 12%,transparent);stroke:none}.spark .line{fill:none;stroke:var(--c);stroke-width:1;vector-effect:non-scaling-stroke}.spark .tip{fill:var(--c)}
  .toolbar-warn{font-size:10px;color:var(--amber);white-space:nowrap}
  .settings{display:flex;flex-direction:column;gap:1px;background:var(--hair);border:1px solid var(--hair);border-radius:var(--radius);overflow:hidden}
  .setting{display:flex;align-items:center;gap:20px;padding:16px 18px;background:var(--panel-bg-strong);flex-wrap:wrap}
  .setting-copy{flex:1;min-width:0}.setting-copy strong{display:block;font-size:12px;margin-bottom:3px}.setting-copy small{color:var(--muted);font-size:10.5px;line-height:1.45;display:block}
  .setting-state{font-size:10px;color:var(--muted);white-space:nowrap}.setting-state.ok{color:var(--green)}
  .button.on{border-color:var(--green);color:var(--green);background:color-mix(in srgb,var(--green) 10%,transparent)}
  .segmented{display:flex;border:1px solid var(--hair-strong);border-radius:var(--radius);overflow:hidden;flex:none}
  .seg{border:0;background:transparent;color:var(--muted);padding:7px 11px;cursor:pointer;font:inherit;font-size:10px}
  .seg+.seg{border-left:1px solid var(--hair-strong)}.seg:hover{background:var(--soft);color:var(--text)}
  .seg.on{background:var(--soft-hover);color:var(--blue);font-weight:700}
  .theme-swatch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;flex:1;min-width:220px}
  .theme-swatch{display:flex;align-items:center;gap:7px;border:1px solid var(--hair);border-radius:var(--radius);background:var(--soft);padding:8px 10px;cursor:pointer;color:var(--text);font:inherit;font-size:11px;text-align:left}
  .theme-swatch:hover{background:var(--soft-hover);border-color:var(--hair-strong)}
  .theme-swatch.on{border-color:var(--hair-strong);background:var(--soft-hover);font-weight:700}
  .theme-swatch .dot{width:7px;height:7px;border-radius:50%;flex:none}
  @media(max-width:970px){.shell{grid-template-columns:178px 1fr}main{padding-left:22px;padding-right:22px}.provider-blocks,.connections{grid-template-columns:1fr}.hero-value{font-size:44px}.spark{display:none}}
  /* Moniteur — cartes métriques. Marques fines, grilles discrètes, le texte en encre, jamais
     en couleur de série : la couleur n'appartient qu'aux tracés. */
  .metric-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;margin-top:20px}
  .metric-card{border:1px solid var(--hair);background:var(--soft);padding:14px 16px}
  .metric-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:2px}
  .metric-head h3{margin:0;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .metric-value{font-size:21px;font-weight:700;color:var(--text)}
  .metric-value .unit{font-size:11px;color:var(--muted);font-weight:400;margin-left:2px}
  .metric-readout{font-size:10px;color:var(--muted);min-height:14px;margin-bottom:6px}
  .metric-chart{position:relative}
  .metric-chart svg{display:block;width:100%;height:56px;cursor:crosshair}
  .metric-chart .baseline{stroke:var(--hair-strong);stroke-width:1}
  .metric-chart .line{fill:none;stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
  .metric-chart .area{opacity:.13}
  .metric-legend{display:flex;gap:14px;margin-top:7px;font-size:10px;color:var(--muted)}
  .metric-legend i{display:inline-block;width:9px;height:2px;vertical-align:middle;margin-right:5px}
  .core-bars{display:flex;gap:2px;margin-top:9px;height:24px;align-items:flex-end}
  .core-bars i{flex:1;background:var(--chart-a);min-height:1px}
  .metric-badge{font-size:10px;padding:2px 7px;border:1px solid var(--hair);color:var(--muted)}
  .metric-badge.warn{color:var(--amber);border-color:var(--amber)}
  .metric-badge.crit{color:var(--danger);border-color:var(--danger)}
  .shortcut-table{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:5px 14px;max-width:430px}
  .shortcut-row{display:flex;align-items:center;gap:9px;font-size:10.5px;color:var(--muted)}
  .shortcut-row kbd{font:inherit;font-size:11px;color:var(--text);background:var(--soft);border:1px solid var(--hair);border-radius:var(--radius);padding:2px 6px;min-width:46px;text-align:center;flex:none}
  .cost{display:block;margin-top:6px;font-size:10.5px;color:var(--green);font-weight:700}
  .cost-lbl{color:var(--muted);font-weight:400}
  .cost-total{margin-top:14px;padding-top:11px;border-top:1px solid var(--hair);font-size:10.5px;color:var(--muted)}
  .cost-warn{color:var(--amber)}
  .weekly{margin-top:30px}
  .wk-svg{display:block;width:100%;height:150px;border:1px solid var(--hair);border-radius:var(--radius);background:var(--soft)}
  .wk-legend{display:flex;gap:18px;margin-top:10px;font-size:10.5px;color:var(--muted)}
  .wk-leg i{display:inline-block;width:11px;height:2px;vertical-align:middle;margin-right:6px}
  .metric-empty{color:var(--muted);padding:26px 0;text-align:center;font-size:11px}
  .forecast{margin-top:7px;font-size:10px;color:var(--muted);border-top:1px dashed var(--hair);padding-top:6px}
  .forecast.soon{color:var(--amber)}
  .metric-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:16px}
  .metric-table th,.metric-table td{text-align:right;padding:6px 10px;border-bottom:1px solid var(--hair)}
  .metric-table th{color:var(--muted);font-weight:400;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em}
  .metric-table th:first-child,.metric-table td:first-child{text-align:left}
  .metric-table td:first-child{color:var(--muted)}
  .view-toggle{margin-left:auto;display:flex;gap:0;border:1px solid var(--hair-strong)}
  .view-toggle button{border:0;background:transparent;color:var(--muted);padding:5px 10px;cursor:pointer;font:inherit;font-size:9.5px}
  .view-toggle button.on{background:var(--soft-hover);color:var(--blue);font-weight:700}
  .metric-card.expandable{cursor:pointer}
  .metric-card .chevron{margin-left:6px;opacity:.6}
  .metric-card-wide{grid-column:1/-1}
  .metric-detail{border-top:1px solid var(--hair);margin-top:10px;padding-top:10px}
  .detail-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .detail-cell .metric-chart svg{height:30px}
  .detail-label{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
  .detail-rows{display:flex;flex-direction:column;gap:5px;margin-top:4px}
  .detail-row{display:flex;justify-content:space-between;align-items:baseline;font-size:11px}
  .proc-rows{display:flex;flex-direction:column;margin-top:6px}
  .proc-row{display:grid;grid-template-columns:1fr 90px 70px;gap:10px;padding:5px 0;border-top:1px solid var(--hair);font-size:11.5px}
  .proc-row:first-child{border-top:0}
  .proc-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .proc-mem{color:var(--muted);text-align:right}
  .proc-cpu{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="product">Status</div>
    <nav class="nav">
      <button class="active" data-view="overview">Status</button>
      <button data-view="connections">Connexions</button>
      <button data-view="monitor">Moniteur</button>
      <button data-view="settings">Réglages</button>
    </nav>
    <div class="sidebar-spacer"></div>
    <div class="sidebar-bottom">
      <div class="connection-state"><i id="stateDot"></i><span id="stateText">Non connecté</span></div>
    </div>
  </aside>
  <main>
    <section class="view active" id="overview"></section>
    <section class="view" id="connections"></section>
    <section class="view" id="monitor"></section>
    <section class="view" id="settings"></section>
  </main>
</div>
<script>
const send=(action,extra={})=>window.webkit?.messageHandlers?.native?.postMessage({action,...extra});
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const providerColor=id=>id==='openai'?'var(--blue)':'var(--purple)';
const resetFull=timestamp=>timestamp?new Intl.DateTimeFormat('fr-FR',{weekday:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(timestamp*1000)):'—';
const ageLabel=timestamp=>{if(!timestamp)return '';const min=Math.max(0,Math.round((Date.now()/1000-timestamp)/60));return min<1?'à l’instant':min<60?`il y a ${min} min`:`il y a ${Math.round(min/60)} h`};
// "dans 2 h 14" is actionable in a way that "14:00" is not — you can decide whether to keep working.
const countdown=timestamp=>{
  if(!timestamp)return '—';
  const s=timestamp-Date.now()/1000;
  if(s<=0)return 'réinitialisé';
  const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
  if(d>0)return `dans ${d} j ${h} h`;
  if(h>0)return `dans ${h} h ${String(m).padStart(2,'0')}`;
  return `dans ${m} min`;
};
const isConnected=(id,account)=>id==='openai'?Boolean(account?.connected):Boolean(account?.authenticated||account?.trackingConfigured);
const isWeekly=w=>w&&(String(w.windowId||'').startsWith('seven_day')||w.durationMinutes===10080||w.label==='Semaine'||w.label==='7 jours');
const used=w=>w?Math.max(0,Math.min(100,Math.round(Number(w.usedPercent)))):null;
const windowsFor=(providerId,account)=>{const windows=account?.windows||[];return providerId==='openai'?windows.filter(isWeekly):windows};
const PROVIDERS=[{id:'openai',name:'OpenAI'},{id:'claude',name:'Claude'}];
// Gardez ces couleurs synchronisées avec Resources/themes.css : le JS ne peut pas lire les
// jetons d'un thème non actif, donc l'aperçu de chaque pastille est dupliqué ici à la main.
// Doit rester synchronisée avec windowActionForEvent: dans Status.m — c'est la seule source
// de vérité des raccourcis, et l'affichage ne doit pas mentir sur ce qui est réellement câblé.
const WINDOW_SHORTCUTS=[
  ['⌃⌥⇧←','Moitié gauche'],['⌃⌥⇧→','Moitié droite'],
  ['⌃⌥⇧U','2/3 gauche'],['⌃⌥⇧I','2/3 droite'],
  ['⌃⌥⇧J','Tiers gauche'],['⌃⌥⇧K','Tiers centre'],['⌃⌥⇧L','Tiers droite'],
  ['⌃⌥⇧Y','3/4 gauche'],['⌃⌥⇧O','3/4 droite'],
  ['⌃⌥⇧↑','Plein écran'],['⌃⌥⇧↓','Centrer'],
  ['⌃⌥⌘→','Écran suivant'],['⌃⌥⌘←','Écran précédent'],
  ['⌃⌥⌘U','Duo 50/50'],['⌃⌥⌘I','Duo 2/3 actif'],['⌃⌥⌘O','Duo 1/3 actif'],
];
const THEMES=[
  {id:'blueprint',label:'Blueprint',blue:'#67E8F9',purple:'#A78BFA'},
  {id:'phosphore',label:'Phosphore',blue:'#59FFB0',purple:'#2E8F5E'},
  {id:'synthwave',label:'Synthwave',blue:'#3CF2FF',purple:'#FF3CD6'},
  {id:'circuit',label:'Circuit',blue:'#B4FF3C',purple:'#3CD6FF'},
  {id:'holograme',label:'Holograme',blue:'#7CC8FF',purple:'#E29AFF'},
  {id:'ion',label:'Ion',blue:'#78E1FF',purple:'#B98CFF'}
];
let appData=null,currentView='overview';

// Rebuilds one window's series from the rolling history file and draws it as an inline sparkline.
// The last point is emphasised so "where am I now" reads without hunting.
function sparkline(history,key,color){
  const pts=(history||[]).map(row=>({t:row.t,v:row.p?.[key]})).filter(p=>typeof p.v==='number');
  if(pts.length<2)return '';
  const recent=pts.slice(-60);
  const w=132,h=26,max=100;
  const x=i=>i/(recent.length-1)*w;
  const y=v=>h-(v/max)*h;
  const line=recent.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const area=`${line} L${w},${h} L0,${h} Z`;
  const last=recent[recent.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="--c:${color}">
    <path class="area" d="${area}"/><path class="line" d="${line}"/>
    <circle class="tip" cx="${w}" cy="${y(last.v).toFixed(1)}" r="2"/></svg>`;
}

// « épuisé jeudi vers 16 h » fait décider ; « 78 % » ne fait que constater. Absent quand le
// natif juge la prévision non fiable — jamais de chiffre inventé pour remplir la ligne.
function forecastLine(key){
  const at=appData?.forecasts?.[key];
  if(!at)return '';
  const hours=(at-Date.now())/3600000;
  const when=new Intl.DateTimeFormat('fr-FR',hours<24?{hour:'2-digit',minute:'2-digit'}:{weekday:'long',hour:'2-digit'}).format(new Date(at));

  return `<div class="detail-rows">${ifaces.map(name=>`<div class="detail-row"><span class="detail-label">${esc(name)}</span><span>↓ ${fmtBytes(net.now['rx:'+name])} · ↑ ${fmtBytes(net.now['tx:'+name])}</span></div>`).join('')||'<div class="metric-empty">Aucune interface active.</div>'}</div>`}
function detailDisk(disk){const volumes=Object.keys(disk.now).filter(k=>k.startsWith('vol:')).sort();
  return `<div class="detail-rows">${volumes.map(key=>{const pct=Math.round(disk.now[key]);return `<div class="detail-row"><span class="detail-label">${esc(key.slice(4))}</span><span>${pct} %</span></div><div class="quota-track" style="--provider:var(--chart-a)"><i style="width:${pct}%"></i></div>`}).join('')}</div>`}
const DETAILS={cpu:detailCPU,network:detailNetwork,disk:detailDisk};

function processesCard(){
  const processes=metricsData?.processes||[];
  if(!processes.length)return '';
  const rows=processes.map(p=>`<div class="proc-row"><span class="proc-name">${esc(p.name)}</span><span class="proc-mem">${fmtSize(p.rssBytes)}</span><span class="proc-cpu">${p.cpuPercent<0.05?'—':p.cpuPercent.toFixed(1).replace('.',',')+' %'}</span></div>`).join('');
  return `<div class="metric-card metric-card-wide"><div class="metric-head"><h3>Processus les plus actifs</h3><span class="unit">CPU sur le dernier intervalle · un fil = 100 %</span></div><div class="proc-rows">${rows}</div></div>`;
}
function systemCard(){
  const system=famGet('system');if(!system)return '';
  const load=k=>system.now[k]==null?'—':system.now[k].toFixed(2).replace('.',',');
  return metricCard('system','Système',`<span class="metric-value" style="font-size:14px">up ${fmtUptime(system.now.uptimeSec)}</span>`,
    `<div class="detail-rows"><div class="detail-row"><span class="detail-label">charge 1 / 5 / 15 min</span><span>${load('load1')} / ${load('load5')} / ${load('load15')}</span></div><div class="detail-row"><span class="detail-label">processus</span><span>${system.now.processCount??'—'}</span></div></div>`
    +metricChart('system',[{key:'load1',color:'var(--chart-a)',label:'charge 1 min'}]));
}

function metricCard(familyId,title,valueHTML,body){
  const expandable=DETAILS[familyId],isOpen=expandable&&expanded.has(familyId);
  const detail=isOpen?`<div class="metric-detail">${DETAILS[familyId](famGet(familyId))}</div>`:'';
  return `<div class="metric-card ${expandable?'expandable':''}" data-family="${familyId}"><div class="metric-head"><h3>${title}${expandable?`<span class="chevron">${isOpen?'▾':'▸'}</span>`:''}</h3>${valueHTML}</div><div class="metric-readout">${readout(familyId)}</div>${body}${detail}</div>`;
}
function monitorView(){
  if(!metricsData?.families?.length)return `<div class="toolbar"><h1>Moniteur</h1></div><div class="metric-empty">Première mesure en cours…</div>`;
  const cpu=famGet('cpu'),gpu=famGet('gpu'),ram=famGet('ram'),net=famGet('network'),disk=famGet('disk'),sensors=famGet('sensors');
  const pct=v=>v==null?'—':`${Math.round(v)}<span class="unit">%</span>`;
  const cards=[];
  if(cpu){const cores=Object.keys(cpu.now).filter(k=>k.startsWith('core')).sort((a,b)=>+a.slice(4)-+b.slice(4));
    cards.push(metricCard('cpu','CPU',`<span class="metric-value">${pct(cpu.now.total)}</span>`,
      metricChart('cpu',[{key:'total',color:'var(--chart-a)',label:'CPU'}],{percent:true})
      +`<div class="core-bars" title="un trait par cœur">${cores.map(c=>`<i style="height:${Math.max(4,cpu.now[c])}%"></i>`).join('')}</div>`));}
  if(gpu)cards.push(metricCard('gpu','GPU',`<span class="metric-value">${pct(gpu.now.usage)}</span>`,
    metricChart('gpu',[{key:'usage',color:'var(--chart-a)',label:'GPU'}],{percent:true})));
  if(ram){const [pressureLabel,pressureClass]=PRESSURE[ram.now.pressureLevel]||[];
    cards.push(metricCard('ram','Mémoire',`<span>${pressureLabel?`<span class="metric-badge ${pressureClass}">pression ${pressureLabel}</span> `:''}<span class="metric-value">${pct(ram.now.usedPercent)}</span></span>`,
      metricChart('ram',[{key:'usedPercent',color:'var(--chart-a)',label:'Occupée'}],{percent:true})));}
  if(net)cards.push(metricCard('network','Réseau',`<span class="metric-value" style="font-size:14px">↓ ${fmtBytes(net.now.rxBytesPerSec)} · ↑ ${fmtBytes(net.now.txBytesPerSec)}</span>`,
    metricChart('network',[{key:'rxBytesPerSec',color:'var(--chart-a)',label:'↓ réception'},{key:'txBytesPerSec',color:'var(--chart-b)',label:'↑ émission'}])
    +legend([['var(--chart-a)','↓ réception'],['var(--chart-b)','↑ émission']])));
  if(disk)cards.push(metricCard('disk','Disque',`<span><span class="metric-value" style="font-size:14px">R ${fmtBytes(disk.now.readBytesPerSec)} · W ${fmtBytes(disk.now.writeBytesPerSec)}</span> <span class="unit">· plein à ${disk.now.usedPercent==null?'—':Math.round(disk.now.usedPercent)+' %'}</span></span>`,
    metricChart('disk',[{key:'readBytesPerSec',color:'var(--chart-a)',label:'lecture'},{key:'writeBytesPerSec',color:'var(--chart-b)',label:'écriture'}])
    +legend([['var(--chart-a)','lecture'],['var(--chart-b)','écriture']])));
  if(sensors){const battery=sensors.now.batteryPercent!=null?`<span class="unit">batterie ${Math.round(sensors.now.batteryPercent)} %${sensors.now.batteryCharging?' ⚡':''}</span> `:'';
    cards.push(metricCard('sensors','Capteurs',`<span>${battery}<span class="metric-value">${sensors.now.tempC==null?'—':Math.round(sensors.now.tempC)+'<span class="unit">°C</span>'}</span></span>`,
      sensors.now.tempC!=null?metricChart('sensors',[{key:'tempC',color:'var(--chart-a)',label:'temp.'}],{percent:true}):''));}
  const interval=metricsData.intervalSeconds||1,windowMin=Math.round(300*interval/60);
  const toggle=`<div class="view-toggle"><button class="${monitorMode==='charts'?'on':''}" onclick="setMonitorMode('charts')">graphiques</button><button class="${monitorMode==='table'?'on':''}" onclick="setMonitorMode('table')">tableau</button></div>`;
  const head=`<div class="toolbar"><h1>Moniteur</h1><span class="toolbar-meta">1 échantillon/${interval} s · fenêtre ${windowMin} min</span>${toggle}</div>`;
  if(monitorMode==='table')return head+monitorTable();
  return head+`<div class="metric-grid">${cards.join('')}${systemCard()}${processesCard()}</div>`;
}
// Les courbes sont muettes au clavier et au lecteur d'écran. Ce tableau dit la même chose en
// texte : valeur courante, min, max, moyenne sur la fenêtre glissante.
let monitorMode='charts';
const stats=values=>{
  if(!values?.length)return null;
  const sum=values.reduce((a,b)=>a+b,0);
  return {now:values[values.length-1],min:Math.min(...values),max:Math.max(...values),avg:sum/values.length};
};
// Le format ne se déduit pas de l'unité : une charge de 2,4 arrondie à l'entier ne dit plus rien.
const METRIC_LABELS={'cpu.total':['CPU','%','int'],'gpu.usage':['GPU','%','int'],'ram.usedPercent':['Mémoire','%','int'],
  'network.rxBytesPerSec':['Réseau ↓','','bytes'],'network.txBytesPerSec':['Réseau ↑','','bytes'],
  'disk.readBytesPerSec':['Disque lecture','','bytes'],'disk.writeBytesPerSec':['Disque écriture','','bytes'],
  'sensors.tempC':['Température','°C','int'],'system.load1':['Charge 1 min','','decimal']};
function monitorTable(){
  const rows=[];
  for(const [path,[label,unit,kind]] of Object.entries(METRIC_LABELS)){
    const [familyId,key]=path.split('.');
    const family=famGet(familyId);if(!family)continue;
    const s=stats(family.series?.[key]);if(!s)continue;
    const fmt=v=>kind==='bytes'?fmtBytes(v)
      :kind==='decimal'?v.toFixed(2).replace('.',',')
      :Math.round(v)+(unit?' '+unit:'');
    rows.push(`<tr><td>${label}</td><td>${fmt(s.now)}</td><td>${fmt(s.min)}</td><td>${fmt(s.max)}</td><td>${fmt(s.avg)}</td></tr>`);
  }
  if(!rows.length)return '<div class="metric-empty">Mesure en cours…</div>';
  return `<table class="metric-table"><thead><tr><th>Métrique</th><th>Actuel</th><th>Min</th><th>Max</th><th>Moyenne</th></tr></thead><tbody>${rows.join('')}</tbody></table>`;
}
function setMonitorMode(mode){monitorMode=mode;renderMonitor()}
function renderMonitor(){if(currentView!=='monitor')return;const section=document.querySelector('#monitor');if(section)section.innerHTML=monitorView()}
// Survol : l'état vit hors DOM parce que le re-render à 1 Hz remplace le innerHTML — l'état
// persiste, la lecture au point visé aussi.
document.querySelector('#monitor').addEventListener('mousemove',event=>{
  const svg=event.target.closest('svg[data-family]');if(!svg)return;
  const family=famGet(svg.dataset.family);if(!family)return;
  const keys=svg.dataset.keys.split(',');
  const len=Math.max(...keys.map(k=>(family.series?.[k]||[]).length));
  const rect=svg.getBoundingClientRect();
  const index=Math.round((event.clientX-rect.left)/rect.width*(len-1));
  hoverState={family:svg.dataset.family,keys,labels:svg.dataset.labels.split(','),percent:svg.dataset.percent==='1',back:Math.max(0,len-1-index)};
  const card=svg.closest('.metric-card');if(card)card.querySelector('.metric-readout').textContent=readout(svg.dataset.family);
});
document.querySelector('#monitor').addEventListener('mouseleave',()=>{hoverState=null;renderMonitor()});
document.querySelector('#monitor').addEventListener('click',event=>{
  const card=event.target.closest('.metric-card.expandable');if(!card)return;
  const family=card.dataset.family;
  expanded.has(family)?expanded.delete(family):expanded.add(family);
  renderMonitor();
});
window.StatusApp={update(data){appData=data;render()},updateMetrics(data){metricsData=data;renderMonitor()}};
// Le basculement d'onglet ne passe pas par render() : celui-ci sort quand les quotas ne sont pas
// encore arrivés, et le Moniteur — flux indépendant — doit rester joignable même dans ce cas.
document.querySelectorAll('.nav button').forEach(button=>button.onclick=()=>{
  currentView=button.dataset.view;
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===currentView));
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===currentView));
  render();renderMonitor();
});
// The countdowns must keep ticking between the 5-minute polls, otherwise "dans 2 h 14" quietly
// becomes a lie. Re-rendering from the last payload is cheap and needs no native round-trip.
setInterval(()=>{if(appData)render()},30000);
</script>
</body>
</html>

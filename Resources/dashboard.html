<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="themes.css">
<style>
  /* Le thème actif vient de themes.css ([data-theme] sur <html>, poussé par render()).
     --chart-a/--chart-b restent les marques de graphique du Moniteur, définies par thème. */
  *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.45 var(--font)}button,select{font:inherit;color:inherit}
  .shell{height:100%;display:grid;grid-template-columns:210px 1fr;padding-top:28px;background:var(--bg);
    background-image:var(--bg-image,linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px));
    background-size:var(--bg-size,22px 22px,22px 22px)}
  .sidebar{display:flex;flex-direction:column;background:var(--sidebar);border-right:1px solid var(--hair-strong);padding:20px 14px 16px}
  .product{font-size:14px;font-weight:700;letter-spacing:.06em;margin:6px 12px 24px;color:var(--blue);text-transform:uppercase}
  .nav button,.sidebar-bottom button{position:relative;width:100%;border:1px solid transparent;background:transparent;border-radius:var(--radius);padding:9px 12px 9px 32px;text-align:left;color:var(--muted);cursor:pointer;margin-bottom:3px}
  .nav button:hover,.sidebar-bottom button:hover{background:var(--soft);border-color:var(--hair);color:var(--text)}
  .nav button::before{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.6;font-size:12px;line-height:1}
  .nav button[data-view="overview"]::before{content:"01"}.nav button[data-view="monitor"]::before{content:"02"}.nav button[data-view="displays"]::before{content:"03"}.nav button[data-view="settings"]::before{content:"04"}
  .nav button.active{background:var(--soft-hover);border-color:var(--hair-strong);color:var(--blue);font-weight:700}
  .nav button.active::before{opacity:1;color:var(--blue)}
  .sidebar-spacer{flex:1}.sidebar-bottom{border-top:1px solid var(--hair);padding-top:10px}
  .connection-state{display:flex;align-items:center;gap:8px;padding:7px 12px;color:var(--muted);font-size:12px}
  .connection-state i{width:6px;height:6px;background:#3A424D}.connection-state i.live{background:var(--green)}.connection-state i.warn{background:var(--amber)}
  main{overflow:auto;padding:0 34px 40px}.view{display:none}.view.active{display:block}@keyframes enter{from{opacity:0}to{opacity:1}}
  .toolbar{height:78px;border-bottom:1px solid var(--hair-strong);display:flex;align-items:center;gap:12px}
  .toolbar h1{font-size:13px;letter-spacing:.1em;margin:0;font-weight:700;text-transform:uppercase;color:var(--blue)}
  .toolbar-meta{margin-left:auto;color:var(--muted);font-size:12px}
  .button{border:1px solid var(--hair-strong);border-radius:var(--radius);background:var(--soft);padding:7px 10px;cursor:pointer;color:var(--blue)}
  .button:hover{background:var(--soft-hover)}.button[disabled]{opacity:.52;cursor:default}
  /* Cartouche de plan : le chiffre clé encadré, comme une cote sur un dessin technique. */
  /* align-items:start — OpenAI n'a qu'une fenêtre contre trois à Claude ; sans cela son bloc
     s'étirerait à vide sur toute la hauteur de la rangée. */
  .provider-blocks{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px;align-items:start}
  .provider-block{border:1px solid var(--hair);border-radius:var(--radius);background:var(--panel-bg);padding:20px;position:relative;clip-path:var(--clip,none)}
  .provider-block:before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:2px;background:var(--provider)}
  .provider-block-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .provider{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;color:var(--provider);text-transform:lowercase;letter-spacing:.04em}
  .provider-dot{width:6px;height:6px;background:var(--provider)}
  .status-label{font-size:12px;color:var(--muted);white-space:nowrap}
  .status-label i{display:inline-block;width:5px;height:5px;background:var(--provider);margin-right:7px}
  .freshness{font-size:12px;color:var(--muted);margin:-8px 0 12px}.freshness.stale{color:var(--amber)}
  .section-head{display:flex;align-items:flex-start;gap:20px;margin:26px 0 20px}
  .section-head h2{font-size:12px;letter-spacing:.1em;margin:0 0 5px;font-weight:700;text-transform:uppercase;color:var(--text)}
  .section-head p{margin:0;color:var(--muted);font-size:12px}
  .connections{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .connection-panel{border:1px solid var(--hair);border-radius:var(--radius);background:var(--panel-bg);padding:22px;min-height:300px;position:relative;clip-path:var(--clip,none)}
  .connection-panel:before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:2px;background:var(--blue)}
  .connection-panel:nth-child(2):before{background:var(--purple)}
  .connection-panel h3{font-size:12px;margin:0 0 4px;font-weight:700;color:var(--blue);text-transform:lowercase;letter-spacing:.04em}
  .connection-panel:nth-child(2) h3{color:var(--purple)}
  .connection-panel>p{color:var(--muted);margin:0 0 20px;font-size:12px}
  .quota-block{border-top:1px solid var(--hair);padding-top:18px}
  /* Un compte dans la vue Volumes : séparé du suivant, mais sans le poids d'une carte imbriquée. */
  .account-block+.account-block{border-top:1px solid var(--hair);margin-top:16px;padding-top:16px}
  .account-block-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
  .account-block-head strong{font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Le numéro nomme, l'identité situe : « Claude 1 » suivi de l'organisation, en retrait. */
  .account-block-head strong,.account-copy strong{white-space:normal;overflow-wrap:anywhere}
  .account-identity{color:var(--muted);font-weight:400;margin-left:7px}
  .provider-manage{margin-left:8px;border:1px solid var(--hair-strong);border-radius:var(--radius);background:var(--soft);padding:2px 7px;cursor:pointer;font-size:12px;color:var(--muted)}
  .provider-manage:hover{background:var(--soft-hover);color:var(--text)}
  .account-add{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--hair)}
  .account-add small{color:var(--muted);font-size:12px}
  .pin-list{margin-top:14px;padding-top:12px;border-top:1px solid var(--hair)}
  .pin-list>small{display:block;color:var(--muted);font-size:12px;margin-bottom:8px}
  .pin-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
  .pin-name{font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .account-row{display:flex;gap:10px;align-items:center;margin-bottom:15px}
  .account-copy{min-width:0;flex:1}.account-copy strong,.account-copy small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .account-copy small{color:var(--muted);font-size:12px;margin-top:3px}
  .account-actions{display:flex;gap:6px}
  .account-action{border:1px solid var(--hair-strong);border-radius:var(--radius);background:var(--soft);padding:6px 9px;cursor:pointer;font-size:12px;color:var(--text)}
  .account-action:hover{background:var(--soft-hover)}
  .account-action.primary{background:var(--provider);border-color:var(--provider);color:#0B0F14;font-weight:700}
  .account-action[disabled]{opacity:.5}
  .quota-grid{display:grid;gap:9px}
  .quota-card{padding:11px 12px;border:1px solid var(--hair);border-radius:var(--radius);background:var(--soft)}
  .quota-top{display:flex;justify-content:space-between;gap:12px}
  .quota-top span{font-weight:700;font-size:12px;color:var(--text)}
  .quota-top strong{font-variant-numeric:tabular-nums;color:var(--provider);text-shadow:var(--value-glow,none)}
  /* Trame par défaut : la mesure dit « mesure », pas « barre de progression » — hachure par
     défaut (blueprint/phosphore), qu'un thème peut remplacer par un aplat ou un dégradé
     (voir themes.css). --provider est réellement hérité ici, contrairement à un alias
     --rail-fill qui figerait var(--provider) invalide à son propre niveau de déclaration. */
  .quota-track{height:14px;background:rgba(255,255,255,.03);border:1px solid var(--hair);margin:8px 0 6px;overflow:hidden}
  .quota-track i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--provider) 0 2px,color-mix(in srgb,var(--provider) 45%,transparent) 2px 4px);box-shadow:var(--edge-glow,none);transition:width .3s ease}
  .quota-card small,.quota-empty{color:var(--muted);font-size:12px;line-height:1.45}
  .quota-empty{padding:13px;border:1px dashed var(--hair-strong);border-radius:var(--radius)}
  .quota-error,.quota-stale{font-size:12px;margin-top:10px}.quota-error{color:var(--danger)}.quota-stale{color:var(--amber)}
  .quota-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:2px}.quota-foot small{flex:1;min-width:0}
  .manual-reset{margin-top:7px;font-size:11px;line-height:1.35;color:var(--muted)}
  .manual-reset.available{color:var(--green);font-weight:700}
  .spark{width:132px;height:26px;flex:none;overflow:visible}.spark .area{fill:color-mix(in srgb,var(--c) 12%,transparent);stroke:none}.spark .line{fill:none;stroke:var(--c);stroke-width:1;vector-effect:non-scaling-stroke}.spark .tip{fill:var(--c)}
  .toolbar-warn{font-size:12px;color:var(--amber);white-space:nowrap}
  .settings{display:flex;flex-direction:column;gap:1px;background:var(--hair);border:1px solid var(--hair);border-radius:var(--radius);overflow:hidden}
  .setting{display:flex;align-items:center;gap:20px;padding:16px 18px;background:var(--panel-bg-strong);flex-wrap:wrap}
  .setting-copy{flex:1;min-width:0}.setting-copy strong{display:block;font-size:12px;margin-bottom:3px}.setting-copy small{color:var(--muted);font-size:12px;line-height:1.45;display:block}
  .setting-state{font-size:12px;color:var(--muted);white-space:nowrap}.setting-state.ok{color:var(--green)}
  .button.on{border-color:var(--green);color:var(--green);background:color-mix(in srgb,var(--green) 10%,transparent)}
  .segmented{display:flex;border:1px solid var(--hair-strong);border-radius:var(--radius);overflow:hidden;flex:none}
  /* Chips de widgets : plusieurs boutons indépendants qui passent à la ligne (contrairement au
     segmented, un choix unique). Chacun encadré, activable séparément. */
  .seg-wrap{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:220px;justify-content:flex-end}
  .seg-wrap .seg{border:1px solid var(--hair-strong);border-radius:var(--radius);padding:6px 10px}
  /* Configuration des widgets : une rangée par widget (toggle nom, forme, couleurs). */
  .widget-config{display:flex;flex-direction:column;gap:8px}
  .wc-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  /* Le nom EST l'interrupteur. Sans marque d'état, rien ne le disait : la pastille (pleine =
     affichée dans la barre, creuse = masquée) rend le clic évident sans ajouter de contrôle. */
  .wc-toggle{border:1px solid var(--hair-strong);border-radius:var(--radius);padding:6px 12px;min-width:112px;text-align:left;flex:none;display:inline-flex;align-items:center;gap:7px}
  .wc-dot{width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor;flex:none}
  .wc-toggle.on .wc-dot{background:currentColor}
  .wc-shapes{flex:none}.wc-shapes .seg{font-size:12px;padding:5px 8px}
  .wc-move{display:flex;gap:0;border:1px solid var(--hair-strong);flex:none}
  .wc-move .seg{padding:5px 8px;font-size:12px;line-height:1}
  .wc-move .seg[disabled]{opacity:.28;cursor:default}
  .wc-colors{display:flex;gap:4px;margin-left:auto;flex:none}
  .wc-swatch{width:15px;height:15px;border-radius:50%;border:1px solid var(--hair-strong);cursor:pointer;padding:0}
  .wc-swatch.on{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--blue)}
  /* Sous-rangée : contenu du panneau d'info (sections activables). */
  .wc-sub{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-3px 0 3px 10px;padding-left:10px;border-left:2px solid var(--hair)}
  .wc-sublabel{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);flex:none}
  .wc-sub .seg{font-size:12px;padding:4px 8px}
  .wc-sub .segmented{flex-wrap:wrap}
  .seg{border:0;background:transparent;color:var(--muted);padding:7px 11px;cursor:pointer;font:inherit;font-size:12px}
  .seg+.seg{border-left:1px solid var(--hair-strong)}.seg:hover{background:var(--soft);color:var(--text)}
  .seg.on{background:var(--soft-hover);color:var(--blue);font-weight:700}
  .theme-swatch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;flex:1;min-width:220px}
  .theme-swatch{display:flex;align-items:center;gap:7px;border:1px solid var(--hair);border-radius:var(--radius);background:var(--soft);padding:8px 10px;cursor:pointer;color:var(--text);font:inherit;font-size:12px;text-align:left}
  .theme-swatch:hover{background:var(--soft-hover);border-color:var(--hair-strong)}
  .theme-swatch.on{border-color:var(--hair-strong);background:var(--soft-hover);font-weight:700}
  .theme-swatch .dot{width:7px;height:7px;border-radius:50%;flex:none}
  @media(max-width:970px){.shell{grid-template-columns:178px 1fr}main{padding-left:22px;padding-right:22px}.provider-blocks,.connections{grid-template-columns:1fr}.spark{display:none}}
  /* Moniteur — cartes métriques. Marques fines, grilles discrètes, le texte en encre, jamais
     en couleur de série : la couleur n'appartient qu'aux tracés. */
  .metric-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;margin-top:20px}
  .metric-card{border:1px solid var(--hair);background:var(--soft);padding:14px 16px}
  .metric-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:2px}
  .metric-head h3{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .metric-value{font-size:21px;font-weight:700;color:var(--text)}
  .metric-value .unit{font-size:12px;color:var(--muted);font-weight:400;margin-left:2px}
  .metric-readout{font-size:12px;color:var(--muted);min-height:14px;margin-bottom:6px}
  .metric-chart{position:relative}
  .metric-chart svg{display:block;width:100%;height:56px;cursor:crosshair}
  .metric-chart .baseline{stroke:var(--hair-strong);stroke-width:1}
  .metric-chart .line{fill:none;stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
  .metric-chart .area{opacity:.13}
  .metric-legend{display:flex;gap:14px;margin-top:7px;font-size:12px;color:var(--muted)}
  .metric-legend i{display:inline-block;width:9px;height:2px;vertical-align:middle;margin-right:5px}
  .core-bars{display:flex;gap:2px;margin-top:9px;height:24px;align-items:flex-end}
  .core-bars i{flex:1;background:var(--chart-a);min-height:1px}
  /* Schéma des cœurs, groupés par type. Les barres sont à largeur fixe ici : sinon les 4 cœurs
     Efficience s'étireraient autant que les 10 Performance et le rapport visuel mentirait. */
  .core-schematic{display:flex;gap:18px;margin-top:9px;flex-wrap:wrap}
  .core-group-label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:block;margin-bottom:3px}
  .core-schematic .core-bars{margin-top:0}
  .core-schematic .core-bars i{flex:none;width:7px}
  .proc-head{display:grid;grid-template-columns:1fr 78px 56px 64px;gap:10px;padding-bottom:5px;font-size:12px;
    text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .proc-head span:not(:first-child){text-align:right}
  .proc-head .sorted{color:var(--blue);font-weight:700}
  /* Rangée de tuiles-stats : les chiffres clés lisibles d'un coup d'œil, sans déplier. */
  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(66px,1fr));gap:1px;background:var(--hair);border:1px solid var(--hair);margin:11px 0 4px}
  .stat-cell{background:var(--soft);padding:8px 10px}
  .stat-cell b{display:block;font-size:15px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;line-height:1.15}
  .stat-cell span{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .stat-cell.warn b{color:var(--amber)}
  .metric-badge{font-size:12px;padding:2px 7px;border:1px solid var(--hair);color:var(--muted)}
  .metric-badge.warn{color:var(--amber);border-color:var(--amber)}
  .metric-badge.crit{color:var(--danger);border-color:var(--danger)}
  .shortcut-table{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:5px 14px;max-width:430px}
  .shortcut-row{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted)}
  .shortcut-row kbd{font:inherit;font-size:12px;color:var(--text);background:var(--soft);border:1px solid var(--hair);border-radius:var(--radius);padding:2px 6px;min-width:46px;text-align:center;flex:none}
  .cost{margin-top:7px;display:flex;flex-direction:column;gap:1px}
  .cost-amount{font-size:12.5px;color:var(--green);font-weight:700;font-variant-numeric:tabular-nums}
  .cost-lbl{color:var(--muted);font-weight:400;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  /* Total accentué : un cartouche mis en avant, le chiffre en grand dans les deux devises. */
  .cost-total{margin-top:16px;padding:13px 14px;border:1px solid var(--green);border-radius:var(--radius);
    background:color-mix(in srgb,var(--green) 8%,transparent)}
  .cost-total.scanning{border-color:var(--hair-strong);background:var(--soft);color:var(--muted);font-size:12px;padding:11px 14px}
  .cost-total-label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
  /* Le sélecteur de période se pose à droite de l'étiquette, sur la même ligne : il commente le
     chiffre, il ne doit pas pousser le montant vers le bas. */
  .cost-total-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .cost-period{margin-bottom:4px;flex:none}
  .cost-total-amount{font-size:22px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums;line-height:1;cursor:help}
  .cost-warn{color:var(--amber);font-size:12px;margin-top:6px}
  .model-table{width:100%;margin-top:11px;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
  .model-table th{text-align:left;font-weight:400;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:0 0 4px;border-bottom:1px solid var(--hair)}
  .model-table td{padding:3px 0;border-bottom:1px solid var(--hair)}
  .model-table .num{text-align:right;font-variant-numeric:tabular-nums}
  .model-table tbody tr:last-child td{border-bottom:none}
  .model-table .unpriced td{color:var(--muted)}
  .weekly{margin-top:30px}
  .wk-svg{display:block;width:100%;height:150px;border:1px solid var(--hair);border-radius:var(--radius);background:var(--soft)}
  .wk-legend{display:flex;gap:18px;margin-top:10px;font-size:12px;color:var(--muted)}
  .wk-leg i{display:inline-block;width:11px;height:2px;vertical-align:middle;margin-right:6px}
  .metric-empty{color:var(--muted);padding:26px 0;text-align:center;font-size:12px}
  .forecast{margin-top:7px;font-size:12px;color:var(--muted);border-top:1px dashed var(--hair);padding-top:6px}
  .forecast.soon{color:var(--amber)}
  .metric-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:16px}
  .metric-table th,.metric-table td{text-align:right;padding:6px 10px;border-bottom:1px solid var(--hair)}
  .metric-table th{color:var(--muted);font-weight:400;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
  .metric-table th:first-child,.metric-table td:first-child{text-align:left}
  .metric-table td:first-child{color:var(--muted)}
  /* Vue 24 h : une bande par métrique, empilées pour comparer les moments d'un coup d'œil. */
  .day-grid{display:flex;flex-direction:column;gap:14px;margin-top:16px}
  .day-card{border:1px solid var(--hair);background:var(--panel-bg);padding:10px 12px}
  .day-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px}
  .day-head strong{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--text)}
  .day-stats{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .day-stats b{color:var(--text);font-weight:700}
  .day-chart{display:block;width:100%;height:56px}
  .day-axis{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
  .view-toggle{margin-left:auto;display:flex;gap:0;border:1px solid var(--hair-strong)}
  .view-toggle button{border:0;background:transparent;color:var(--muted);padding:5px 10px;cursor:pointer;font:inherit;font-size:12px}
  .view-toggle button.on{background:var(--soft-hover);color:var(--blue);font-weight:700}
  .metric-card.expandable{cursor:pointer}
  .metric-card .chevron{margin-left:6px;opacity:.6}
  .metric-card-wide{grid-column:1/-1}
  .metric-detail{border-top:1px solid var(--hair);margin-top:10px;padding-top:10px}
  .detail-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .detail-cell .metric-chart svg{height:30px}
  .detail-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}

  /* Réglages : sous-navigation verticale à gauche, une catégorie à la fois à droite. Les comptes

  .settings-nav button.on{background:var(--soft-hover);color:var(--text);font-weight:700}

<body>
<div class="shell">

    <div class="product">Status</div>
    <nav class="nav">
      <button class="active" data-view="overview">Status</button>
      <button data-view="monitor">Moniteur</button>
      <button data-view="displays">Écrans</button>
      <button data-view="settings">Réglages</button>
    </nav>
    <div class="sidebar-spacer"></div>
    <div class="sidebar-bottom">
      <div class="connection-state"><i id="stateDot"></i><span id="stateText">Non connecté</span></div>
    </div>
  </aside>
  <main>
    <section class="view active" id="overview"></section>
    <section class="view" id="monitor"></section>
    <section class="view" id="displays"></section>
    <section class="view" id="settings"></section>
  </main>
</div>
<script>
const send=(action,extra={})=>window.webkit?.messageHandlers?.native?.postMessage({action,...extra});
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const providerColor=id=>id==='openai'?'var(--blue)':'var(--purple)';
const resetFull=timestamp=>timestamp?new Intl.DateTimeFormat('fr-FR',{weekday:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(timestamp*1000)):'—';
const ageLabel=timestamp=>{if(!timestamp)return '';const min=Math.max(0,Math.round((Date.now()/1000-timestamp)/60));return min<1?'à l’instant':min<60?`il y a ${min} min`:`il y a ${Math.round(min/60)} h`};
// "dans 2 h 14" is actionable in a way that "14:00" is not — you can decide whether to keep working.
const countdown=timestamp=>{
  if(!timestamp)return '—';
  const s=timestamp-Date.now()/1000;
  if(s<=0)return 'réinitialisé';
  const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
  if(d>0)return `dans ${d} j ${h} h`;
  if(h>0)return `dans ${h} h ${String(m).padStart(2,'0')}`;
  return `dans ${m} min`;
};
const isConnected=(id,account)=>id==='openai'||['code','web'].includes(account?.claudeSource)?Boolean(account?.connected):Boolean(account?.cookieConfigured&&account?.orgId);
const isWeekly=w=>w&&(String(w.windowId||'').startsWith('seven_day')||w.durationMinutes===10080||w.label==='Semaine'||w.label==='7 jours');
// Sous-quota hebdo dédié à un modèle (seven_day_scoped_fable) : un compteur à part, qui garde sa
// carte et son épinglage mais ne pilote aucun chiffre agrégé — en tête d'affiche, « 54 % » sans
// son contexte Fable ferait croire que la semaine entière en est là.
const isCodexSpark=w=>/spark/i.test(`${w?.windowId||''} ${w?.label||''}`);
const isScopedWeekly=w=>isWeekly(w)&&String(w?.windowId||'').includes('scoped');
const used=w=>w?Math.max(0,Math.min(100,Math.round(Number(w.usedPercent)))):null;
const windowsFor=(providerId,account)=>{const windows=account?.windows||[];return providerId==='openai'?windows.filter(w=>isWeekly(w)&&!isCodexSpark(w)):windows};
const PROVIDERS=[{id:'openai',name:'OpenAI'},{id:'claude',name:'Claude'}];
// data.accounts est une liste de payloads, un par compte, déjà dans l'ordre d'affichage.
const accountsOf=(data,providerId)=>(data?.accounts||[]).filter(a=>a.provider===providerId);
const accountById=(data,id)=>(data?.accounts||[]).find(a=>a.accountId===id);
// Clé d'historique d'une fenêtre : elle porte l'identifiant du compte, jamais son nom — renommer
// un compte ne doit pas décrocher ses courbes.
const historyKey=(account,w)=>`${account.provider}:${account.accountId}:${w.windowId||w.label}`;
// Gardez ces couleurs synchronisées avec Resources/themes.css : le JS ne peut pas lire les
// jetons d'un thème non actif, donc l'aperçu de chaque pastille est dupliqué ici à la main.
// Doit rester synchronisée avec windowActionForEvent: dans Status.m — c'est la seule source
// de vérité des raccourcis, et l'affichage ne doit pas mentir sur ce qui est réellement câblé.
const WINDOW_SHORTCUTS=[
  ['⌃⌥⇧←','Moitié gauche'],['⌃⌥⇧→','Moitié droite'],
  ['⌃⌥⇧U','2/3 gauche'],['⌃⌥⇧I','2/3 droite'],
  ['⌃⌥⇧J','Tiers gauche'],['⌃⌥⇧K','Tiers centre'],['⌃⌥⇧L','Tiers droite'],
  ['⌃⌥⇧Y','3/4 gauche'],['⌃⌥⇧O','3/4 droite'],
  ['⌃⌥⇧↑','Plein écran'],['⌃⌥⇧↓','Centrer'],
  ['⌃⌥⌘→','Écran suivant'],['⌃⌥⌘←','Écran précédent'],
  ['⌃⌥⌘U','Duo 50/50'],['⌃⌥⌘I','Duo 2/3 actif'],['⌃⌥⌘O','Duo 1/3 actif'],
];
const THEMES=[
  {id:'blueprint',label:'Blueprint',blue:'#67E8F9',purple:'#A78BFA'},
  {id:'phosphore',label:'Phosphore',blue:'#59FFB0',purple:'#2E8F5E'},
  {id:'synthwave',label:'Synthwave',blue:'#3CF2FF',purple:'#FF3CD6'},
  {id:'circuit',label:'Circuit',blue:'#B4FF3C',purple:'#3CD6FF'},
  {id:'holograme',label:'Holograme',blue:'#7CC8FF',purple:'#E29AFF'},
  {id:'ion',label:'Ion',blue:'#78E1FF',purple:'#B98CFF'}
];
// Widgets système de la barre des menus (mêmes ids que TMMenuBarWidgetIDs côté natif).
const WIDGETS=[['cpu','CPU'],['memory','Mémoire'],['gpu','GPU'],['network','Réseau'],['temperature','Température'],['battery','Batterie'],['disk','Disque'],['claudeWeek','Claude · semaine'],['codexWeek','Codex · semaine']];
// Formes valides par widget (défaut = 1re). Ids alignés sur TMWidgetImageStyled.
const SHAPE_LABELS={bars:'barres',graph:'courbe',ring:'anneau',pie:'camembert',bar:'jauge',text:'texte',twoLine:'2 lignes',battery:'pile'};
// « jauge » (barre horizontale) partout où la donnée est un taux de remplissage — pas pour le
// réseau, dont le débit n'a pas de plafond connu à représenter.
const WIDGET_SHAPES={cpu:['bars','graph','ring','pie','bar','text'],gpu:['bars','graph','ring','pie','bar','text'],
  memory:['pie','ring','bars','graph','bar','text'],disk:['pie','ring','bars','graph','bar','text'],
  network:['twoLine','text'],temperature:['twoLine','ring','bar','text'],battery:['battery','ring','bar','twoLine','text'],
  // Consommations hebdomadaires : mêmes formes que les taux de remplissage — les deux IA peuvent
  // être affichées côte à côte, chacune avec sa forme et sa couleur.
  claudeWeek:['pie','ring','bars','graph','bar','text'],codexWeek:['pie','ring','bars','graph','bar','text']};
// Formes de la jauge des consommations (ids alignés sur updateStatusMenu côté natif). Les quatre
// dernières viennent du moteur des widgets : une forme ajoutée là profite aux deux.
const ICON_DESIGNS=[['doubleRing','Double anneau'],['capsules','Capsules'],['doubleArc','Double arc'],['boldRing','Anneau épais'],['reservoir','Réservoir'],['segments','5 segments']];
const GAUGE_SHAPES=[['ring','Anneau'],['spark','Courbe'],['bars','Barres'],['pie','Camembert'],
  ['bar','Jauge'],['none','Aucune']];
// Palette (alignée sur TMWidgetNamedColor). « auto » = neutre adaptatif + alerte.
const WIDGET_COLORS=[['auto','—','var(--muted)'],['blue','Bleu','#4C90FF'],['green','Vert','#4CD173'],
  ['purple','Violet','#AD85FF'],['cyan','Cyan','#4CCCE6'],['orange','Orange','#FF9933'],
  ['amber','Ambre','#FFBF40'],['red','Rouge','#FF615A'],['pink','Rose','#FF73B3'],['gray','Gris','#9EA9B8']];
// Sections activables du panneau d'info de chaque widget (clés alignées sur `on(section)` de
// widget.html). Absent d'un réglage = affiché (défaut). Le titre, la grande valeur et la courbe
// principale restent toujours présents — seules ces sections optionnelles se règlent.
const PANEL_SECTIONS={
  cpu:[['cores','cœurs'],['split','user/sys'],['load','charge'],['processes','processus']],
  memory:[['breakdown','répartition'],['stats','totaux'],['processes','processus']],
  gpu:[['stages','étages']],
  network:[['interfaces','interfaces'],['session','session']],
  temperature:[['chart','historique'],['detail','par famille'],['fans','ventilateurs']],
  battery:[['chart','historique'],['stats','indicateurs'],['details','détails']],
  disk:[['chart','débits'],['volumes','volumes']]};
// Alertes système réglables. La pression mémoire suit l'échelle noyau (2 = avertissement,
// 4 = critique), pas un pourcentage : ses « seuils » sont donc deux niveaux nommés.
const ALERTS=[
  ['quota','Quota entamé',[70,75,80,85,90],v=>v+' %'],
  ['quotaReset','Réinitialisation hebdo',[],null],
  ['temp','Température',[75,85,90,95,100],v=>v+' °C'],
  ['disk','Disque plein',[80,85,90,95],v=>v+' %'],
  ['memory','Pression mémoire',[2,4],v=>v===4?'critique':'avertissement'],
];
function alertRows(p){
  const cfg=p.alerts||{};
  return ALERTS.map(([key,label,choices,fmt])=>{
    const one=cfg[key]||{},on=one.on!==false,cur=one.threshold;
    const toggle=`<button class="seg wc-toggle ${on?'on':''}" onclick="send('setAlert',{key:'${key}',on:${!on}})">${label}</button>`;
    // Sans seuils à choisir (événement pur, comme la réinitialisation hebdo) : interrupteur seul.
    if(!on||!choices.length)return `<div class="wc-row">${toggle}</div>`;
    const sel=`<span class="segmented wc-shapes">${choices.map(v=>`<button class="seg ${cur===v?'on':''}" onclick="send('setAlert',{key:'${key}',threshold:${v}})">${fmt(v)}</button>`).join('')}</span>`;
    return `<div class="wc-row">${toggle}${sel}</div>`;
  }).join('');
}
function widgetConfigRows(p){
  const enabled=(p.menuBarWidgets||[]).filter(id=>WIDGETS.some(([w])=>w===id));
  const config=p.menuBarWidgetConfig||{},panels=p.widgetPanelConfig||{};
  // Les widgets activés d'abord, dans leur ordre d'affichage (celui de la barre des menus, de
  // gauche à droite) ; les inactifs ensuite, dans l'ordre du catalogue.
  const ordered=[...enabled.map(id=>WIDGETS.find(([w])=>w===id)),
                 ...WIDGETS.filter(([w])=>!enabled.includes(w))];
  return ordered.map(([id,label],index)=>{
    const on=enabled.includes(id),cfg=config[id]||{},shapes=WIDGET_SHAPES[id]||['text'];
    const shape=cfg.shape&&shapes.includes(cfg.shape)?cfg.shape:shapes[0],color=cfg.color||'auto';
    const toggle=`<button class="seg wc-toggle ${on?'on':''}" title="${on?'Masquer':'Afficher'} l’icône ${label} dans la barre des menus" onclick="send('setMenuBarWidget',{id:'${id}',on:${!on}})"><span class="wc-dot"></span>${label}</button>`;
    if(!on)return `<div class="wc-row">${toggle}</div>`;
    const shapeSel=`<span class="segmented wc-shapes">${shapes.map(s=>`<button class="seg ${shape===s?'on':''}" onclick="send('setMenuBarWidgetStyle',{id:'${id}',shape:'${s}'})">${SHAPE_LABELS[s]||s}</button>`).join('')}</span>`;
    const colorSel=`<span class="wc-colors">${WIDGET_COLORS.map(([c,cl,hex])=>`<button class="wc-swatch ${color===c?'on':''}" title="${cl}" style="background:${hex}" onclick="send('setMenuBarWidgetStyle',{id:'${id}',color:'${c}'})"></button>`).join('')}</span>`;
    const secs=PANEL_SECTIONS[id]||[],pcfg=panels[id]||{};
    const secSel=secs.length?`<div class="wc-sub"><span class="wc-sublabel">Panneau</span><span class="segmented">${secs.map(([key,lab])=>{const sOn=pcfg[key]!==false;return `<button class="seg ${sOn?'on':''}" onclick="send('setWidgetPanelSection',{id:'${id}',section:'${key}',on:${!sOn}})">${lab}</button>`}).join('')}</span></div>`:'';
    // Déplacement dans la barre des menus : ← vers la gauche, → vers la droite. Désactivés en butée.
    const move=`<span class="wc-move"><button class="seg" ${index===0?'disabled':''} title="Vers la gauche" onclick="send('moveMenuBarWidget',{id:'${id}',delta:-1})">←</button><button class="seg" ${index===enabled.length-1?'disabled':''} title="Vers la droite" onclick="send('moveMenuBarWidget',{id:'${id}',delta:1})">→</button></span>`;
    return `<div class="wc-row">${toggle}${move}${shapeSel}${colorSel}</div>${secSel}`;
  }).join('');
}
let appData=null,currentView='overview';

// Rebuilds one window's series from the rolling history file and draws it as an inline sparkline.
// The last point is emphasised so "where am I now" reads without hunting.
function sparkline(history,key,color){
  const pts=(history||[]).map(row=>({t:row.t,v:row.p?.[key]})).filter(p=>typeof p.v==='number');
  if(pts.length<2)return '';
  const recent=pts.slice(-60);
  const w=132,h=26,max=100;
  const x=i=>i/(recent.length-1)*w;
  const y=v=>h-(v/max)*h;
  const line=recent.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const area=`${line} L${w},${h} L0,${h} Z`;
  const last=recent[recent.length-1];

}

// « épuisé jeudi vers 16 h » fait décider ; « 78 % » ne fait que constater. Absent quand le
// natif juge la prévision non fiable — jamais de chiffre inventé pour remplir la ligne.
function forecastLine(key){
  const at=appData?.forecasts?.[key];
  if(!at)return '';
  const hours=(at-Date.now())/3600000;
  const when=new Intl.DateTimeFormat('fr-FR',hours<24?{hour:'2-digit',minute:'2-digit'}:{weekday:'long',hour:'2-digit'}).format(new Date(at));
  return `<div class="forecast ${hours<12?'soon':''}">au rythme actuel, épuisé ${hours<24?'à ':''}${when}</div>`;
}
// Coût équivalent API (feature 16). « usage terminal » partout : le web n'est pas journalisé.
// Deux devises côte à côte. L'euro vient d'un taux daté (costs.eurPerUsd), pas d'un appel réseau.
// Montants en chiffres entiers avec séparateur de milliers (« 79 739 $ »), jamais abrégés en « k ».
// Sous 10, deux décimales pour ne pas afficher « 9 $ » quand c'est 9,00.
const fmt1=(v,sym)=>v>=10?`${Math.round(v).toLocaleString('fr-FR')} ${sym}`:`${v.toFixed(2)} ${sym}`;
const fmtUSD=v=>v==null?'':fmt1(v,'$');
const fmtDual=v=>{const r=appData?.costs?.eurPerUsd; if(v==null)return ''; return r?`${fmt1(v,'$')} · ${fmt1(v*r,'€')}`:fmt1(v,'$');};
// Le coût équivalent API vient des logs locaux de `claude` et `codex`, qui ne portent aucune
// identité de compte : il est à l'échelle de la machine. L'afficher sur chaque carte le ferait
// compter plusieurs fois ; il reste donc au niveau du fournisseur, explicitement étiqueté.
function manualResetLine(w,account){
  const primary=account.provider==='openai'?w.primaryLimit!==false&&isWeekly(w):!isScopedWeekly(w)&&(isWeekly(w)||String(w.windowId)==='five_hour');
  if(!primary)return '';

  const status=fresh?reset.status:'unknown';
  if(status==='available'){
    if(account.provider==='claude'&&reset.scope==='weekly'&&!isWeekly(w))return '';
    if(account.provider==='claude'&&reset.scope==='session'&&isWeekly(w))return '';
    const count=Number.isInteger(reset.count)&&reset.count>0?`${reset.count} disponible${reset.count>1?'s':''}`:'disponible';
    const detail=account.provider==='claude'&&reset.scope==='unknown'?' · portée à voir dans Claude':'';
    return `<div class="manual-reset available">Reset manuel : ${count}${detail}</div>`;
  }
  if(status==='none')return '<div class="manual-reset">Reset manuel : aucun disponible</div>';
  return `<div class="manual-reset">Reset manuel : ${account.provider==='claude'?'à vérifier dans Claude':'statut non vérifié'}</div>`;
}
function quotaCard(w,account,history){const id=account.provider,value=used(w),key=historyKey(account,w);return `<div class="quota-card"><div class="quota-top"><span>${esc(w.label)}</span><strong>${value===null?'—':(100-value)+' % restant'}</strong></div><div class="quota-track" style="--provider:${providerColor(id)}"><i style="width:${value??0}%"></i></div><div class="quota-foot"><small>reset ${countdown(w.resetsAt)} · ${resetFull(w.resetsAt)}</small>${sparkline(history,key,providerColor(id))}</div>${forecastLine(key)}${manualResetLine(w,account)}</div>`}
// Toujours en millions de tokens, homogène d'une ligne à l'autre : une décimale sous le milliard,
// entier avec séparateur de milliers au-delà (« 9 741 M » plutôt que « 9.7 G »).
const fmtTokens=v=>{if(v==null)return '';const m=v/1e6;return `${m>=1000?Math.round(m).toLocaleString('fr-FR'):m.toFixed(1)} M`;};
// Infobulle des tarifs appliqués, par million de tokens, pour les modèles présents dans la fenêtre.
function tariffTitle(prices){

// Tableau Modèle | Tokens | Coût, trié par coût décroissant (côté natif) ; non tarifés en fin, coût «—».
function modelBreakdown(d){
  const rows=d.breakdown||[];
  if(!rows.length)return '';
  const body=rows.map(r=>`<tr class="model-row${r.cost==null?' unpriced':''}"><td>${esc(r.model)}</td><td class="num">${fmtTokens(r.tokens)}</td><td class="num">${r.cost==null?'—':fmtDual(r.cost)}</td></tr>`).join('');

// Période affichée par le compteur équivalent API. Choix d'affichage, pas un réglage de fond :

const COST_PERIODS=[['d8','8 jours'],['d30','30 jours']];

function providerCostTotal(id){

  const d=id==='openai'?c.codex:c.claude;

  let line=`Prévision : en apprentissage (${count}/3)`;
  if(count>=3){
    if(s.status==='estimated'&&Number.isFinite(s.earliestAt)&&Number.isFinite(s.latestAt)&&s.latestAt>=s.earliestAt)
      line=`Reset estimé : ${date(s.earliestAt)} – ${date(s.latestAt)} · confiance ${s.confidence==='moderate'?'modérée':'faible'}`;
    else if(s.status==='overdue')line='Prévision dépassée · en attente du reset';

  }
  if(s.basis==='public'){
    if(s.status==='publicEstimated'&&Number.isFinite(s.estimatedAt))line=`Reset possible vers le ${date(s.estimatedAt)} · repère public · confiance faible`;

  const cadence=Number.isFinite(s.medianSeconds)&&s.medianSeconds>0?` Intervalle médian : ${new Intl.NumberFormat('fr-FR',{maximumFractionDigits:1}).format(s.medianSeconds/86400)} j.`:'';
  return `<div class="weekly-reset-estimate" style="font-size:12px;color:var(--muted);line-height:1.5;margin-top:8px" title="${esc(`${count} renouvellements observés sur 180 jours.${cadence}${publicNote} Estimation indicative du quota hebdomadaire global, distincte de l’échéance annoncée.`)}">${esc(line)}</div>`;
}
function lastWeeklyReset(account){

  const date=valid?new Intl.DateTimeFormat('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(t*1000)):'Non observée';
  return `<div class="last-weekly-reset" style="font-size:12px;color:var(--muted);line-height:1.5;margin:8px 0" title="Date de détection par Status du renouvellement du quota hebdomadaire global ; l’heure réelle peut être antérieure.">Dernière réinitialisation hebdo observée : ${date}</div>`;

function extraCreditsCard(account){
  const c=account.extraCredits||{},known=c.status==='known';
  const fmt=n=>new Intl.NumberFormat('fr-FR',{maximumFractionDigits:2}).format(n);
  const money=(n,currency=c.currency)=>{if(typeof n!=='number'||!Number.isFinite(n))return 'indisponible';
    return /^[A-Z]{3}$/.test(currency||'')?new Intl.NumberFormat('fr-FR',{style:'currency',currency}).format(n):`${fmt(n)} (devise non fournie)`;};
  let value='Solde indisponible',detail='';
  if(known&&c.unit==='credits'){
    value=c.unlimited?'Crédits illimités':typeof c.balance==='number'?`${fmt(c.balance)} crédits restants`:c.hasCredits?'Crédits disponibles · solde non fourni':'Aucun crédit supplémentaire';
  }else if(known){

function publicResetContext(provider){

// Vue « 7 jours » (feature 7) : superpose les fenêtres hebdomadaires des deux fournisseurs sur
// une semaine glissante, à partir de l'historique horodaté. OpenAI y figure au même titre que
// Claude (feature 11), puisque l'historique stocke les deux.
// Une série par compte et par fenêtre hebdomadaire. Les clés en dur d'avant le multi-comptes ne
// pouvaient nommer qu'un compte par fournisseur ; la couleur vient du fournisseur, nuancée par le
// rang du compte pour que deux comptes Claude restent distinguables.
// Les thèmes n'exposent que --chart-a et --chart-b : au-delà du premier compte, la couleur du
// fournisseur est déclinée par rang plutôt que de pointer des jetons qui n'existent pas — une
// variable absente donnerait une courbe invisible, sans rien signaler.
const seriesColor=(providerId,rank)=>rank===0?providerColor(providerId)
  :`color-mix(in oklab, ${providerColor(providerId)} ${Math.max(30,100-rank*22)}%, var(--chart-a))`;
function weeklySeriesFor(data){
  const out=[];
  PROVIDERS.forEach(p=>{
    accountsOf(data,p.id).forEach((account,rank)=>{
      windowsFor(p.id,account).filter(isWeekly).forEach(w=>{
        const suffix=isScopedWeekly(w)?` ${w.label}`:' semaine';
        out.push({key:historyKey(account,w),label:`${account.label}${suffix}`,
                  color:isScopedWeekly(w)?'var(--chart-b)':seriesColor(p.id,rank)});
      });
    });
  });
  return out;
}
// `data` et non le seul historique : les séries se déduisent des comptes, et aller les chercher
// dans le global appData rendait la fonction dépendante d'un état invisible depuis sa signature.
function weeklyChart(data){
  const history=data?.history;
  if(!history||history.length<2)return '';
  const now=Date.now()/1000, start=now-7*86400, W=920, H=150;

    return {...s,pts};
  }).filter(s=>s.pts.length>1);
  if(!series.length)return '';
  const paths=series.map(s=>{
    const line=s.pts.map((p,i)=>`${i?'L':'M'}${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
    const last=s.pts[s.pts.length-1];
    return `<path fill="none" stroke="${s.color}" stroke-width="1.6" vector-effect="non-scaling-stroke" d="${line}"/>`+
           `<circle cx="${x(last.t).toFixed(1)}" cy="${y(last.v).toFixed(1)}" r="2.5" fill="${s.color}"/>`;
  }).join('');
  // Repères de jours : une ligne verticale discrète par 24 h.

  for(let d=1;d<7;d++){const gx=x(start+d*86400);grid+=`<line x1="${gx}" y1="0" x2="${gx}" y2="${H}" stroke="var(--hair)" stroke-width="0.5"/>`}

  return `<div class="weekly"><div class="section-head"><div><h2>Consommation · 7 jours</h2><p>Pourcentage de chaque fenêtre hebdomadaire au fil de la semaine.</p></div></div>
    <svg class="wk-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}${paths}</svg>
    <div class="wk-legend">${legend}</div></div>`;
}
const hasFable=accounts=>(accounts||[]).some(a=>(a.windows||[]).some(w=>/fable/i.test(w.windowId||w.label||'')&&Number(w.resetsAt)>Date.now()/1000));

function availability(account){
  if(!isConnected(account.provider,account)||account.error||account.stale||(account.capturedAt&&Date.now()/1000-account.capturedAt>1800))return null;
  const windows=usableWindows(account),weekly=windows.filter(w=>isWeekly(w)&&!isScopedWeekly(w)&&!/spark/i.test(w.label||w.windowId||''));

// avec dix comptes possibles, une liste complète y serait illisible. Ici la place existe.
function pinnedOptions(data,metric){
  const rows=[];
  PROVIDERS.forEach(p=>{
    const accounts=accountsOf(data,p.id);
    if(accounts.length<2)return;  // un seul compte : l'agrégat dit déjà exactement la même chose
    accounts.forEach(account=>{
      const kinds=p.id==='openai'?[['weekly','sem.']]:[['weekly','sem.'],['session','5 h'],...(hasFable([account])?[['weekly-fable','Fable']]:[])];
      const buttons=kinds.map(([kind,label])=>{
        const value=`acct:${account.provider}:${account.accountId}:${kind}`;
        return `<button class="seg ${(data.prefs?.providerMenuMetrics?.[account.provider]||metric)===value?'on':''}" onclick="send('setMenuBarMetric',{value:'${value}'})">${label}</button>`;
      }).join('');
      rows.push(`<div class="pin-row"><span class="pin-name">${esc(account.label)}</span><div class="segmented">${buttons}</div></div>`);
    });
  });
  return rows.length?`<div class="pin-list"><small>Épingler un compte précis</small>${rows.join('')}</div>`:'';
}

// frame du glisser (« input » mettrait à jour l'affichage local seulement, sans spammer le natif).
function displayCard(display){
  const badge=`<span class="display-badge ${display.kind==='builtin'?'builtin':''}">${display.kind==='builtin'?'interne':'externe'}</span>`;
  if(!display.available){
    return `<div class="display-card"><div class="display-head"><span class="display-name">${esc(display.name)}</span>${badge}</div><div class="display-unavailable">DDC/CI indisponible — ce moniteur ne répond pas au pilotage de luminosité.</div></div>`;
  }
  const value=display.brightness??0;
  return `<div class="display-card"><div class="display-head"><span class="display-name">${esc(display.name)}</span>${badge}</div><div class="brightness-row"><input type="range" class="brightness-slider" min="0" max="100" value="${value}" oninput="this.nextElementSibling.textContent=this.value+' %'" onchange="send('setBrightness',{id:'${display.id}',value:Number(this.value)})"><span class="brightness-value">${value} %</span></div></div>`;
}
function displaysView(data){
  const displays=data.displays||[];
  const cards=displays.length?displays.map(displayCard).join(''):'<div class="quota-empty">Aucun écran détecté.</div>';
  return `<div class="toolbar"><h1>Écrans</h1></div><div class="section-head"><div><h2>Luminosité</h2><p>Un curseur par écran détecté. Un moniteur externe qui ne répond pas au DDC/CI reste listé, sans curseur actionnable.</p></div></div><div class="display-grid">${cards}</div>`;
}
function connectionsView(data){
  const limit=data.accountLimit||5;
  const section=(provider,note,panel)=>{
    const accounts=accountsOf(data,provider.id);
    const panels=accounts.map(panel).join('')||`<div class="quota-empty">Aucun compte ${provider.name}.</div>`;
    const full=accounts.length>=limit;
    const add=`<button class="account-action primary" ${full?'disabled':''} onclick="send('addAccount',{provider:'${provider.id}'})" title="${full?`Maximum de ${limit} comptes atteint`:'Ajouter un compte'}">Ajouter un compte</button>`;
    // --provider doit vivre sur le panneau, pas seulement sur le bloc d'un compte : « Ajouter un
    // compte » l'utilise comme fond, et sans lui le bouton s'affichait en texte quasi noir sur
    // fond sombre — présent, mais invisible.
    return `<article class="connection-panel" style="--provider:${providerColor(provider.id)}"><h3>${provider.name}</h3><p>${note}</p>${panels}<div class="account-add">${add}<small>${accounts.length} / ${limit}</small></div></article>`;
  };
  return `<div class="connections">${section(PROVIDERS[0],'Connexion ChatGPT · une session par compte.',openAIPanel)}${section(PROVIDERS[1],'Suivi automatique via une session web isolée par compte. Claude Code reste disponible en option.',claudePanel)}</div>`;
}
function render(){
  if(!appData)return;
  document.documentElement.dataset.theme=appData.prefs?.theme||'blueprint';
  document.querySelector('#overview').innerHTML=overview(appData);
  document.querySelector('#displays').innerHTML=displaysView(appData);
  document.querySelector('#settings').innerHTML=settingsView(appData);
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===currentView));
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===currentView));
  const accounts=appData.accounts||[];
  const errors=accounts.some(a=>a.error);
  const connected=accounts.some(a=>isConnected(a.provider,a));
  document.querySelector('#stateText').textContent=errors?'Attention requise':connected?'Connecté':'Non connecté';
  document.querySelector('#stateDot').className=errors?'warn':connected?'live':'';
}
// ─── Moniteur système ───────────────────────────────────────────────────────
// Flux séparé des quotas : le natif pousse un snapshot par seconde quand la fenêtre est visible.
// Cette vue a son propre chemin de rendu — re-render() global à 1 Hz reconstruirait trois vues
// pour rien.
let metricsData=null,hoverState=null;
const famGet=id=>metricsData?.families?.find(f=>f.id===id);
const fmtBytes=v=>{if(v==null||isNaN(v))return '—';const units=['o/s','Ko/s','Mo/s','Go/s'];let i=0;while(v>=1024&&i<units.length-1){v/=1024;i++}return (i&&v<10?v.toFixed(1):Math.round(v))+' '+units[i]};

// Multi-séries, une seule échelle (jamais de double axe) : % → 0-100 fixe, débits → max commun.
// data-* portent ce qu'il faut au survol pour relire les valeurs au point visé.
function metricChart(familyId,specs,{percent=false}={}){
  const family=famGet(familyId);if(!family)return '';
  const drawn=specs.map(s=>({...s,values:family.series?.[s.key]||[]})).filter(s=>s.values.length>1);
  if(!drawn.length)return '<div class="metric-empty">Mesure en cours…</div>';
  const w=300,h=56,len=Math.max(...drawn.map(s=>s.values.length));
  const max=percent?100:Math.max(1,...drawn.flatMap(s=>s.values));
  const paths=drawn.map(s=>{
    const offset=len-s.values.length;  // séries plus courtes (famille revenue de panne) : calées à droite
    const line=s.values.map((v,i)=>`${i?'L':'M'}${((offset+i)/(len-1)*w).toFixed(1)},${(h-Math.min(v,max)/max*h).toFixed(1)}`).join(' ');
    return `<path class="area" fill="${s.color}" d="${line} L${w},${h} L${(offset/(len-1)*w).toFixed(1)},${h} Z"/><path class="line" stroke="${s.color}" d="${line}"/>`;
  }).join('');
  return `<div class="metric-chart"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" data-family="${familyId}" data-keys="${drawn.map(s=>s.key).join(',')}" data-labels="${drawn.map(s=>s.label||s.key).join(',')}" data-percent="${percent?1:0}">${percent?`<line class="gridline" x1="0" y1="${h/2}" x2="${w}" y2="${h/2}"/>`:''}<line class="baseline" x1="0" y1="${h}" x2="${w}" y2="${h}"/>${paths}</svg></div>`;
}
const readout=familyId=>{
  if(hoverState?.family!==familyId)return '';
  const family=famGet(familyId);if(!family)return '';
  const values=hoverState.keys.map((key,i)=>{const series=family.series?.[key]||[];const v=series[series.length-1-hoverState.back];return `${hoverState.labels[i]} ${hoverState.percent?(v==null?'—':Math.round(v)+' %'):fmtBytes(v)}`});
  return `il y a ${hoverState.back} s · ${values.join(' · ')}`;
};
const legend=pairs=>`<div class="metric-legend">${pairs.map(([color,label])=>`<span><i style="background:${color}"></i>${label}</span>`).join('')}</div>`;
const PRESSURE={1:['normale',''],2:['élevée','warn'],4:['critique','crit']};
const fmtSize=v=>{if(v==null||isNaN(v))return '—';const units=['o','Ko','Mo','Go'];let i=0;while(v>=1024&&i<units.length-1){v/=1024;i++}return (i&&v<10?v.toFixed(1):Math.round(v))+' '+units[i]};
const fmtUptime=s=>{if(s==null)return '—';const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return d?`${d} j ${h} h`:h?`${h} h ${String(m).padStart(2,'0')}`:`${m} min`};

// ─ Vues détaillées (clic sur une carte) ─
// L'état survit au re-render à 1 Hz, comme hoverState.
const expanded=new Set();
// « coreTypes » partage le préfixe « core » mais n'est pas un cœur : c'est la chaîne E/P décrivant
// leur type. L'exclure partout, sinon +'Types'.slice(4) donne NaN et casse le tri.
const coreKeys=source=>Object.keys(source||{}).filter(k=>k.startsWith('core')&&k!=='coreTypes').sort((a,b)=>+a.slice(4)-+b.slice(4));
function detailCPU(cpu){const cores=coreKeys(cpu.series);
  return `<div class="detail-grid">${cores.map(c=>`<div class="detail-cell"><div class="detail-label">cœur ${c.slice(4)} · ${cpu.now[c]==null?'—':Math.round(cpu.now[c])+' %'}</div>${metricChart('cpu',[{key:c,color:'var(--chart-a)',label:c}],{percent:true})}</div>`).join('')}</div>`}
// Schéma des cœurs : deux blocs étiquetés quand la machine distingue Performance et Efficience
// (coreTypes fourni par le natif), une rangée uniforme sinon.
function coreSchematic(cpu){
  const bar=i=>{const v=cpu.now['core'+i];
    return `<i style="height:${Math.max(4,v??0)}%" title="cœur ${i} · ${v==null?'—':Math.round(v)+' %'}"></i>`};
  const types=cpu.now.coreTypes;
  if(!types)return `<div class="core-bars" title="un trait par cœur">${coreKeys(cpu.now).map(k=>bar(+k.slice(4))).join('')}</div>`;
  const perf=[],eff=[];
  for(let i=0;i<types.length;i++)(types[i]==='E'?eff:perf).push(i);
  const group=(label,idx)=>idx.length?`<div><span class="core-group-label">${label} · ${idx.length}</span><div class="core-bars">${idx.map(bar).join('')}</div></div>`:'';
  return `<div class="core-schematic">${group('Performance',perf)}${group('Efficience',eff)}</div>`;
}
// GPU : le détail expose ce que le matériel donne en plus de la charge globale — les deux étages
// (rendu, tuilage) et la mémoire réellement en service. Le GPU ne se ventile pas par cœur.
function detailGPU(gpu){
  const mem=gpu.now.memInUse!=null?`<div class="detail-rows"><div class="detail-row"><span class="detail-label">mémoire GPU en usage</span><span>${fmtSize(gpu.now.memInUse)}</span></div></div>`:'';
  return metricChart('gpu',[{key:'renderer',color:'var(--chart-a)',label:'Renderer'},{key:'tiler',color:'var(--chart-b)',label:'Tiler'}],{percent:true})
    +legend([['var(--chart-a)','Renderer'],['var(--chart-b)','Tiler']])+mem;
}
const fmtMinutes=m=>{if(m==null)return '—';const h=Math.floor(m/60),mm=Math.round(m%60);return h?`${h} h ${String(mm).padStart(2,'0')}`:`${mm} min`};
const fmtDecimal=v=>String(v).replace('.',',');
// Le dépliage complète la rangée de stats (santé/cycles/watts/autonomie déjà en tête) : santé
// détaillée en mAh, condition, chargeur, température, tension.
function detailBattery(battery){
  const n=battery.now;
  const row=(label,value)=>`<div class="detail-row"><span class="detail-label">${label}</span><span>${value}</span></div>`;
  const rows=[];
  rows.push(row('condition',n.conditionOK?'normale':'à faire réviser'));
  if(n.designCapacity!=null&&n.fullCapacity!=null)rows.push(row('capacité (pleine / conception)',`${n.fullCapacity} / ${n.designCapacity} mAh`));
  if(n.adapterWatts!=null)rows.push(row('chargeur',n.adapterWatts+' W'));
  if(n.temperatureC!=null)rows.push(row('température',Math.round(n.temperatureC)+' °C'));
  if(n.voltageV!=null)rows.push(row('tension',fmtDecimal(n.voltageV)+' V'));
  return `<div class="detail-rows">${rows.join('')}</div>`;
}
function detailNetwork(net){const ifaces=[...new Set(Object.keys(net.now).filter(k=>k.startsWith('rx:')).map(k=>k.slice(3)))].sort();
  return `<div class="detail-rows">${ifaces.map(name=>`<div class="detail-row"><span class="detail-label">${esc(name)}</span><span>↓ ${fmtBytes(net.now['rx:'+name])} · ↑ ${fmtBytes(net.now['tx:'+name])}</span></div>`).join('')||'<div class="metric-empty">Aucune interface active.</div>'}</div>`}
function storageSummary(now){return `<div class="storage-summary"><strong>${fmtSize(now.freeBytes)} libres</strong> sur ${fmtSize(now.totalBytes)}<br><button class="button" onclick="send('openStorageSettings')">Gérer le stockage</button></div>`;}
function detailDisk(disk){const volumes=Object.keys(disk.now).filter(k=>k.startsWith('vol:')).sort();
  return `<div class="detail-rows">${volumes.map(key=>{const pct=Math.round(disk.now[key]);return `<div class="detail-row"><span class="detail-label">${esc(key.slice(4))}</span><span>${pct} % utilisé</span></div><div class="quota-track" style="--provider:var(--chart-a)"><i style="width:${pct}%"></i></div>`}).join('')}</div>`;}
const DETAILS={cpu:detailCPU,gpu:detailGPU,network:detailNetwork,disk:detailDisk,battery:detailBattery};

// Le natif envoie l'union des plus gros consommateurs CPU, mémoire et énergie ; le tri se fait
// ici, pour que basculer de dimension ne coûte pas un aller-retour. Le GPU par processus n'existe
// pas sur macOS par une voie fiable — d'où CPU / mémoire / énergie et pas de GPU.
// Puissance moyenne d'un process : petits chiffres, plus lisibles en mW sous 1 W.
const fmtWatts=w=>w==null||w<0.0005?'—':w>=1?fmtDecimal(w.toFixed(1))+' W':Math.round(w*1000)+' mW';
let procSort='cpu';
function setProcSort(mode){procSort=mode;renderMonitor()}
function processesCard(){
  const processes=(metricsData?.processes||[]).slice();
  if(!processes.length)return '';
  const key={cpu:'cpuPercent',ram:'rssBytes',energy:'energyWatts'}[procSort];
  processes.sort((a,b)=>(b[key]||0)-(a[key]||0));
  const rows=processes.slice(0,8).map(p=>`<div class="proc-row"><span class="proc-name">${esc(p.name)}</span><span class="proc-mem proc-val ${procSort==='ram'?'sorted':''}">${fmtSize(p.rssBytes)}</span><span class="proc-cpu proc-val ${procSort==='cpu'?'sorted':''}">${p.cpuPercent<0.05?'—':p.cpuPercent.toFixed(1).replace('.',',')+' %'}</span><span class="proc-energy proc-val ${procSort==='energy'?'sorted':''}">${fmtWatts(p.energyWatts)}</span></div>`).join('');
  const toggle=`<div class="view-toggle">${[['cpu','CPU'],['ram','mémoire'],['energy','énergie']].map(([v,l])=>`<button class="${procSort===v?'on':''}" onclick="setProcSort('${v}')">${l}</button>`).join('')}</div>`;
  return `<div class="metric-card metric-card-wide"><div class="metric-head"><h3>Applications les plus gourmandes</h3>${toggle}</div>
    <div class="proc-head"><span>processus</span><span class="${procSort==='ram'?'sorted':''}">mémoire</span><span class="${procSort==='cpu'?'sorted':''}">CPU</span><span class="${procSort==='energy'?'sorted':''}">énergie</span></div>
    <div class="proc-rows">${rows}</div></div>`;
}
// Batterie : absente sur un Mac de bureau (le collecteur rend nil, la famille disparaît) — la
// carte ne s'affiche alors pas du tout, comme toute famille sans source.
function batteryCard(){
  const battery=famGet('battery');if(!battery)return '';
  const n=battery.now;
  const state=n.charging?'en charge':n.externalConnected?(n.fullyCharged?'branché · plein':'branché'):'sur batterie';
  // Rangée de stats toujours visible : les chiffres réclamés d'un coup d'œil, sans déplier.
  const cell=(value,label,warn)=>`<div class="stat-cell${warn?' warn':''}"><b>${value}</b><span>${label}</span></div>`;
  const stats=[];
  if(n.healthPercent!=null)stats.push(cell(Math.round(n.healthPercent)+' %','santé',n.healthPercent<80));
  if(n.cycleCount!=null)stats.push(cell(n.cycleCount,'cycles'));
  if(n.powerWatts!=null&&n.powerWatts!==0)stats.push(cell(`${n.powerWatts<0?'↓':'↑'} ${fmtDecimal(Math.abs(n.powerWatts))} W`,n.powerWatts<0?'décharge':'charge'));
  if(n.minutesRemaining!=null)stats.push(cell(fmtMinutes(n.minutesRemaining),n.charging?'avant plein':'autonomie'));
  if(!n.conditionOK)stats.push(cell('à réviser','condition',true));
  const statRow=stats.length?`<div class="stat-row">${stats.join('')}</div>`:'';
  return metricCard('battery','Batterie',
    `<span><span class="unit">${state}</span> <span class="metric-value">${n.percent==null?'—':Math.round(n.percent)+'<span class="unit">%</span>'}</span></span>`,
    statRow+metricChart('battery',[{key:'percent',color:'var(--chart-a)',label:'charge'}],{percent:true}));
}
// Capteurs : température, état thermique (badge seulement quand ce n'est plus « normal », comme la
// pression mémoire), et vitesse des ventilateurs. thermalState est toujours présent ; temp et
// ventilateurs dépendent de la machine.
const THERMAL_STATE=[['normal',''],['élevé','warn'],['sérieux','warn'],['bridage','crit']];
function sensorsCard(){
  const sensors=famGet('sensors');if(!sensors)return '';
  const n=sensors.now;
  const [tlabel,tclass]=THERMAL_STATE[n.thermalState]||['',''];
  const badge=n.thermalState>0?`<span class="metric-badge ${tclass}">thermique ${tlabel}</span> `:'';
  const temp=n.tempC!=null?`<span class="metric-value">${Math.round(n.tempC)}<span class="unit">°C</span></span>`:'<span class="metric-value" style="font-size:14px">—</span>';
  const fans=Object.keys(n).filter(k=>k.startsWith('fan')).sort();
  // Détail par famille de capteurs. Les noms matériels Apple Silicon sont opaques (« PMU tdie3 ») :
  // impossible d'étiqueter honnêtement « CPU » ou « GPU », d'où « SoC » / « périphériques ».
  const rows=[];
  if(n.dieMaxC!=null)rows.push([`SoC · ${n.dieCount} capteurs`,`${Math.round(n.dieMaxC)} °C max · ${Math.round(n.dieAvgC)} °C moy.`]);
  if(n.deviceMaxC!=null)rows.push([`périphériques · ${n.deviceCount}`,`${Math.round(n.deviceMaxC)} °C max · ${Math.round(n.deviceAvgC)} °C moy.`]);

  const detailLines=rows.length?`<div class="detail-rows" style="margin-top:8px">${rows.map(([l,v])=>`<div class="detail-row"><span class="detail-label">${l}</span><span>${v}</span></div>`).join('')}</div>`:'';
  const chart=n.tempC!=null?metricChart('sensors',[{key:'tempC',color:'var(--chart-a)',label:'temp.'}],{percent:true}):'';
  return metricCard('sensors','Capteurs',`<span>${badge}${temp}</span>`,chart+detailLines+fanPanel(fans.map(k=>n[k])));
}
function systemCard(){
  const system=famGet('system');if(!system)return '';
  const load=k=>system.now[k]==null?'—':system.now[k].toFixed(2).replace('.',',');
  return metricCard('system','Système',`<span class="metric-value" style="font-size:14px">up ${fmtUptime(system.now.uptimeSec)}</span>`,
    `<div class="detail-rows"><div class="detail-row"><span class="detail-label">charge 1 / 5 / 15 min</span><span>${load('load1')} / ${load('load5')} / ${load('load15')}</span></div><div class="detail-row"><span class="detail-label">processus</span><span>${system.now.processCount??'—'}</span></div></div>`
    +metricChart('system',[{key:'load1',color:'var(--chart-a)',label:'charge 1 min'}]));
}

function metricCard(familyId,title,valueHTML,body){
  const expandable=DETAILS[familyId],isOpen=expandable&&expanded.has(familyId);
  const detail=isOpen?`<div class="metric-detail">${DETAILS[familyId](famGet(familyId))}</div>`:'';
  return `<div class="metric-card ${expandable?'expandable':''}" data-family="${familyId}"><div class="metric-head"><h3>${title}${expandable?`<span class="chevron">${isOpen?'▾':'▸'}</span>`:''}</h3>${valueHTML}</div><div class="metric-readout">${readout(familyId)}</div>${body}${detail}</div>`;
}
function monitorView(){
  if(!metricsData?.families?.length)return `<div class="toolbar"><h1>Moniteur</h1></div><div class="metric-empty">Première mesure en cours…</div>`;
  const cpu=famGet('cpu'),gpu=famGet('gpu'),ram=famGet('ram'),net=famGet('network'),disk=famGet('disk'),sensors=famGet('sensors');
  const pct=v=>v==null?'—':`${Math.round(v)}<span class="unit">%</span>`;
  const cards=[];
  if(cpu)cards.push(metricCard('cpu','CPU',`<span class="metric-value">${pct(cpu.now.total)}</span>`,
    metricChart('cpu',[{key:'total',color:'var(--chart-a)',label:'CPU'}],{percent:true})+coreSchematic(cpu)));
  if(gpu)cards.push(metricCard('gpu','GPU',`<span class="metric-value">${pct(gpu.now.usage)}</span>`,
    metricChart('gpu',[{key:'usage',color:'var(--chart-a)',label:'GPU'}],{percent:true})));
  if(ram){const [pressureLabel,pressureClass]=PRESSURE[ram.now.pressureLevel]||[];
    cards.push(metricCard('ram','Mémoire',`<span>${pressureLabel?`<span class="metric-badge ${pressureClass}">pression ${pressureLabel}</span> `:''}<span class="metric-value">${pct(ram.now.usedPercent)}</span></span>`,
      metricChart('ram',[{key:'usedPercent',color:'var(--chart-a)',label:'Occupée'}],{percent:true})));}
  const batteryHTML=batteryCard();if(batteryHTML)cards.push(batteryHTML);
  if(net)cards.push(metricCard('network','Réseau',`<span class="metric-value" style="font-size:14px">↓ ${fmtBytes(net.now.rxBytesPerSec)} · ↑ ${fmtBytes(net.now.txBytesPerSec)}</span>`,
    metricChart('network',[{key:'rxBytesPerSec',color:'var(--chart-a)',label:'↓ réception'},{key:'txBytesPerSec',color:'var(--chart-b)',label:'↑ émission'}])
    +legend([['var(--chart-a)','↓ réception'],['var(--chart-b)','↑ émission']])));
  if(disk)cards.push(metricCard('disk','Disque',`<span><span class="metric-value" style="font-size:14px">R ${fmtBytes(disk.now.readBytesPerSec)} · W ${fmtBytes(disk.now.writeBytesPerSec)}</span> <span class="unit">· plein à ${disk.now.usedPercent==null?'—':Math.round(disk.now.usedPercent)+' %'}</span></span>`,
    metricChart('disk',[{key:'readBytesPerSec',color:'var(--chart-a)',label:'lecture'},{key:'writeBytesPerSec',color:'var(--chart-b)',label:'écriture'}])
    +legend([['var(--chart-a)','lecture'],['var(--chart-b)','écriture']])+storageSummary(disk.now)));
  // La batterie a sa propre carte : Capteurs porte la température, l'état thermique et les ventilateurs.
  const sensorsHTML=sensorsCard();
  const interval=metricsData.intervalSeconds||1,windowMin=Math.round(300*interval/60);
  const modes=[['charts','graphiques'],['table','tableau'],['day','24 h']];
  const toggle=`<div class="view-toggle">${modes.map(([m,l])=>`<button class="${monitorMode===m?'on':''}" onclick="setMonitorMode('${m}')">${l}</button>`).join('')}</div>`;
  const meta=monitorMode==='day'?'1 point/min · 24 h glissantes':`1 échantillon/${interval} s · fenêtre ${windowMin} min`;
  const head=`<div class="toolbar"><h1>Moniteur</h1><span class="toolbar-meta">${meta}</span>${toggle}</div>`;
  if(monitorMode==='table')return head+monitorTable();
  if(monitorMode==='day')return head+monitorDay();
  // Regroupement par thème : on cherche « pourquoi ça chauffe / rame », pas une famille au hasard.
  const byId=Object.fromEntries(cards.map(html=>[html.match(/data-family="([^"]+)"/)?.[1],html]));
  const group=(title,html)=>html.filter(Boolean).length?`<section class="monitor-section"><h2>${title}</h2><div class="metric-grid">${html.filter(Boolean).join('')}</div></section>`:'';
  return head+vitalsStrip()
    +group('Calcul',[byId.cpu&&byId.cpu.replace('class="metric-card ','class="metric-card metric-card-wide '),byId.gpu,byId.ram])
    +group('Thermique et énergie',[sensorsHTML,byId.battery])
    +group('Entrées / sorties',[byId.network,byId.disk])
    +group('Système',[processesCard(),systemCard()]);
}
// Bandeau de tête : l'état de la machine d'un coup d'œil, chaque tuile menant à sa carte.
function sparkline(values,{min=0,max=null}={}){
  if(!values||values.length<2)return '';
  const w=100,h=22,hi=max??Math.max(min+1,...values),lo=max==null&&min==null?Math.min(...values):min;
  const d=values.map((v,i)=>`${i?'L':'M'}${(i/(values.length-1)*w).toFixed(1)},${(h-(Math.min(v,hi)-lo)/Math.max(1e-9,hi-lo)*h).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${d}"/></svg>`;
}
function vitalsStrip(){
  const tiles=[];
  const tile=(family,label,value,spark,level='')=>tiles.push(`<button class="vital ${level}" onclick="document.querySelector('.metric-card[data-family=${family}]')?.scrollIntoView({behavior:'smooth',block:'center'})"><span class="vital-label">${label}</span><span class="vital-value">${value}</span>${spark}</button>`);
  const pct=v=>v==null?'—':`${Math.round(v)}<small>%</small>`;
  const level=(v,warn,crit)=>v==null?'':v>=crit?'crit':v>=warn?'warn':'';
  const cpu=famGet('cpu'),gpu=famGet('gpu'),ram=famGet('ram'),sensors=famGet('sensors'),net=famGet('network'),disk=famGet('disk'),battery=famGet('battery');
  if(cpu)tile('cpu','CPU',pct(cpu.now.total),sparkline(cpu.series?.total,{max:100}),level(cpu.now.total,85,95));
  if(gpu)tile('gpu','GPU',pct(gpu.now.usage),sparkline(gpu.series?.usage,{max:100}),level(gpu.now.usage,85,95));
  if(ram)tile('ram','Mémoire',pct(ram.now.usedPercent),sparkline(ram.series?.usedPercent,{max:100}),ram.now.pressureLevel>=4?'crit':ram.now.pressureLevel>=2?'warn':'');
  if(sensors?.now.tempC!=null)tile('sensors','Temp.',`${Math.round(sensors.now.tempC)}<small>°C</small>`,sparkline(sensors.series?.tempC,{min:null}),level(sensors.now.tempC,85,95));
  const fanKeys=sensors?Object.keys(sensors.now).filter(k=>k.startsWith('fan')).sort():[];
  if(fanKeys.length){const avg=fanKeys.reduce((a,k)=>a+sensors.now[k],0)/fanKeys.length;
    tile('sensors','Ventil. · tr/min',`${Math.round(avg).toLocaleString('fr-FR')}`,sparkline(sensors.series?.[fanKeys[0]],{min:0}),appData?.tools?.lidMode?.fanBoost?.active?'boost':'');}
  if(net)tile('network','Réseau ↓',fmtBytes(net.now.rxBytesPerSec),sparkline(net.series?.rxBytesPerSec));
  if(disk)tile('disk','Disque libre',fmtSize(disk.now.freeBytes),sparkline(disk.series?.readBytesPerSec),level(disk.now.usedPercent,90,97));
  if(battery)tile('battery','Batterie',pct(battery.now.percent),sparkline(battery.series?.percent,{max:100}),battery.now.percent!=null&&battery.now.percent<=10&&!battery.now.externalConnected?'crit':'');
  return tiles.length?`<div class="vitals">${tiles.join('')}</div>`:'';
}
// Ventilateurs dans la carte Capteurs : vitesse relative au maximum du Mac, et boost à portée.
function fanPanel(rpms){
  const lid=appData?.tools?.lidMode||{},f=lid.fanBoost||{},fans=f.fans?.length?f.fans:rpms.map(rpm=>({rpm}));
  if(!fans.length)return '';
  const rows=fans.map((fan,i)=>{const max=fan.maxRPM||0,share=max?Math.min(100,fan.rpm/max*100):0;
    return `<div class="fan-meter"><span>ventilateur ${i+1}${fan.mode===1?' · manuel':''}</span><b>${Math.round(fan.rpm).toLocaleString('fr-FR')} tr/min</b>${max?`<div class="quota-track" style="--provider:var(--chart-a)"><i style="width:${share}%"></i></div>`:''}</div>`;}).join('');
  const service=lid.authorized&&f.version===2&&!lid.unconfirmed,stop=f.active||f.restorationPending||f.manualOutsideBoost;
  const seg=(kind,value,label,on)=>`<button class="seg ${on?'on':''}" onclick="event.stopPropagation();setFanChoice('${kind}',${value});renderMonitor()">${label}</button>`;
  const controls=!service?'':stop
    ?`<div class="fan-actions"><strong>${f.active?`${f.verified?'Boost':'Montée'} ${(f.percent||100)>=100?'max':f.percent+' %'} · ${Math.ceil((f.remainingSeconds||0)/60)} min`:'Ventilateur en manuel'}</strong><button class="button" ${lid.busy?'disabled':''} onclick="send('stopFanBoost')">Auto Apple</button></div>`
    :`<div class="fan-actions"><div class="segmented">${FAN_LEVELS.map(([p,l])=>seg('percent',p,l==='Maximum'?'Max':l,fanPercent===p)).join('')}</div><div class="segmented">${FAN_DURATIONS.map(m=>seg('minutes',m,m+' min',fanMinutes===m)).join('')}</div><button class="button" ${lid.busy?'disabled':''} onclick="startFanBoost()">Boost</button></div>`;
  return `<div class="fan-panel">${rows}${controls}</div>`;
}
// Les courbes sont muettes au clavier et au lecteur d'écran. Ce tableau dit la même chose en
// texte : valeur courante, min, max, moyenne sur la fenêtre glissante.
let monitorMode='charts';
const stats=values=>{
  if(!values?.length)return null;
  const sum=values.reduce((a,b)=>a+b,0);
  return {now:values[values.length-1],min:Math.min(...values),max:Math.max(...values),avg:sum/values.length};
};
// Le format ne se déduit pas de l'unité : une charge de 2,4 arrondie à l'entier ne dit plus rien.
const METRIC_LABELS={'cpu.total':['CPU','%','int'],'gpu.usage':['GPU','%','int'],
  'gpu.renderer':['GPU rendu','%','int'],'gpu.tiler':['GPU tuilage','%','int'],
  'ram.usedPercent':['Mémoire','%','int'],'battery.percent':['Batterie','%','int'],
  'network.rxBytesPerSec':['Réseau ↓','','bytes'],'network.txBytesPerSec':['Réseau ↑','','bytes'],
  'disk.readBytesPerSec':['Disque lecture','','bytes'],'disk.writeBytesPerSec':['Disque écriture','','bytes'],
  'sensors.tempC':['Température','°C','int'],'sensors.fan0':['Ventilateur 1','tr/min','int'],
  'sensors.fan1':['Ventilateur 2','tr/min','int'],'system.load1':['Charge 1 min','','decimal']};
function monitorTable(){
  const rows=[];
  for(const [path,[label,unit,kind]] of Object.entries(METRIC_LABELS)){
    const [familyId,key]=path.split('.');
    const family=famGet(familyId);if(!family)continue;
    const s=stats(family.series?.[key]);if(!s)continue;
    const fmt=v=>kind==='bytes'?fmtBytes(v)
      :kind==='decimal'?v.toFixed(2).replace('.',',')
      :Math.round(v)+(unit?' '+unit:'');
    rows.push(`<tr><td>${label}</td><td>${fmt(s.now)}</td><td>${fmt(s.min)}</td><td>${fmt(s.max)}</td><td>${fmt(s.avg)}</td></tr>`);
  }
  if(!rows.length)return '<div class="metric-empty">Mesure en cours…</div>';
  return `<table class="metric-table"><thead><tr><th>Métrique</th><th>Actuel</th><th>Min</th><th>Max</th><th>Moyenne</th></tr></thead><tbody>${rows.join('')}</tbody></table>`;
}
// Vue 24 h : alimentée par l'historique long (une ligne par minute, persisté), pas par les anneaux
// en mémoire. Les points sont horodatés, donc une coupure d'app laisse un trou réel dans la courbe
// plutôt qu'un raccord silencieux — on trace en fonction du temps, pas de l'index.
const DAY_METRICS=[
  ['cpu','CPU','%',v=>Math.round(v)+' %'],
  ['temp','Température','°C',v=>Math.round(v)+' °C'],
  ['ram','Mémoire','%',v=>Math.round(v)+' %'],
  ['gpu','GPU','%',v=>Math.round(v)+' %'],
  ['batt','Batterie','%',v=>Math.round(v)+' %'],
];
function monitorDay(){
  const log=(appData?.metricsLog||[]).filter(r=>r&&typeof r.t==='number');
  if(log.length<2)return `<div class="metric-empty">L’historique 24 h se constitue — un point par minute. Revenez dans quelques minutes.</div>`;
  const t0=log[0].t,t1=log[log.length-1].t,span=Math.max(1,t1-t0);
  const spanH=span/3600;
  const cards=DAY_METRICS.map(([key,label,unit,fmt])=>{
    const pts=log.filter(r=>typeof r[key]==='number');
    if(pts.length<2)return '';
    const vals=pts.map(r=>r[key]);
    const min=Math.min(...vals),max=Math.max(...vals),avg=vals.reduce((a,b)=>a+b,0)/vals.length;
    // Échelle Y : 0-100 pour les pourcentages, ajustée aux valeurs pour les températures.
    const lo=unit==='%'?0:Math.floor(min-2),hi=unit==='%'?100:Math.ceil(max+2);
    const W=560,H=90;
    // Un écart de plus de 3 min entre deux points = trou (app fermée, veille) : on coupe le tracé.
    let d='',open=false;
    pts.forEach((r,i)=>{
      const gap=i>0&&(r.t-pts[i-1].t)>180;
      const x=((r.t-t0)/span*W).toFixed(1),y=(H-(r[key]-lo)/Math.max(1,hi-lo)*H).toFixed(1);
      if(!open||gap){d+=`M${x},${y}`;open=true}else d+=`L${x},${y}`;
    });
    const peak=pts.reduce((a,b)=>b[key]>a[key]?b:a);
    const peakAt=new Date(peak.t*1000).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    return `<div class="day-card">
      <div class="day-head"><strong>${label}</strong><span class="day-stats">max <b>${fmt(max)}</b> à ${peakAt} · moy. ${fmt(avg)} · min ${fmt(min)}</span></div>
      <svg class="day-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="var(--chart-a)" stroke-width="1.4" vector-effect="non-scaling-stroke"/></svg>
    </div>`;
  }).filter(Boolean);
  if(!cards.length)return '<div class="metric-empty">Historique 24 h vide.</div>';
  const axis=`<div class="day-axis"><span>${new Date(t0*1000).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</span><span>${spanH<1?Math.round(span/60)+' min':Math.round(spanH)+' h d’historique'}</span><span>${new Date(t1*1000).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</span></div>`;
  return `<div class="day-grid">${cards.join('')}</div>${axis}`;
}
function setMonitorMode(mode){monitorMode=mode;renderMonitor()}
function renderMonitor(){if(currentView!=='monitor')return;const section=document.querySelector('#monitor');if(section)section.innerHTML=monitorView()}
// Survol : l'état vit hors DOM parce que le re-render à 1 Hz remplace le innerHTML — l'état
// persiste, la lecture au point visé aussi.
document.querySelector('#monitor').addEventListener('mousemove',event=>{
  const svg=event.target.closest('svg[data-family]');if(!svg)return;
  const family=famGet(svg.dataset.family);if(!family)return;
  const keys=svg.dataset.keys.split(',');
  const len=Math.max(...keys.map(k=>(family.series?.[k]||[]).length));
  const rect=svg.getBoundingClientRect();
  const index=Math.round((event.clientX-rect.left)/rect.width*(len-1));
  hoverState={family:svg.dataset.family,keys,labels:svg.dataset.labels.split(','),percent:svg.dataset.percent==='1',back:Math.max(0,len-1-index)};
  const card=svg.closest('.metric-card');if(card)card.querySelector('.metric-readout').textContent=readout(svg.dataset.family);
});
document.querySelector('#monitor').addEventListener('mouseleave',()=>{hoverState=null;renderMonitor()});
document.querySelector('#monitor').addEventListener('click',event=>{
  const card=event.target.closest('.metric-card.expandable');if(!card)return;
  const family=card.dataset.family;
  expanded.has(family)?expanded.delete(family):expanded.add(family);
  renderMonitor();
});
// Tick incrémental : le natif n'envoie les séries qu'à l'ouverture ; ensuite chaque tick n'apporte
// que `now` et la série glisse ici, avec la sémantique de l'anneau natif (plafond 300, valeurs non
// numériques écartées, famille absente du delta sortie du snapshot). Delta sans base : ignoré, le
// natif renvoie un payload complet dès que la surface se rouvre.
const METRICS_RING=300;
function mergeMetricsDelta(state,payload){
  if(!payload?.delta)return payload;
  if(!state)return null;
  const families=(payload.families||[]).map(d=>{
    const prev=(state.families||[]).find(f=>f.id===d.id);
    const series={...(prev?.series||{})};
    for(const[k,v]of Object.entries(d.now||{})){
      if(typeof v!=='number')continue;
      const grown=(series[k]||[]).concat(v);
      series[k]=grown.length>METRICS_RING?grown.slice(grown.length-METRICS_RING):grown;
    }
    return{...d,series};
  });
  const merged={...state,...payload,families};
  delete merged.delta;
  return merged;
}
window.StatusApp={update(data){appData=data;render()},updateMetrics(data){const m=mergeMetricsDelta(metricsData,data);if(m){metricsData=m;renderMonitor()}}};
// Le basculement d'onglet ne passe pas par render() : celui-ci sort quand les quotas ne sont pas
// encore arrivés, et le Moniteur — flux indépendant — doit rester joignable même dans ce cas.
function goToView(view){
  // Les comptes vivent désormais dans Réglages : les anciens liens « Connexions » y mènent.
  if(view==='connections'){view='settings';settingsTab='accounts';}
  currentView=view;
  send('setMonitorVisible',{visible:view==='monitor'});
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===currentView));
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===currentView));
  render();renderMonitor();
}
// Exposé sur window : le HTML généré porte des attributs onclick, qui ne voient que le global.
window.goToView=goToView;
document.querySelectorAll('.nav button').forEach(button=>button.onclick=()=>goToView(button.dataset.view));
// The countdowns must keep ticking between the 5-minute polls, otherwise "dans 2 h 14" quietly
// becomes a lie. Re-rendering from the last payload is cheap and needs no native round-trip.
setInterval(()=>{if(appData)render()},30000);
</script>

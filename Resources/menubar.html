<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="themes.css">
<style>
  /* Le thème actif vient de themes.css ([data-theme] sur <html>, poussé par renderMenu()) ;
     cyan = OpenAI, violet = Claude reste la convention par défaut, mais chaque thème peut
     réassigner --blue/--purple à ses deux teintes propres. */
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;color:var(--text);font:12.5px/1.4 var(--font);
    background:var(--bg);
    background-image:var(--bg-image,linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px));
    background-size:var(--bg-size,22px 22px,22px 22px)}
  button{font:inherit;color:inherit}
  .popover{height:100%;display:flex;flex-direction:column;clip-path:var(--clip,none)}
  /* min-height:0 + overflow-y:auto : filet de sécurité — si le contenu dépasse (Fable +
     coût + métriques), la zone défile au lieu de pousser le pied de page hors du popover. */
  /* Une seule grille pour les deux fournisseurs, plutôt que deux colonnes empilant chacune son
     contenu : chaque donnée (nom, valeur, fenêtre, reset, sous-jauges, fraîcheur, coût) occupe une
     rangée commune, si bien que les lignes se comparent à l'horizontale. Claude a des sous-jauges
     qu'OpenAI n'a pas ; la rangée existe des deux côtés et reste vide en face au lieu de décaler
     tout ce qui suit. La huitième rangée, sans contenu, absorbe le vide restant. */
    flex:1;min-height:0;overflow-y:auto}
  /* Nom du compte retenu, quand il y en a plusieurs : sans lui le chiffre ne dit pas de qui il parle. */
  .value .unit{font-size:.42em;margin-left:.08em;opacity:.65;font-weight:400}
  .value{font-size:44px;line-height:1;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--provider);text-shadow:var(--value-glow,none)}
  .reset{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:5px}
  /* Même trame que la fenêtre principale : une mesure, pas une progression — hachure par
     défaut (blueprint/phosphore), qu'un thème peut remplacer par un aplat ou un dégradé
     (voir themes.css). --provider est réellement hérité ici, contrairement à un alias
     --rail-fill qui figerait var(--provider) invalide à son propre niveau de déclaration. */
  .rail{height:10px;background:rgba(255,255,255,.03);border:1px solid var(--hair);margin-top:7px;overflow:hidden}
  .rail i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--provider) 0 2px,color-mix(in srgb,var(--provider) 45%,transparent) 2px 4px);box-shadow:var(--edge-glow,none);transition:width .3s ease}
  .account-note{margin-top:11px;color:var(--muted);font-size:12px;min-height:24px}
  .account-note.stale{color:var(--amber);font-weight:700}
  .account-note.live{color:var(--green)}
  .extra-credits{margin-top:12px;padding-top:10px;border-top:1px solid var(--hair);font-size:12px}
  .extra-credits span,.extra-credits small{display:block;color:var(--muted)}
  .extra-credits strong{display:block;margin-top:3px;font-variant-numeric:tabular-nums}
  /* Métriques système — mêmes marques que l'onglet Moniteur (paire validée), présence
     conditionnelle : une tuile n'existe que si sa source répond. */
  .metrics{display:flex;gap:1px;background:var(--hair);border-top:1px solid var(--hair-strong);flex:none}
  .mtile{flex:1;background:var(--panel-bg-strong);padding:7px 8px 6px;min-width:0}
  .mtile .mlabel{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .mtile .mvalue{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;margin:1px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mtile svg{display:block;width:100%;height:14px}
  .mtile .line{fill:none;stroke-width:1.5;vector-effect:non-scaling-stroke}
  /* Outils machine — rien à voir avec les quotas, d'où la séparation visuelle nette. */
  .tools{display:flex;gap:1px;background:var(--hair-strong);border-top:1px solid var(--hair-strong);flex:none}
  .tool{flex:1;border:0;background:var(--panel-bg-strong);color:var(--muted);padding:10px 6px;cursor:pointer;font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:5px;text-transform:lowercase;letter-spacing:.05em}
  .tool:hover{background:var(--soft);color:var(--text)}
  .tool.on{color:var(--blue);background:rgba(103,232,249,.12)}
  .tool .glyph{font-size:15px;line-height:1;height:15px;display:flex;align-items:center;justify-content:center}
  /* Pleine largeur, segments à parts égales : la rangée leur appartient entièrement. */
  .segmented{display:flex;border:1px solid var(--hair-strong);overflow:hidden;flex:1}
  .seg{flex:1;border:0;background:transparent;color:var(--muted);padding:6px 4px;cursor:pointer;font:inherit;font-size:12px;border-radius:0;white-space:nowrap;
    /* Un nom de compte peut être long (« contact@venio.paris's Organization ») : il se tronque
       plutôt que d'élargir son segment et d'écraser les autres. */
    overflow:hidden;text-overflow:ellipsis;min-width:0}
  .seg+.seg{border-left:1px solid var(--hair-strong)}
  .seg:hover{background:var(--soft);color:var(--text)}
  .seg.on{background:rgba(103,232,249,.14);color:var(--blue);font-weight:700}
  .account-action{border:1px solid var(--provider);color:var(--provider);background:color-mix(in srgb,var(--provider) 10%,transparent);border-radius:var(--radius);padding:6px 9px;margin-top:9px;cursor:pointer;font-size:12px;font-weight:700}
  /* Deux rangées, et non une : à six segments, le sélecteur ne laissait plus la place au message
     de backoff (« ⚠ pause · retry dans 39 min », 154 px) qui débordait alors le pied de page.
     Le popover a du vide vertical à revendre — mieux vaut le dépenser que tronquer une alerte. */
  .footer{border-top:1px solid var(--hair-strong);display:flex;flex-direction:column;gap:7px;padding:9px 10px;background:var(--panel-bg-strong);flex:none}
  .footer-row{display:flex;align-items:center;gap:6px}
  .footer-row > button.sync{flex:1;min-width:0;text-align:left;color:var(--muted);font-size:12px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid transparent;background:transparent;
    padding:5px 6px;border-radius:var(--radius);cursor:pointer;font-family:inherit}
  .footer-row > button.sync:hover{color:var(--text);border-color:var(--hair);background:var(--soft)}
  .footer-row > button.sync:disabled{cursor:default;opacity:.7}
  .footer-row > button.sync:disabled:hover{color:var(--muted);border-color:transparent;background:transparent}
  /* Ciblé sur les enfants directs de la rangée : « .footer button » l'emportait en spécificité
     sur « .seg » et figeait les segments à leur largeur de contenu. */
  .footer-row > button{border:1px solid transparent;background:transparent;padding:6px 7px;border-radius:var(--radius);cursor:pointer;color:var(--muted);white-space:nowrap;flex:none}
  .footer-row > button:hover{background:var(--soft);border-color:var(--hair);color:var(--text)}
  .footer-row > button.go{color:var(--blue);font-weight:700}
  .empty-value{color:var(--provider);opacity:.55}
  /* Luminosité — rangée compacte sous les outils. Un écran non pilotable est omis ici (voir
     dashboard pour l'état « sans réponse » détaillé) : le popover est trop dense pour l'expliquer. */
  .brightness{display:flex;flex-direction:column;gap:1px;background:var(--hair-strong);border-top:1px solid var(--hair-strong);flex:none}
  .b-row{display:flex;align-items:center;gap:8px;background:var(--panel-bg-strong);padding:7px 10px}
  .b-sun{font-size:12px;color:var(--blue);flex:none;line-height:1}
  /* 116 px, largeur fixe : de quoi lire un nom d'écran en entier (« Écran Retina intégré » tenait
     en « Écran R… » à 44 px), et identique d'une ligne à l'autre pour que les curseurs restent
     alignés quand plusieurs écrans sont branchés. */
  .b-label{font-size:12px;color:var(--muted);width:116px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .b-slider{flex:1;-webkit-appearance:none;appearance:none;height:10px;background:rgba(255,255,255,.04);border:1px solid var(--hair);cursor:pointer}
  .b-slider::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:15px;background:var(--blue);border:1px solid var(--hair-strong);cursor:pointer}
  .b-value{font-size:12px;color:var(--text);width:28px;text-align:right;flex:none;font-variant-numeric:tabular-nums}

  .provider-picker{width:100%;padding:7px 6px;margin:8px 0 4px;background:var(--panel-bg-strong);color:var(--text);border:1px solid var(--hair-strong);border-radius:var(--radius);font:inherit;font-size:12px}
  .primary-rail{margin-top:10px}.rail{height:12px;border-radius:3px}.rail i{background:var(--provider)}
  .reset{font-size:12px}
  .popup-notice{padding:10px 12px;border-bottom:1px solid var(--amber);font-size:12px;color:var(--amber);display:flex;gap:10px;align-items:center;justify-content:space-between;flex:none}.popup-notice button{background:none;border:1px solid var(--amber);border-radius:var(--radius);padding:5px;cursor:pointer}
  button:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.popover{--muted:color-mix(in srgb,var(--text) 75%,var(--bg))}.mac-tools{flex:none;background:var(--panel-bg-strong);border-top:1px solid var(--hair-strong)}.mac-tools>summary{padding:9px 14px;color:var(--text);cursor:pointer}.value.critical{color:var(--danger)}.value.warning{color:var(--amber)}
  .fans{padding:10px 14px 11px;border-top:1px solid var(--hair-strong);background:var(--panel-bg-strong);flex:none}
  .fan-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:7px}
  .fan-head strong{font-size:12px;text-transform:lowercase;letter-spacing:.06em;color:var(--text)}
  .fan-head span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .fan-row{display:flex;align-items:center;gap:8px;margin-top:6px}
  .fan-row .account-action{--provider:var(--blue);margin-top:0;flex:none;padding:7px 12px}
  .fan-state{flex:1;font-size:12px;font-weight:700;color:var(--muted)}.fan-state.on{color:var(--blue)}
  .fan-note{display:block;color:var(--muted);font-size:12px;margin-top:7px;line-height:1.4}
  /* Cartes fournisseur côte à côte : volume hebdo en grand, jauge, renouvellement, puis la 5 h. */
  .providers{display:grid;grid-template-columns:1fr 1fr;align-items:stretch;align-content:start;gap:10px;padding:12px;flex:1;min-height:0;overflow-y:auto}
  .quota-card{background:var(--panel-bg);border:1px solid var(--hair);border-top:2px solid var(--provider);border-radius:var(--radius);padding:12px 12px 10px;min-width:0;display:flex;flex-direction:column}
  .quota-card header{display:flex;flex-direction:column;align-items:stretch;gap:6px;margin-bottom:10px;min-width:0}
  .provider-name{font-size:12px;font-weight:700;color:var(--provider);text-transform:lowercase;letter-spacing:.06em}
  .account-name{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .quota-card .provider-picker{margin:0;width:100%;padding:4px 6px}
  .quota-main{display:flex;flex-direction:column;gap:6px}
  .quota-main .value{font-size:40px}
  .quota-side{min-width:0}
  .quota-label{font-size:12px;color:var(--muted)}
  .quota-side .primary-rail{margin-top:6px}
  .quota-side .reset{margin-top:6px}
  .session-row{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"l v" "r r" "t t";align-items:center;gap:5px 8px;margin-top:10px;padding-top:9px;border-top:1px solid var(--hair);font-size:12px;color:var(--muted)}
  .session-row>span{grid-area:l}.session-row>b{grid-area:v;justify-self:end;color:var(--text);font-variant-numeric:tabular-nums}
  .session-row>.rail{grid-area:r}.session-row>small{grid-area:t;font-size:12px;font-variant-numeric:tabular-nums}
  .rail.thin{height:6px;margin:0;border-radius:3px}
  .quota-card footer{display:flex;flex-direction:column;align-items:flex-start;gap:3px;margin-top:auto;padding-top:10px;min-width:0;width:100%}
  .quota-card .account-note{margin:0;min-height:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.quota-card .who{color:var(--text);font-weight:700;font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .quota-card .account-action{margin:0}
  .quota-card .extra-credits{margin-top:10px;padding-top:9px}
</style>
</head>
<body>
<div class="popover"><div id="notificationNotice"></div><div class="providers" id="providers"></div><div id="fanControls"></div><details class="mac-tools"><summary>Outils du Mac</summary><div class="metrics" id="metrics"></div><div class="brightness" id="brightness"></div><div class="tools" id="tools"></div></details><footer class="footer"><div class="footer-row"><button class="sync" id="sync" onclick="send('refresh')" title="Actualiser maintenant — ignore la pause en cas d'erreurs répétées">maj…</button><button class="go" onclick="send('openDashboard')">ouvrir</button><button onclick="send('quit')" style="color:var(--danger)" title="Quitter Status">×</button></div></footer></div>
<script>
const send=(action,extra={})=>window.webkit?.messageHandlers?.native?.postMessage({action,...extra});
document.querySelector('.mac-tools').addEventListener('toggle',event=>
  send('setMacToolsVisible',{visible:event.currentTarget.open}));
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isSession=w=>w&&(w.windowId==='five_hour'||w.durationMinutes===300||w.label==='5 h');
const isWeekly=w=>w&&(String(w.windowId||'').startsWith('seven_day')||w.durationMinutes===10080||w.label==='Semaine'||w.label==='7 jours');
// Sous-quota hebdo dédié à un modèle (seven_day_scoped_fable) : un compteur à part, exclu de la
// jauge « Semaine » — le max avec lui ferait dire à la jauge autre chose que la carte 7 jours.
// Le max reste voulu entre limites GÉNÉRALES (OpenAI en expose plusieurs : afficher la première
// venue montrerait 1 % pendant que l'autre est à 84 %).
const isCodexSpark=w=>/spark/i.test(`${w?.windowId||''} ${w?.label||''}`);
const isScopedWeekly=w=>isWeekly(w)&&String(w?.windowId||'').includes('scoped');
const mainWeekly=windows=>(windows||[]).filter(w=>isWeekly(w)&&!isScopedWeekly(w)&&!isCodexSpark(w)).sort((a,b)=>(used(b)??0)-(used(a)??0))[0]??null;
const isFable=w=>w&&(/fable/i.test(w.label||'')||/fable/i.test(w.windowId||''));
const used=w=>w?Math.max(0,Math.min(100,Math.round(Number(w.usedPercent)))):null;
const reset=w=>{
  if(!w?.resetsAt)return '—';
  const s=w.resetsAt-Date.now()/1000;
  if(s<=0)return 'réinitialisé';
  const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
  if(d>0)return `dans ${d} j ${h} h`;
  if(h>0)return `dans ${h} h ${String(m).padStart(2,'0')}`;
  return `dans ${m} min`;
};
const ageLabel=timestamp=>{if(!timestamp)return '';const min=Math.max(0,Math.round((Date.now()/1000-timestamp)/60));return min<1?'à l’instant':min<60?`il y a ${min} min`:`il y a ${Math.round(min/60)} h`};
// Le popover garde deux colonnes, une par fournisseur, et y montre le compte le plus contraint —
// celui sur lequel il y a quelque chose à décider. La grille tient huit rangées en face l'une de
// l'autre : y empiler N comptes la ferait éclater, et le détail par compte a déjà sa place dans le
// tableau de bord. Le nom du compte retenu est affiché dès qu'il y en a plusieurs, sans quoi le
// chiffre ne dirait pas de qui il parle.
function pickAccount(accounts,metric){
  // Un compte épinglé prime : sans cela, basculer depuis la rangée « compte » ne changerait rien
  // à l'écran et le geste n'aurait aucun retour.
  const m=parseMetric(metric);
  if(m.accountId){
    const pinned=(accounts||[]).find(a=>a.accountId===m.accountId);
    if(pinned)return pinned;
  }
  let best=null,bestValue=-1;
  (accounts||[]).forEach(account=>{
    const value=used(mainWeekly(account.windows||[]));
    if(value!==null&&value>bestValue){best=account;bestValue=value;}
  });
  return best||(accounts||[])[0]||null;
}
function selectPopupAccount(provider,accountId){
  if(!accountId)return send('setMenuBarMetric',{value:aggregateMetric(provider,'weekly')});
  if(!lastData?.accounts?.some(a=>a.provider===provider&&a.accountId===accountId))return;
  send('setMenuBarMetric',{value:pinnedMetric(provider,accountId,'weekly')});
}
function quotaRail(window,primary=false){
  const value=used(window);
  if(value===null||!Number.isFinite(value))return '';
  const color=value>=95?'var(--danger)':value>=80?'var(--amber)':'var(--provider)';
  return `<div class="rail ${primary?'primary-rail':''}" role="meter" aria-label="${esc(window.label||window.windowId||'Quota')} consommé" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${value}" aria-valuetext="${value} % consommé, ${100-value} % restant"><i style="width:${value}%;background:${color}"></i></div>`;
}
function extraCredits(account){
  if(!account)return '';
  const c=account.extraCredits||{},finite=n=>typeof n==='number'&&Number.isFinite(n);
  const fmt=n=>new Intl.NumberFormat('fr-FR',{maximumFractionDigits:2}).format(n);
  let value='Solde indisponible',detail='';
  if(c.status==='known'&&c.unit==='credits'){
    value=c.unlimited?'Crédits illimités':finite(c.balance)?`${fmt(c.balance)} crédits restants`:
      c.hasCredits===false?'Aucun crédit supplémentaire':'Solde indisponible';
  }else if(c.status==='known'&&c.unit==='money'){
    const currency=c.balanceCurrency||c.currency;
    if(finite(c.balance))value=c.balance===0?'Aucun crédit supplémentaire':
      `${/^[A-Z]{3}$/.test(currency||'')?new Intl.NumberFormat('fr-FR',{style:'currency',currency}).format(c.balance):`${fmt(c.balance)} (devise non fournie)`} restants`;
    if(c.enabled===false)detail='Usage supplémentaire désactivé';
  }
  if(c.observedAt&&Date.now()/1000-c.observedAt>120)
    detail=[detail,`Relevé ${ageLabel(c.observedAt)}`].filter(Boolean).join(' · ');
  if(c.status!=='known'||value==='Solde indisponible')return '';  // rien d'utile à dire
  return `<div class="extra-credits"><span>Crédits supplémentaires</span><strong>${esc(value)}</strong>${detail?`<small>${esc(detail)}</small>`:''}</div>`;
}
// Une carte par fournisseur, pleine largeur : le volume hebdo restant en grand, sa jauge et son
// renouvellement ; la fenêtre 5 h de Claude en ligne compacte. Ni prévision, ni historique de
// reset, ni sous-quota Fable : seul ce qui fait décider reste.
function provider(id,name,accounts,metric){
  const account=pickAccount(accounts,metric);
  const windows=(account?.windows||[]).filter(w=>!(id==='openai'&&isCodexSpark(w))&&!isFable(w)&&!isScopedWeekly(w)&&typeof w.usedPercent==='number'&&Number.isFinite(w.usedPercent)&&Number(w.resetsAt)>Date.now()/1000);
  const weekly=mainWeekly(windows),session=windows.find(isSession);
  const connected=id==='openai'||['code','web'].includes(account?.claudeSource)?Boolean(account?.connected):Boolean(account?.cookieConfigured&&account?.orgId);
  const ink=id==='openai'?'var(--blue)':'var(--purple)';
  const old=account?.stale||(account?.capturedAt&&Date.now()/1000-account.capturedAt>1800);
  const note=!connected?'non connecté':account?.liveSource?'⟳ en direct':old?`⚠ mesure ancienne · ${ageLabel(account.capturedAt)}`:account?.capturedAt?`mesure ${ageLabel(account.capturedAt)}`:'connecté · en attente';
  const noteClass=account?.liveSource?'live':old?'stale':'';
  const value=used(weekly),level=value===null?'empty-value':value>=95?'critical':value>=80?'warning':'';
  const pinned=parseMetric(metric).accountId;
  // « le plus contraint » = agrégat : la carte suit seule le compte le plus entamé.
  const picker=(accounts||[]).length>1?`<select class="provider-picker" aria-label="Compte ${name}" onchange="selectPopupAccount('${id}',this.value);this.blur()"><option value="" ${!pinned?'selected':''}>Le plus entamé</option>${accounts.map(a=>`<option value="${esc(a.accountId)}" ${pinned&&a.accountId===account?.accountId?'selected':''}>${esc(a.label)}</option>`).join('')}</select>`
    :account?`<span class="account-name">${esc(account.label)}</span>`:'';
  const action=!connected?`<button class="account-action" onclick="send('${account?(id==='openai'?'loginOpenAI':'connectClaudeWeb'):'addAccount'}',${account?`{accountId:'${account.accountId}'}`:`{provider:'${id}'}`})">${account?'connecter':'ajouter un compte'}</button>`:'';
  const sessionRow=session?`<div class="session-row"><span>5 h</span><div class="rail thin"><i style="width:${used(session)}%"></i></div><b>${100-used(session)} %</b><small>${reset(session)}</small></div>`:'';
  return `<section class="quota-card" style="--provider:${ink}">
    <header><span class="provider-name">${name}</span>${picker}</header>
    <div class="quota-main"><div class="value ${level}">${value===null?'—':(100-value)+'<span class="unit">%</span>'}</div>
      <div class="quota-side"><div class="quota-label">restant cette semaine</div>${quotaRail(weekly,true)}<div class="reset">${weekly?'Renouvellement '+reset(weekly):'—'}</div></div></div>
    ${sessionRow}${extraCredits(account)}
    <footer>${(accounts||[]).length>1&&!pinned&&account?`<b class="who" title="${esc(account.label)}">${esc(account.label)}</b>`:''}<span class="account-note ${noteClass}">${note}</span>${action}</footer></section>`;
}
// Le clavier est dessiné, pas écrit : U+2328 (⌨) n'a pas de glyphe dans la police système et
// macOS le rendait en rectangle vide. La lune, elle, existe bel et bien.
const GLYPH_KEYBOARD='<svg viewBox="0 0 20 14" width="17" height="12" fill="none" stroke="currentColor" stroke-width="1.3">'
  +'<rect x="1" y="1" width="18" height="12" rx="2"/><path d="M4.5 5h1M8 5h1M11.5 5h1M15 5h1M4.5 8h1M8 8h1M11.5 8h1M15 8h1M6.5 10.7h7" stroke-linecap="round"/></svg>';
function tools(t){
  const btn=(action,glyph,label,active)=>`<button class="tool ${active?'on':''}" onclick="send('${action}')"><span class="glyph">${glyph}</span>${label}</button>`;
  const awake=t?.awake||{},lock=t?.keyboardLock||{},lid=t?.lidMode||{};
  // « blocked » = permission Accessibilité refusée : le libellé le dit, et re-cliquer re-tente
  // après l'avoir accordée dans Réglages système.
  return btn('showLidMode','▱',lid.active&&!lid.unconfirmed?'capot · '+Math.ceil((lid.remainingSeconds||0)/60)+' min':'capot fermé',lid.active&&!lid.unconfirmed)
    +btn('toggleAwake','☾',awake.active?'veille bloquée':'veille',awake.active)
    +btn('toggleKeyboardLock',GLYPH_KEYBOARD,lock.state==='blocked'?'autoriser l’accès':'nettoyage',lock.state==='locked');
}
// Ventilateurs : palier (60 %, 80 %, max) et durée choisis d'un geste, sans champ à saisir. Le
// natif borne et revalide tout ; le service vérifie la vitesse réelle et rend la main à macOS.
let fanPercent=100,fanMinutes=15;
const FAN_LEVELS=[[60,'60 %'],[80,'80 %'],[100,'Max']],FAN_DURATIONS=[15,30,60];
function setFanChoice(kind,value){if(kind==='percent')fanPercent=value;else fanMinutes=value;if(lastData)renderMenu(lastData);}
function startFanBoost(){if(FAN_DURATIONS.includes(fanMinutes)&&FAN_LEVELS.some(([p])=>p===fanPercent))send('startFanBoost',{minutes:fanMinutes,percent:fanPercent});}
const fanLevelLabel=p=>p>=100?'Max':p+' %';
function fanControls(tools){
  const lid=tools?.lidMode||{},f=lid.fanBoost||{},service=lid.authorized&&f.version===2&&!lid.unconfirmed;
  const active=f.active===true,needsStop=active||f.restorationPending||lid.unconfirmed||f.manualOutsideBoost;
  const rpm=(f.fans||[]).map(v=>Math.round(v.rpm).toLocaleString('fr-FR')).join(' · ');
  const seg=(kind,value,label,on)=>`<button class="seg ${on?'on':''}" onclick="setFanChoice('${kind}',${value})">${label}</button>`;
  let body,note=f.message||'';
  if(needsStop){
    const state=lid.unconfirmed?'État à vérifier':active?`${f.verified?'Boost':'Montée'} ${fanLevelLabel(f.percent||100)} · ${Math.ceil((f.remainingSeconds||0)/60)} min`:f.manualOutsideBoost?'Ventilateur en manuel':'Retour à vérifier';
    body=`<div class="fan-row"><span class="fan-state ${active&&f.verified?'on':''}">${state}</span><button class="account-action" ${!service||lid.busy?'disabled':''} onclick="send('stopFanBoost')">Auto Apple</button></div>`;
    if(lid.unconfirmed)note=lid.message||note;
  }else if(service){
    body=`<div class="fan-row"><span class="segmented">${FAN_LEVELS.map(([p,l])=>seg('percent',p,l,fanPercent===p)).join('')}</span></div>
      <div class="fan-row"><span class="segmented">${FAN_DURATIONS.map(m=>seg('minutes',m,m+' min',fanMinutes===m)).join('')}</span><button class="account-action" ${lid.busy?'disabled':''} onclick="startFanBoost()">Boost</button></div>`;
    note=note&&note!=='Auto Apple'?note:'Auto Apple · macOS pilote les ventilateurs.';
  }else{
    body=`<div class="fan-row"><button class="account-action" onclick="send('authorizeLidMode')">${lid.authorized?'Mettre le service à jour':'Autoriser le service macOS'}</button></div>`;
    note=lid.authorized?'Service à mettre à jour pour piloter les ventilateurs.':'Le contrôle passe par le service Status, installé une fois.';
  }
  return `<div class="fans"><div class="fan-head"><strong>Ventilateurs</strong><span>${rpm?esc(rpm)+' tr/min':''}</span></div>${body}<small class="fan-note" role="status">${esc(note)}</small></div>`;
}
// Un curseur par écran pilotable, les non-pilotables omis (popover trop dense pour l'état « sans
// réponse » détaillé — voir le tableau de bord). Nom tronqué par CSS, pas ici : le survol du
// popover ne montre pas de tooltip fiable en WKWebView.
function brightnessRow(displays){
  const pilotable=(displays||[]).filter(d=>d.available);
  if(!pilotable.length)return '';
  // Un glyphe ☀ ouvre la section : le curseur se lit alors comme « luminosité », pas comme une
  // jauge quelconque. Interne et externes (dont les écrans Apple) apparaissent chacun sur sa ligne,
  // puis le rétroéclairage du clavier (kind « keyboard »), signalé par ⌨ au lieu de ☀.
  return pilotable.map(d=>`<div class="b-row"><span class="b-sun" title="${d.kind==='keyboard'?'Rétroéclairage':'Luminosité'} — ${esc(d.name)}">${d.kind==='keyboard'?'⌨':'☀'}</span><span class="b-label" title="${esc(d.name)}">${esc(d.name)}</span><input type="range" class="b-slider" min="0" max="100" value="${d.brightness??0}" oninput="this.nextElementSibling.textContent=this.value+' %'" onchange="send('setBrightness',{id:'${d.id}',value:Number(this.value)})"><span class="b-value">${d.brightness??0} %</span></div>`).join('');
}
// Grammaire de menuBarMetric, identique à celle du natif (voir StatusQuota.h) :
//   "lowest" | "<provider>:<kind>" (agrégat) | "acct:<provider>:<accountId>:<kind>" (épinglé).
// Le popover la décompose en deux choix distincts — quelle fenêtre, quel compte — parce que ce
// sont deux décisions différentes : une liste unique « compte × fenêtre » ferait dix boutons
// dans 400 px.
function parseMetric(metric){
  const value=metric||'claude:weekly';
  if(value.startsWith('system:'))return {system:true,value};
  const parts=value.split(':');
  if(value.startsWith('acct:')&&parts.length>=4)
    return {provider:parts[1],accountId:parts[2],kind:parts.slice(3).join(':'),value};
  if(parts.length>=2)return {provider:parts[0],kind:parts.slice(1).join(':'),value};
  return {lowest:true,value};
}
const aggregateMetric=(provider,kind)=>`${provider}:${kind}`;
const pinnedMetric=(provider,accountId,kind)=>`acct:${provider}:${accountId}:${kind}`;
let lastData=null;
// Le service pousse un état toutes les 5 s (tours/minute des ventilateurs) : réécrire un bloc
// à chaque fois détruisait le <select> de compte ouvert et effaçait une durée en cours de saisie.
// On ne remplace donc que ce qui a changé, et jamais un bloc dont un champ a le focus — il sera
// redessiné à sa sortie (blur).
function setHTML(selector,html){
  const el=document.querySelector(selector);
  if(el.dataset.html===html)return;
  const focused=document.activeElement;
  if(focused&&el.contains(focused)&&/^(SELECT|INPUT)$/.test(focused.tagName))return;
  el.innerHTML=html;el.dataset.html=html;
}
document.addEventListener('focusout',e=>{if(lastData&&/^(SELECT|INPUT)$/.test(e.target.tagName))setTimeout(()=>renderMenu(lastData),0);});
// Un clic dans un popover ouvert au survol l'épingle : sans cela, le menu natif du sélecteur de
// compte, qui déborde du popover, faisait croire à une sortie de la souris et tout se refermait.
document.addEventListener('pointerdown',()=>send('pinPopover'),true);
function renderMenu(data){
  document.documentElement.dataset.theme=data.prefs?.theme||'blueprint';
  const accounts=data.accounts||[];
  const of=providerId=>accounts.filter(a=>a.provider===providerId);
  const metric=data.prefs?.menuBarMetric||'claude:weekly';
  setHTML('#notificationNotice',data.prefs?.notificationsAuthorized===false?`<div class="popup-notice"><span>Alertes désactivées sur ce Mac</span><button onclick="send('openNotificationSettings')">Réglages</button></div>`:'');
  setHTML('#providers',provider('openai','OpenAI',of('openai'),data.prefs?.providerMenuMetrics?.openai||metric)+provider('claude','Claude',of('claude'),data.prefs?.providerMenuMetrics?.claude||metric));
  setHTML('#brightness',brightnessRow(data.displays));
  setHTML('#tools',tools(data.tools));
  setHTML('#fanControls',fanControls(data.tools));
  const sync=document.querySelector('#sync');
  sync.textContent=data.refreshing
    ? 'actualisation…'
    : data.backoffUntil
      ? `⚠ pause · retry ${reset({resetsAt:data.backoffUntil/1000})}`
      : `maj ${new Intl.DateTimeFormat('fr-FR',{hour:'2-digit',minute:'2-digit'}).format(new Date(data.updatedAt))}`;
  sync.disabled=Boolean(data.refreshing);
}
// Métriques système : flux séparé, poussé à 1 Hz par le natif tant que le popover est ouvert.
const CHART_A='#0891B2',CHART_B='#8B5CF6';
const fmtBytes=v=>{if(v==null||isNaN(v))return '—';const units=['o/s','Ko/s','Mo/s','Go/s'];let i=0;while(v>=1024&&i<units.length-1){v/=1024;i++}return (i&&v<10?v.toFixed(1):Math.round(v))+' '+units[i]};
function miniChart(family,specs,percent){
  const drawn=specs.map(s=>({...s,values:family.series?.[s.key]||[]})).filter(s=>s.values.length>1);
  if(!drawn.length)return '';
  const w=80,h=14,len=Math.max(...drawn.map(s=>s.values.length));
  const max=percent?100:Math.max(1,...drawn.flatMap(s=>s.values));
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${drawn.map(s=>{const offset=len-s.values.length;
    return `<path class="line" stroke="${s.color}" d="${s.values.map((v,i)=>`${i?'L':'M'}${((offset+i)/(len-1)*w).toFixed(1)},${(h-Math.min(v,max)/max*h).toFixed(1)}`).join(' ')}"/>`}).join('')}</svg>`;
}
function renderMetrics(data){
  const familyById=id=>data?.families?.find(f=>f.id===id);
  const tiles=[];
  const pctTile=(id,label)=>{const family=familyById(id);if(!family)return;const key=id==='gpu'?'usage':id==='ram'?'usedPercent':'total';
    tiles.push(`<div class="mtile"><div class="mlabel">${label}</div><div class="mvalue">${family.now[key]==null?'—':Math.round(family.now[key])+' %'}</div>${miniChart(family,[{key,color:CHART_A}],true)}</div>`)};
  pctTile('cpu','cpu');pctTile('gpu','gpu');pctTile('ram','mém');
  const network=familyById('network');
  if(network)tiles.push(`<div class="mtile"><div class="mlabel">réseau ↓↑</div><div class="mvalue">${fmtBytes(network.now.rxBytesPerSec)}</div>${miniChart(network,[{key:'rxBytesPerSec',color:CHART_A},{key:'txBytesPerSec',color:CHART_B}],false)}</div>`);
  const sensors=familyById('sensors');
  if(sensors?.now.tempC!=null)tiles.push(`<div class="mtile"><div class="mlabel">temp</div><div class="mvalue">${Math.round(sensors.now.tempC)} °C</div>${miniChart(sensors,[{key:'tempC',color:CHART_A}],true)}</div>`);
  document.querySelector('#metrics').innerHTML=tiles.join('');
}
// Tick incrémental : même mécanique que dashboard.html — le natif n'envoie les séries qu'à
// l'ouverture, ensuite `now` seul et la série glisse ici (plafond 300, comme l'anneau natif).
const METRICS_RING=300;
let lastMetrics=null;
function mergeMetricsDelta(state,payload){
  if(!payload?.delta)return payload;
  if(!state)return null;
  const families=(payload.families||[]).map(d=>{
    const prev=(state.families||[]).find(f=>f.id===d.id);
    const series={...(prev?.series||{})};
    for(const[k,v]of Object.entries(d.now||{})){
      if(typeof v!=='number')continue;
      const grown=(series[k]||[]).concat(v);
      series[k]=grown.length>METRICS_RING?grown.slice(grown.length-METRICS_RING):grown;
    }
    return{...d,series};
  });
  const merged={...state,...payload,families};
  delete merged.delta;
  return merged;
}
window.StatusMenu={update(data){lastData=data;renderMenu(data)},patch(part){if(!lastData)return;lastData={...lastData,...part};renderMenu(lastData)},updateMetrics(data){const m=mergeMetricsDelta(lastMetrics,data);if(m){lastMetrics=m;renderMetrics(m)}}};
// Keep the "dans X min" countdowns honest between polls.
setInterval(()=>{if(lastData)renderMenu(lastData)},30000);
</script>
</body>
</html>

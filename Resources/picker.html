<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="themes.css">
<script src="i18n.js"></script>
<style>
  /* Le thème actif est posé sur <html> par le natif, comme pour le tableau de bord : le
     sélecteur suit donc Synthwave ou Phosphore sans une ligne de CSS en double. */
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font:12.5px/1.4 var(--font)}
  .panel{height:100%;display:flex;flex-direction:column;border:1px solid var(--hair-strong);border-radius:var(--radius)}
  /* Aperçu : deux rectangles au rapport demandé. On voit le résultat avant de valider. */
  .preview{display:flex;gap:3px;padding:14px 14px 12px;border-bottom:1px solid var(--hair);flex:none;height:96px}
  .slot{border:1px solid var(--hair-strong);border-radius:2px;display:flex;flex-direction:column;
    justify-content:flex-end;padding:7px 8px;min-width:0;overflow:hidden}
  .slot.active{background:color-mix(in srgb,var(--blue) 14%,transparent);border-color:var(--blue)}
  .slot.partner{background:color-mix(in srgb,var(--purple) 14%,transparent);border-color:var(--purple)}
  .slot .role{font-size:8.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
  .slot .who{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .slot.active .who{color:var(--blue)}
  .slot.partner .who{color:var(--purple)}
  input{width:100%;border:0;border-bottom:1px solid var(--hair);background:transparent;color:var(--text);
    font:inherit;padding:11px 14px;outline:none;flex:none}
  input::placeholder{color:var(--muted)}
  .list{flex:1;overflow-y:auto;padding:5px 0}
  .row{display:flex;align-items:baseline;gap:9px;padding:7px 14px;cursor:pointer;border-left:2px solid transparent}
  .row.on{background:var(--soft-hover);border-left-color:var(--purple)}
  .row .app{font-weight:700;color:var(--text);white-space:nowrap;flex:none}
  .row .title{color:var(--muted);font-size:11px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .empty{padding:26px 14px;text-align:center;color:var(--muted);font-size:11px;line-height:1.5}
  .footer{border-top:1px solid var(--hair);padding:8px 14px;color:var(--muted);font-size:9.5px;
    display:flex;gap:14px;flex:none}
  .footer kbd{font:inherit;color:var(--text);background:var(--soft);border:1px solid var(--hair);
    border-radius:2px;padding:1px 5px;margin-right:4px}
</style>
</head>
<body>
<div class="panel">
  <div class="preview" id="preview"></div>
  <input id="filtre" data-i18n-placeholder="picker.filter" autofocus>
  <div class="list" id="list"></div>
  <div class="footer">
    <span><kbd>↑↓</kbd><span data-i18n="picker.navigate"></span></span><span><kbd>↩</kbd><span data-i18n="picker.place"></span></span><span><kbd>esc</kbd><span data-i18n="picker.cancel"></span></span>
  </div>
</div>
<script>
const send=(action,extra={})=>window.webkit?.messageHandlers?.native?.postMessage({action,...extra});
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PARTS={'duo-half':[50,50],'duo-two-thirds':[67,33],'duo-third':[33,67]};

let fenetres=[], filtre='', index=0, split='duo-half', activeApp='';

const visibles=()=>{
  const q=filtre.trim().toLowerCase();
  if(!q)return fenetres;
  return fenetres.filter(w=>(w.appName+' '+w.title).toLowerCase().includes(q));
};

function rendre(){
  const liste=visibles();
  if(index>=liste.length)index=Math.max(0,liste.length-1);
  const choisie=liste[index];
  const [a,b]=PARTS[split]||[50,50];
  document.querySelector('#preview').innerHTML=
    `<div class="slot active" style="flex:${a}"><span class="role">${t('picker.roleActive')}</span><span class="who">${esc(activeApp||'—')}</span></div>`+
    `<div class="slot partner" style="flex:${b}"><span class="role">${t('picker.rolePartner')}</span><span class="who">${esc(choisie?choisie.appName:'—')}</span></div>`;

  document.querySelector('#list').innerHTML=liste.length
    ? liste.map((w,i)=>`<div class="row ${i===index?'on':''}" data-i="${i}"><span class="app">${esc(w.appName)}</span><span class="title">${esc(w.title)}</span></div>`).join('')
    : `<div class="empty">${t(fenetres.length?'picker.noMatch':'picker.noWindows')}</div>`;

  document.querySelectorAll('.row').forEach(r=>r.onclick=()=>{index=+r.dataset.i;valider()});
  const on=document.querySelector('.row.on');
  if(on)on.scrollIntoView({block:'nearest'});
}

function valider(){
  const choisie=visibles()[index];
  if(choisie)send('duoPick',{index:choisie.index});
}

document.querySelector('#filtre').addEventListener('input',e=>{filtre=e.target.value;index=0;rendre()});
// Les flèches et Entrée sont interceptées ici plutôt que dans le champ, pour que la navigation
// fonctionne quel que soit l'endroit où le focus se trouve dans le panneau.
document.addEventListener('keydown',e=>{
  const liste=visibles();
  if(e.key==='ArrowDown'){index=Math.min(index+1,liste.length-1);rendre();e.preventDefault()}
  else if(e.key==='ArrowUp'){index=Math.max(index-1,0);rendre();e.preventDefault()}
  else if(e.key==='Enter'){valider();e.preventDefault()}
  else if(e.key==='Escape'){send('duoCancel');e.preventDefault()}
});

// Appelé par le natif à chaque ouverture : la liste des fenêtres change entre deux invocations.
window.StatusPicker={open(data){
  fenetres=(data.windows||[]).map((w,i)=>({...w,index:i}));
  split=data.split||'duo-half';
  activeApp=data.activeApp||'';
  filtre=''; index=0;
  const champ=document.querySelector('#filtre');
  champ.value=''; champ.focus();
  rendre();
}};
StatusI18n.onChange(()=>{StatusI18n.apply();rendre()});
StatusI18n.apply();
rendre();
</script>
</body>
</html>
